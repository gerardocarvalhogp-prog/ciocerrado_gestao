<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Patrocinador · CIO Cerrado</title>
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="assets/icons/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-system.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/design-system.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--papel);
  color:var(--texto);
  font-family:'Public Sans',system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ---------- estrutura ---------- */
.topo{
  background:var(--verde);color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;
}
.marca{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.01em;font-size:16px;}
.marca span{
  display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;
}
.topo-dir{display:flex;align-items:center;gap:12px;font-size:13px;}
.topo-dir .quem{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.85;}
.sair{
  background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:var(--raio);padding:5px 11px;font-size:12px;
}
.sair:hover{background:rgba(255,255,255,.1);}

.wrap{max-width:940px;margin:0 auto;padding:26px 20px 80px;}

.abas{
  display:flex;gap:2px;border-bottom:1px solid var(--linha);
  margin-bottom:26px;overflow-x:auto;
}
.aba{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:10px 14px;font-size:14px;color:var(--suave);white-space:nowrap;
}
.aba[aria-selected="true"]{color:var(--verde);border-bottom-color:var(--verde);font-weight:600;}

h1{font-family:'Archivo',sans-serif;font-size:24px;margin:0 0 4px;letter-spacing:-.015em;}
h2{font-family:'Archivo',sans-serif;font-size:17px;margin:0 0 10px;}
.sub{color:var(--suave);font-size:13.5px;margin:0 0 22px;}

.cartao-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.cartao h3{font-family:'Archivo',sans-serif;font-size:15px;margin:0 0 2px;}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--suave);}

.selo{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  padding:3px 9px;border-radius:20px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.04em;
}
.selo.ok{background:#E4F0EA;color:var(--verde-med);}
.selo.pend{background:#EFEFEA;color:var(--suave);}
.selo.vez{background:#F7EFD9;color:var(--ouro);font-weight:600;}

/* ---------- formulários ---------- */
label{display:block;font-size:12px;color:var(--suave);margin-bottom:3px;}
input[type=text],input[type=email],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--linha);
  border-radius:var(--raio);font-family:inherit;font-size:14px;
  background:var(--superficie);color:var(--texto);
}
textarea{min-height:64px;resize:vertical;}
.linha{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.linha > div{flex:1;min-width:130px;}
.check{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--texto);}
.check input{width:auto;margin:0;}

.btn{
  background:var(--verde);color:#fff;border:none;
  border-radius:var(--raio);padding:9px 16px;font-size:14px;font-weight:500;
}
.btn:hover{background:#0E241F;}
.btn:disabled{background:#A9B5B0;cursor:not-allowed;}
.btn.sec{background:transparent;color:var(--verde);border:1px solid var(--linha);}
.btn.sec:hover{background:#F1F3EE;}
.btn.mini{padding:5px 11px;font-size:12.5px;}
.btn.perigo{background:transparent;color:var(--erro);border:1px solid #E4CFCB;}

/* ---------- fila de escolha (signature) ---------- */
.fila{
  background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--raio);padding:16px;margin-bottom:14px;
}
.fila-trilho{
  display:flex;align-items:stretch;gap:0;margin:14px 0 6px;
  overflow-x:auto;padding-bottom:4px;
}
.fila-passo{
  flex:1;min-width:92px;padding:9px 10px;
  border-top:3px solid var(--linha);
}
.fila-passo .n{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--suave);
}
.fila-passo .q{font-family:'Archivo',sans-serif;font-size:13.5px;margin-top:2px;}
.fila-passo.passou{border-top-color:var(--verde-med);}
.fila-passo.passou .q{color:var(--suave);}
.fila-passo.aqui{border-top-color:var(--ouro);}
.fila-passo.aqui .n{color:var(--ouro);font-weight:600;}
.fila-passo.aqui .q{font-weight:700;color:var(--verde);}
.fila-nota{font-size:13px;color:var(--suave);margin:0;}
.sel-empresa{
  margin-top:8px;padding:6px 10px;border:1px solid var(--linha);
  border-radius:var(--raio);font-family:inherit;font-size:13.5px;
  background:var(--superficie);color:var(--texto);}

/* ---------- avisos ---------- */
.aviso{
  border-radius:var(--raio);padding:11px 13px;font-size:13.5px;margin-bottom:14px;
  border:1px solid var(--linha);background:var(--superficie);
}
.aviso.erro{background:#FBF0EE;border-color:#E4CFCB;color:var(--erro);}
.aviso.ok{background:#E8F2EC;border-color:#C9E0D4;color:var(--verde-med);}
.vazio{
  border:1px dashed var(--linha);border-radius:var(--raio);
  padding:24px;text-align:center;color:var(--suave);font-size:14px;
}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-family:'IBM Plex Mono',monospace;font-weight:500;
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--suave);border-bottom:1px solid var(--linha);padding:7px 6px;
}
td{padding:8px 6px;border-bottom:1px solid #F0F1EC;}

.oculto{display:none !important;}
.carregando{color:var(--suave);font-size:13.5px;padding:20px 0;}

/* ---------- login ---------- */
.login{max-width:380px;margin:12vh auto;padding:0 20px;}
.login .cartao{padding:26px;}
.login h1{font-size:21px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="tela-login" class="login">
  <div class="cartao">
    <h1>Portal do Patrocinador</h1>
    <p class="sub">Entre com o e-mail cadastrado pela sua empresa. Entre com seu e-mail e senha.</p>
    <div id="login-aviso"></div>
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="voce@empresa.com.br" autocomplete="email">
    <div style="margin-top:12px;">
      <label for="senha" style="margin-top:10px;">Senha</label>
      <input type="password" id="senha" placeholder="sua senha" autocomplete="current-password">
      <button class="btn" id="btn-entrar" style="width:100%;margin-top:12px;">Entrar</button>
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:10px;">
        <button class="btn sec mini" id="btn-esqueci">Esqueci minha senha</button>
        <button class="btn sec mini" id="btn-criar-senha">Criar senha</button>
      </div>
      <p class="meta" style="margin-top:12px;">
        Primeiro acesso? Use <strong>Criar senha</strong> com o e-mail que a
        organização cadastrou. Se preferir entrar sem senha,
        <a href="#" id="link-otp">receba um link por e-mail</a>.
      </p>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="oculto">
  <header class="topo">
    <div class="marca">CIO Cerrado<span>Portal do patrocinador</span></div>
    <div class="topo-dir">
      <span class="quem" id="quem"></span>
      <button class="sair" id="btn-senha" title="Trocar minha senha">Senha</button>
      <button class="sair" id="btn-sair">Sair</button>
    </div>
  </header>

  <div class="wrap">
    <div id="cabecalho"></div>

    <div class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="quartos" aria-selected="true">Quartos</button>
      <button class="aba" role="tab" data-aba="mesa" aria-selected="false">Mesa redonda</button>
      <button class="aba" role="tab" data-aba="indicacoes" aria-selected="false">Indicar CIO</button>
      <button class="aba" role="tab" data-aba="brindes" aria-selected="false">Brindes</button>
      <button class="aba" role="tab" data-aba="convidados" aria-selected="false">Convidados</button>
      <button class="aba" role="tab" data-aba="financeiro" aria-selected="false">Financeiro</button>
      <button class="aba" role="tab" data-aba="manual" aria-selected="false">Manual</button>
    </div>

    <div id="aviso-global"></div>

    <section id="painel-quartos"></section>
    <section id="painel-mesa" class="oculto"></section>
    <section id="painel-indicacoes" class="oculto"></section>
    <section id="painel-brindes" class="oculto"></section>
    <section id="painel-convidados" class="oculto"></section>
    <section id="painel-financeiro" class="oculto"></section>
    <section id="painel-manual" class="oculto"></section>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACAO — preencher antes de publicar
// =====================================================================
const SUPABASE_URL  = "https://jlvcjqfrsxxexflvwbvn.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdmNqcWZyc3h4ZXhmbHZ3YnZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY0NTAsImV4cCI6MjEwMTM1MjQ1MH0.SkY0N_k2oaYAqZUpZCmm0GBY3j8vsZzB5oX4Am75MnE";

// O evento vem da URL (?evento=slug). Multievento desde o inicio.
const EVENTO = new URLSearchParams(location.search).get("evento") || "cerrado2027";

// IMPORTANTE: todas as tabelas e funcoes vivem no schema "gestao",
// separado do sistema de agendamento de massagem que ocupa "public".
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  db: { schema: "gestao" }
});

// =====================================================================
// ESTADO
// =====================================================================
let PATRO = null;      // patrocinador ativo
let QUARTOS = [];
let SESSOES = [];

// =====================================================================
// UTILITARIOS
// =====================================================================
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function aviso(alvo, texto, tipo="erro"){
  const el = typeof alvo === "string" ? $(alvo) : alvo;
  if(!el) return;
  el.innerHTML = texto
    ? `<div class="aviso ${tipo}">${esc(texto)}</div>`
    : "";
}

// Mensagem de erro que diz o que aconteceu, nao "algo deu errado".
function explicar(erro){
  const m = erro?.message || String(erro);
  if(m.includes("Sem acesso"))          return "Seu e-mail não está vinculado a esta empresa. Fale com a organização.";
  if(m.includes("nao e a sua vez") ||
     m.includes("não é a sua vez"))     return m;
  if(m.includes("Cota de"))             return m;
  if(m.includes("comporta"))            return m;
  if(m.includes("JWT") || m.includes("session")) return "Sua sessão expirou. Entre novamente.";
  return m;
}

function moeda(v){
  return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function dataBR(d){
  if(!d) return "—";
  const [a,m,dia] = String(d).split("-");
  return `${dia}/${m}/${a}`;
}

async function rpc(nome, params){
  const { data, error } = await sb.rpc(nome, params);
  if(error) throw error;
  return data;
}

// =====================================================================
// LOGIN
// =====================================================================
// =====================================================================
// LOGIN POR SENHA
//
// O magic link continua existindo, como saída de emergência: quem foi
// cadastrado pela organização e nunca entrou não tem senha ainda, e
// quem perde o acesso à caixa de e-mail no meio de um evento não pode
// ficar de fora. Senha é o caminho principal; link é o reserva.
//
// `resetPasswordForEmail` só funciona para quem JÁ existe no Auth —
// quem nunca entrou precisa de "Criar senha", que faz o signUp. Por
// isso os dois botões existem: são situações diferentes com a mesma
// aparência, e juntá-los num só deixaria metade das pessoas presa.
// =====================================================================
function _emailLogin(){
  const v = $("#email").value.trim();
  if(!v){ aviso("#login-aviso","Informe seu e-mail."); return null; }
  return v;
}

$("#btn-entrar").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(!senha){ aviso("#login-aviso","Informe sua senha."); return; }

  const btn = $("#btn-entrar");
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error) throw error;
    // o onAuthStateChange cuida de trocar para a tela do app
  }catch(e){
    aviso("#login-aviso", /invalid login/i.test(e.message || "")
      ? "E-mail ou senha não conferem. Se é seu primeiro acesso, use Criar senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

$("#btn-criar-senha").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(senha.length < 8){
    aviso("#login-aviso","Escolha uma senha de pelo menos 8 caracteres e clique em Criar senha.");
    return;
  }
  const btn = $("#btn-criar-senha");
  btn.disabled = true; btn.textContent = "Criando…";
  try{
    const { error } = await sb.auth.signUp({
      email, password: senha,
      options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso",
      "Senha criada. Se pedirmos confirmação, ela chega por e-mail — depois disso é só entrar.", "ok");
  }catch(e){
    aviso("#login-aviso", /already registered/i.test(e.message || "")
      ? "Esse e-mail já tem cadastro. Use Entrar, ou Esqueci minha senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Criar senha";
  }
});

$("#btn-esqueci").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const btn = $("#btn-esqueci");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.href
    });
    if(error) throw error;
    // A resposta é a mesma existindo ou não a conta, de propósito: dizer
    // "esse e-mail não existe" entrega quem está cadastrado a quem
    // estiver testando endereços.
    aviso("#login-aviso",
      "Se esse e-mail tiver cadastro, enviamos um link para definir a nova senha.", "ok");
  }catch(e){
    aviso("#login-aviso", explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Esqueci minha senha";
  }
});

$("#link-otp").addEventListener("click", async (ev) => {
  ev.preventDefault();
  const email = _emailLogin(); if(!email) return;
  try{
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso","Link enviado. Abra seu e-mail para entrar.", "ok");
  }catch(e){ aviso("#login-aviso", explicar(e)); }
});

$("#senha").addEventListener("keydown", e => {
  if(e.key === "Enter") $("#btn-entrar").click();
});

// Volta do link de recuperação: o Supabase já deixou a sessão aberta,
// e o que falta é a pessoa escolher a senha nova. Sem isso ela entra,
// não troca nada, e no próximo acesso está travada de novo.
sb.auth.onAuthStateChange(async (evento) => {
  if(evento !== "PASSWORD_RECOVERY") return;
  const nova = prompt("Digite a nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada. Use ela no próximo acesso.", {tom: error ? "erro" : "ok"});
});

async function trocarMinhaSenha(){
  const nova = prompt("Nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada.", {tom: error ? "erro" : "ok"});
}

$("#email").addEventListener("keydown", e => {
  if(e.key === "Enter") $("#btn-entrar").click();
});

$("#btn-senha").addEventListener("click", trocarMinhaSenha);

$("#btn-sair").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

// =====================================================================
// BOOT
// =====================================================================
let iniciado = false;

sb.auth.onAuthStateChange((evento) => {
  // so reage ao primeiro login e ao logout; sem isso a aba perde o
  // estado toda vez que o usuario volta para ela
  if(evento === "SIGNED_OUT"){ location.reload(); return; }
  if(!iniciado) iniciar();
});

(async function(){
  const { data } = await sb.auth.getSession();
  if(data?.session) iniciar();
})();

async function iniciar(){
  if(iniciado) return;
  iniciado = true;

  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  $("#tela-login").classList.add("oculto");
  $("#app").classList.remove("oculto");
  $("#quem").textContent = user.email;

  try{
    const painel = await rpc("patro_meu_painel", { p_evento_slug: EVENTO });

    if(!painel || painel.length === 0){
      $("#cabecalho").innerHTML = `
        <div class="vazio">
          Este e-mail não está vinculado a nenhum patrocinador deste evento.<br>
          Fale com a organização para liberar seu acesso.
        </div>`;
      $$(".abas, #painel-quartos").forEach(el => el.classList.add("oculto"));
      return;
    }

    PATRO = painel[0];

    // Antes o portal pegava a primeira empresa em silencio. Quem responde
    // por duas patrocinadoras precisa escolher, senao edita a errada sem
    // perceber.
    if(painel.length > 1){
      const sel = document.createElement("select");
      sel.className = "sel-empresa";
      sel.innerHTML = painel.map((p,i) =>
        `<option value="${i}">${esc(p.empresa)}</option>`).join("");
      sel.addEventListener("change", () => {
        PATRO = painel[sel.value];
        desenharCabecalho();
        $("#cabecalho").appendChild(sel);
        carregarQuartos();
      });
      desenharCabecalho();
      $("#cabecalho").appendChild(sel);
    }else{
      desenharCabecalho();
    }
    ligarAbas();
    carregarQuartos();
  }catch(e){
    aviso("#aviso-global", explicar(e));
  }
}

function desenharCabecalho(){
  $("#cabecalho").innerHTML = `
    <h1>${esc(PATRO.empresa)}</h1>
    <p class="sub">
      Cota ${esc(PATRO.cota)} · ${PATRO.quartos_total} quarto(s)
      · ${PATRO.quartos_preenchidos} preenchido(s)
      ${PATRO.vagas_mesa_redonda > 0
        ? ` · ${PATRO.vagas_mesa_redonda} vaga(s) na mesa redonda` : ""}
    </p>`;
}

function ligarAbas(){
  $$(".aba").forEach(b => b.addEventListener("click", () => {
    $$(".aba").forEach(x => x.setAttribute("aria-selected", x === b));
    ["quartos","mesa","indicacoes","brindes","convidados","financeiro","manual"]
      .forEach(a =>
      $("#painel-"+a).classList.toggle("oculto", a !== b.dataset.aba));

    if(b.dataset.aba === "mesa")       carregarMesa();
    if(b.dataset.aba === "indicacoes") carregarIndicacoes();
    if(b.dataset.aba === "brindes")    carregarBrindes();
    if(b.dataset.aba === "convidados") carregarConvidados();
    if(b.dataset.aba === "financeiro") carregarFinanceiro();
    if(b.dataset.aba === "manual")     carregarManual();
  }));
}

// =====================================================================
// ABA: QUARTOS
// =====================================================================
async function recarregarPainel(){
  try{
    const painel = await rpc("patro_meu_painel", { p_evento_slug: EVENTO });
    const atual = painel.find(p => p.patrocinador_id === PATRO.patrocinador_id);
    if(atual){ PATRO = atual; desenharCabecalho(); }
  }catch(e){ /* contador e acessorio: nao bloqueia a acao */ }
}

async function carregarQuartos(){
  const alvo = $("#painel-quartos");
  alvo.innerHTML = `<p class="carregando">Carregando seus quartos…</p>`;

  try{
    QUARTOS = await rpc("patro_listar_quartos", { p_patrocinador_id: PATRO.patrocinador_id });
    const disp = await rpc("patro_disponibilidade", { p_evento_slug: EVENTO });

    if(QUARTOS.length === 0){
      alvo.innerHTML = `<div class="vazio">
        Sua cota ainda não tem quartos liberados. Fale com a organização.
      </div>`;
      return;
    }

    alvo.innerHTML = `
      <h2>Seus quartos</h2>
      <p class="sub">Preencha quem ocupa cada quarto, o transfer e o brinde.</p>
      <div id="lista-quartos"></div>
      ${blocoDisponibilidade(disp)}`;

    QUARTOS.forEach(q => $("#lista-quartos").appendChild(cartaoQuarto(q)));
    ligarCompra();
  }catch(e){
    aviso(alvo, explicar(e));
  }
}

function blocoDisponibilidade(disp){
  const linhas = (disp||[]).map(d => `
    <tr>
      <td style="text-transform:capitalize">${esc(d.tipo)}</td>
      <td>${d.livres}</td>
      <td class="meta">${Number(d.valor) > 0 ? moeda(d.valor) : "sob consulta"}</td>
      <td style="text-align:right">
        ${d.livres > 0
          ? `<button class="btn sec mini comprar" data-tipo="${esc(d.tipo)}"
                     data-valor="${esc(d.valor ?? 0)}">Reservar</button>`
          : `<span class="selo pend">Esgotado</span>`}
      </td>
    </tr>`).join("");

  return `
    <h2 style="margin-top:28px;">Quartos disponíveis</h2>
    <p class="sub">
      Reserve um quarto além da sua cota. A disponibilidade é do hotel, em tempo real,
      e o valor entra na sua fatura.
    </p>
    <div class="cartao">
      <table>
        <tr><th>Tipo</th><th>Livres</th><th>Valor</th><th></th></tr>
        ${linhas || `<tr><td colspan="4" style="color:var(--suave)">Sem quartos livres no momento.</td></tr>`}
      </table>
    </div>`;
}

function ligarCompra(){
  $$(".comprar").forEach(b => b.addEventListener("click", async () => {
    // reservar quarto extra gera cobranca: confirmar com o valor na
    // frente evita o clique sem querer e a ligacao depois
    const v = Number(b.dataset.valor || 0);
    const quanto = v > 0 ? moeda(v) : "valor a combinar com a organização";
    if(!(await DS.confirmar(
        `Custo: ${quanto}, que entra na sua fatura.`,
        {titulo:`Reservar um quarto ${b.dataset.tipo} adicional?`}))) return;

    b.disabled = true; b.textContent = "Reservando…";
    try{
      const r = await rpc("patro_comprar_quarto", {
        p_patrocinador_id: PATRO.patrocinador_id,
        p_tipo: b.dataset.tipo
      });
      if(!r.ok){
        // outro patrocinador levou o ultimo entre a tela carregar e o clique
        aviso("#aviso-global","O último quarto desse tipo acabou de ser reservado por outra empresa.");
        carregarQuartos();
        return;
      }
      aviso("#aviso-global", `${r.rotulo} reservado. Preencha os ocupantes abaixo.`, "ok");
      await recarregarPainel();
      carregarQuartos();
    }catch(e){
      aviso("#aviso-global", explicar(e));
    }
  }));
}

function cartaoQuarto(q){
  const cap = q.capacidade;
  const el = document.createElement("div");
  el.className = "cartao";
  el.innerHTML = `
    <div class="cartao-cab">
      <div>
        <h3>${esc(q.rotulo)} · <span style="text-transform:capitalize">${esc(q.tipo)}</span></h3>
        <p class="meta">
          ${q.ocupantes} de ${cap} ocupante(s)
          ${q.quarto_numero ? ` · apto ${esc(q.quarto_numero)}` : ""}
          ${q.origem === "extra" ? " · extra" : ""}
        </p>
      </div>
      <span class="selo ${q.status === "completo" ? "ok" : "pend"}">
        ${q.status === "completo" ? "Preenchido" : "Pendente"}
      </span>
    </div>
    <div style="margin-top:14px;">
      <button class="btn sec mini abrir">${q.status === "completo" ? "Editar" : "Preencher"}</button>
      ${q.origem === "extra"
        ? `<button class="btn perigo mini cancelar" style="margin-left:6px;">Cancelar quarto</button>`
        : ""}
    </div>
    <div class="editor oculto" style="margin-top:16px;"></div>`;

  el.querySelector(".abrir").addEventListener("click", () => {
    const ed = el.querySelector(".editor");
    if(!ed.classList.contains("oculto")){ ed.classList.add("oculto"); return; }
    ed.classList.remove("oculto");
    abrirEditor(ed, q);
  });

  const btnCancel = el.querySelector(".cancelar");
  if(btnCancel) btnCancel.addEventListener("click", async () => {
    if(!(await DS.confirmar("O quarto volta para a disponibilidade do hotel.",
        {titulo:`Cancelar ${q.rotulo}?`, tom:"perigo", textoConfirmar:"Cancelar reserva"}))) return;
    try{
      await rpc("patro_cancelar_quarto_extra", { p_reserva_id: q.reserva_id });
      aviso("#aviso-global", `${q.rotulo} cancelado.`, "ok");
      // recarrega o painel junto: o contador do cabecalho vinha dele e
      // ficava desatualizado ate a pessoa recarregar a pagina na mao
      await recarregarPainel();
      carregarQuartos();
    }catch(e){ aviso("#aviso-global", explicar(e)); }
  });

  return el;
}

async function abrirEditor(ed, q){
  ed.innerHTML = `<p class="carregando">Carregando ocupantes…</p>`;

  let ocupantes = [];
  try{
    ocupantes = await rpc("patro_listar_ocupantes", { p_reserva_id: q.reserva_id });
  }catch(e){
    aviso(ed, explicar(e)); return;
  }

  // completa ate a capacidade para o usuario ter os campos prontos
  while(ocupantes.length < q.capacidade) ocupantes.push({ nome:"", cpf:"" });

  ed.innerHTML = `
    <div class="caixa-ocupantes"></div>
    <div class="linha" style="margin-top:6px;">
      <div>
        <label>Transfer</label>
        <select class="f-transfer">
          <option value="">Não vamos usar</option>
          <option value="GYN">Sim — saindo de Goiânia</option>
          <option value="BSB">Sim — saindo de Brasília</option>
        </select>
      </div>
    </div>
    <p class="fila-nota" style="margin:-2px 0 10px;">
      O brinde é da empresa, não do quarto — fica na aba <strong>Brindes</strong>.
    </p>
    <div class="aviso-quarto"></div>
    <button class="btn salvar">Salvar quarto</button>`;

  // Seleciona por classe, nao por id montado com o UUID: UUID que
  // comeca com digito ("3f2b...") gera um seletor CSS invalido e
  // querySelector lanca excecao.
  const box = $(".caixa-ocupantes", ed);
  ocupantes.forEach((o,i) => box.appendChild(campoOcupante(o,i)));

  const tr = ed.querySelector(".f-transfer");
  if(q.usa_transfer && q.transfer_origem) tr.value = q.transfer_origem;

  ed.querySelector(".salvar").addEventListener("click", () => salvarQuarto(ed, q));
}

function campoOcupante(o, i){
  const d = document.createElement("div");
  d.className = "linha ocupante";
  d.innerHTML = `
    <div>
      <label>Ocupante ${i+1} — nome</label>
      <input type="text" class="f-nome" value="${esc(o.nome)}" placeholder="Nome completo">
    </div>
    <div>
      <label>CPF</label>
      <input type="text" class="f-cpf" value="${esc(o.cpf)}" placeholder="000.000.000-00">
    </div>
    <div style="max-width:150px;">
      <label>Transfer</label>
      <label class="check" style="padding-top:8px;">
        <input type="checkbox" class="f-ocup-transfer" ${o.usa_transfer ? "checked" : ""}> Usa
      </label>
    </div>
    <div style="max-width:160px;">
      <label>Sai de</label>
      <select class="f-ocup-origem" ${o.usa_transfer ? "" : "disabled"}>
        <option value="">—</option>
        <option value="GYN" ${o.transfer_origem === "GYN" ? "selected" : ""}>Goiânia</option>
        <option value="BSB" ${o.transfer_origem === "BSB" ? "selected" : ""}>Brasília</option>
      </select>
    </div>`;
  d.querySelector(".f-ocup-transfer").addEventListener("change", e => {
    const sel = d.querySelector(".f-ocup-origem");
    sel.disabled = !e.target.checked;
    if(!e.target.checked) sel.value = "";
  });
  return d;
}

async function salvarQuarto(ed, q){
  const btn = ed.querySelector(".salvar");
  const alvoAviso = ed.querySelector(".aviso-quarto");

  // linha em branco nao vira ocupante: o usuario nao precisa apagar
  // os campos que sobraram
  const lista = $$(".ocupante", ed).map(r => ({
    nome: r.querySelector(".f-nome").value.trim(),
    cpf:  r.querySelector(".f-cpf").value.trim(),
    tipo: "adulto",
    usa_transfer: r.querySelector(".f-ocup-transfer").checked,
    transfer_origem: r.querySelector(".f-ocup-origem").value || null
  })).filter(o => o.nome !== "");

  if(lista.length === 0){
    aviso(alvoAviso, "Informe pelo menos um ocupante para salvar o quarto.");
    return;
  }

  // A origem que vale e a de cada pessoa. Esta continua sendo gravada em
  // `reservas` porque relatorio e tela ainda leem de la, mas nao decide
  // mais nada: duas pessoas do mesmo quarto podem sair de cidades
  // diferentes.
  const origem = ed.querySelector(".f-transfer").value;

  const semOrigem = lista.find(o => o.usa_transfer && !o.transfer_origem);
  if(semOrigem){
    aviso(alvoAviso, `Escolha de onde ${semOrigem.nome} sai no transfer.`);
    return;
  }

  btn.disabled = true; btn.textContent = "Salvando…";
  try{
    await rpc("patro_salvar_quarto", {
      p_reserva_id: q.reserva_id,
      p_ocupantes: lista,
      p_usa_transfer: lista.some(o => o.usa_transfer),
      p_transfer_origem: origem || null
    });
    aviso("#aviso-global", `${q.rotulo} salvo.`, "ok");
    // o contador "N preenchido(s)" do cabeçalho vem de patro_meu_painel,
    // não da lista de quartos: sem recarregar os dois, o cartão vira
    // PREENCHIDO e o cabeçalho continua em zero até a pessoa dar F5.
    // Comprar e cancelar já faziam isso; salvar tinha ficado de fora.
    await recarregarPainel();
    carregarQuartos();
  }catch(e){
    aviso(alvoAviso, explicar(e));
    btn.disabled = false; btn.textContent = "Salvar quarto";
  }
}

async function carregarMesa(){
  const alvo = $("#painel-mesa");
  alvo.innerHTML = `<p class="carregando">Carregando suas sessões…</p>`;

  try{
    if(ORDEM_COTAS.length === 0) await carregarCotas();
    SESSOES = await rpc("patro_minhas_sessoes", { p_patrocinador_id: PATRO.patrocinador_id });

    if(SESSOES.length === 0){
      alvo.innerHTML = `<div class="vazio">
        Sua cota não inclui mesa redonda nem reunião exclusiva.<br>
        Você ainda pode indicar CIOs para o evento na aba ao lado.
      </div>`;
      return;
    }

    alvo.innerHTML = `
      <h2>Mesa redonda e reuniões</h2>
      <p class="sub">As cotas mais altas escolhem primeiro. Dentro da mesma cota, quem fechou contrato e rooming antes escolhe antes.</p>
      <div id="lista-sessoes"></div>`;

    for(const s of SESSOES){
      const card = document.createElement("div");
      card.className = "fila";
      $("#lista-sessoes").appendChild(card);
      await desenharSessao(card, s);
    }
  }catch(e){
    aviso(alvo, explicar(e));
  }
}

const NOME_TIPO = {
  mesa_redonda:"Mesa redonda",
  reuniao_exclusiva:"Reunião exclusiva",
  jantar:"Jantar"
};

async function desenharSessao(card, s){
  let vez;
  try{
    vez = await rpc("patro_minha_vez", { p_sessao_id: s.sessao_id });
  }catch(e){
    aviso(card, explicar(e)); return;
  }

  const minhaVez  = vez.minha_vez && !s.encerrada;
  const restantes = s.vagas - Number(s.escolhidos);

  card.innerHTML = `
    <div class="cartao-cab">
      <div>
        <h3>${NOME_TIPO[s.tipo] || esc(s.tipo)}${s.data ? " · " + dataBR(s.data) : ""}</h3>
        <p class="meta">${s.escolhidos} de ${s.vagas} vaga(s) escolhida(s)${s.local ? " · " + esc(s.local) : ""}</p>
      </div>
      <span class="selo ${s.encerrada ? "ok" : (minhaVez ? "vez" : "pend")}">
        ${s.encerrada ? "Encerrada" : (minhaVez ? "Sua vez" : "Aguardando")}
      </span>
    </div>

    ${trilhoFila(vez, PATRO.cota)}

    <div class="corpo-sessao"></div>`;

  const corpo = card.querySelector(".corpo-sessao");

  if(s.encerrada){
    corpo.innerHTML = `<p class="fila-nota">${
      s.passou
        ? "Você passou a vez. As vagas restantes foram liberadas para as próximas empresas da fila."
        : "Suas escolhas estão confirmadas."
    }</p>`;
    return;
  }

  if(!minhaVez){
    corpo.innerHTML = `<p class="fila-nota">
      ${vez.na_frente} empresa(s) ainda estão escolhendo antes de você.
      Avisamos por e-mail assim que chegar a sua vez.
    </p>`;
    return;
  }

  corpo.innerHTML = `
    <p class="fila-nota" style="margin-bottom:10px;">
      Escolha até ${restantes} convidado(s). Quem você marcar sai da lista das outras empresas.
    </p>
    <div class="lista-convidados carregando">Carregando convidados disponíveis…</div>
    <div class="aviso-sessao"></div>
    <div style="margin-top:12px;">
      <button class="btn confirmar" disabled>Confirmar escolhas</button>
      <button class="btn sec passar" style="margin-left:6px;">Passar a vez</button>
    </div>`;

  // A lista ja vem ordenada pelo banco: primeiro quem a propria empresa
  // indicou no PERFIL, depois por porte (faturamento), depois nome. O
  // selo existe para essa ordem nao parecer aleatoria na tela.
  let disponiveis = [];
  try{
    disponiveis = await rpc("patro_convidados_disponiveis", { p_sessao_id: s.sessao_id });
  }catch(e){
    aviso(corpo.querySelector(".aviso-sessao"), explicar(e)); return;
  }

  const lista = corpo.querySelector(".lista-convidados");
  lista.classList.remove("carregando");

  if(disponiveis.length === 0){
    lista.innerHTML = `<div class="vazio">Não há mais convidados disponíveis para esta sessão.</div>`;
  }else{
    lista.innerHTML = `<table><tbody>${disponiveis.map(c => `
      <tr>
        <td style="width:26px;">
          <input type="checkbox" class="pick" value="${esc(c.participante_id)}">
        </td>
        <td><strong>${esc(c.nome)}</strong>
            ${c.indicado_por_mim ? `<span class="selo vez">indicado por você</span>` : ""}<br>
            <span class="meta">${esc(c.empresa || "")}${c.cargo ? " · " + esc(c.cargo) : ""}</span></td>
      </tr>`).join("")}</tbody></table>`;
  }

  const btn = corpo.querySelector(".confirmar");

  // trava a selecao no limite de vagas em vez de deixar o banco recusar
  function sincronizar(){
    const marcados = $$(".pick:checked", corpo);
    btn.disabled = marcados.length === 0;
    btn.textContent = marcados.length
      ? `Confirmar ${marcados.length} escolha(s)`
      : "Confirmar escolhas";
    $$(".pick", corpo).forEach(c => {
      c.disabled = !c.checked && marcados.length >= restantes;
    });
  }
  $$(".pick", corpo).forEach(c => c.addEventListener("change", sincronizar));

  btn.addEventListener("click", async () => {
    const ids = $$(".pick:checked", corpo).map(c => c.value);
    btn.disabled = true; btn.textContent = "Confirmando…";
    try{
      const r = await rpc("patro_escolher_convidados", {
        p_sessao_id: s.sessao_id,
        p_participantes: ids
      });
      aviso("#aviso-global", `${r.inseridos} convidado(s) confirmado(s).`, "ok");
      carregarMesa();
    }catch(e){
      aviso(corpo.querySelector(".aviso-sessao"), explicar(e));
      btn.disabled = false; btn.textContent = "Confirmar escolhas";
    }
  });

  corpo.querySelector(".passar").addEventListener("click", async () => {
    if(!(await DS.confirmar("As vagas restantes ficam livres para as próximas empresas da fila.",
        {titulo:"Passar a vez?", tom:"perigo", textoConfirmar:"Passar a vez"}))) return;
    try{
      await rpc("patro_passar_a_vez", { p_sessao_id: s.sessao_id });
      carregarMesa();
    }catch(e){ aviso("#aviso-global", explicar(e)); }
  });
}

// A fila: mostra onde a empresa está na ordem de escolha.
// A ordem vem do banco (cotas.ordem_prioridade). Deixá-la fixa aqui
// significaria que criar uma cota nova no painel exigiria mexer neste
// arquivo também — e ninguém lembraria.
let ORDEM_COTAS = [];

async function carregarCotas(){
  try{
    const l = await rpc("listar_cotas", { p_evento_slug: EVENTO });
    ORDEM_COTAS = l.map(c => c.nome);
  }catch(e){
    ORDEM_COTAS = [];   // sem a lista, o trilho some e sobra a nota
  }
}

// O prazo da cota e o que faz a fila andar sozinha: vencido, a proxima
// cota entra e os convidados que esta empresa indicou voltam para a
// lista geral. Quem esta na tela precisa saber disso antes, nao depois.
function notaPrazo(vez){
  if(!vez.janela_fim) return "";
  const quando = new Date(vez.janela_fim).toLocaleString("pt-BR",
    { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });

  return vez.prazo_vencido
    ? `<p class="fila-nota"><strong>A janela da sua cota terminou em ${quando}.</strong>
       A escolha passou para as próximas cotas e quem você indicou voltou para a
       lista geral.</p>`
    : `<p class="fila-nota">Você escolhe até <strong>${quando}</strong>.
       Depois disso a vez passa para a próxima cota, quem você indicou deixa de
       ficar reservado e esta sessão sai da sua mão.</p>`;
}

function trilhoFila(vez, minhaCota){
  if(ORDEM_COTAS.length === 0){
    return `<p class="fila-nota">${esc(vez.minha_vez
      ? `Você é o próximo da fila — posição ${vez.posicao}.`
      : `${vez.na_frente} empresa(s) na sua frente · posição ${vez.posicao}.`)}</p>`
      + notaPrazo(vez);
  }

  const idx = ORDEM_COTAS.findIndex(c =>
    c.toLowerCase() === String(minhaCota||"").toLowerCase());

  const passos = ORDEM_COTAS.map((c,i) => {
    const aqui   = i === idx;
    const passou = idx >= 0 && i < idx;
    return `<div class="fila-passo ${aqui ? "aqui" : (passou ? "passou" : "")}">
      <div class="n">${passou ? "antes de você" : (aqui ? "você" : "depois de você")}</div>
      <div class="q">${c}</div>
    </div>`;
  }).join("");

  const nota = vez.minha_vez
    ? `Você é o próximo da fila — posição ${vez.posicao}.`
    : `${vez.na_frente} empresa(s) na sua frente · sua posição na ordem geral: ${vez.posicao}.`;

  return `<div class="fila-trilho">${passos}</div>
          <p class="fila-nota">${esc(nota)}</p>${notaPrazo(vez)}`;
}

      <h2 style="margin-top:26px;">Envio</h2>
      <div class="cartao">
        <p class="sub" style="margin-bottom:12px;">
          Situação: <span class="selo ${SELO_BRINDE[b.status] || "pend"}">${ROTULO_BRINDE[b.status] || esc(b.status || "")}</span>
          ${b.recebido_em ? ` · recebido em ${dataBR(b.recebido_em)}` : ""}
        </p>
        <div class="linha">
          <div style="max-width:200px;"><label>Transportadora</label>
            <input type="text" id="b-transp" placeholder="Correios, Jadlog…"
                   value="${esc(b.transportadora || "")}"></div>
          <div><label>Código de rastreio</label>
            <input type="text" id="b-rastreio" placeholder="BR123456789BR"
                   value="${esc(b.rastreio || "")}"></div>
        </div>
        <div id="b-aviso-envio"></div>
        <button class="btn sec" id="b-enviar">
          ${b.rastreio ? "Atualizar rastreio" : "Informar envio"}
        </button>
        <p class="fila-nota" style="margin-top:8px;">
          Errou o código? Pode corrigir aqui — vale o último informado.
        </p>
      </div>` : ""}`;

  const mostrarCusto = () => {
    const noQuarto = $("#b-destino").value === "quarto";
    $("#b-custo").innerHTML = noQuarto
      ? `Entrega no quarto é serviço do resort, cobrado por porta:
         <strong>${b.quartos} quarto(s) × ${moeda(b.preco_entrega)} = ${moeda(custo)}</strong>,
         que entra na sua fatura.`
      : `No stand não há custo — o brinde fica na sua mesa e quem quiser, pega.`;
  };

  $("#b-tem").addEventListener("change", e =>
    $("#b-campos").classList.toggle("oculto", !e.target.checked));
  $("#b-destino").addEventListener("change", mostrarCusto);
  mostrarCusto();

  $("#b-salvar").addEventListener("click", async () => {
    const btn = $("#b-salvar");
    btn.disabled = true; btn.textContent = "Salvando…";
    try{
      await rpc("patro_salvar_brinde", {
        p_patrocinador_id: PATRO.patrocinador_id,
        p_vai_enviar: $("#b-tem").checked,
        p_descricao: $("#b-desc").value.trim() || null,
        p_quantidade: parseInt($("#b-qtd").value, 10) || null,
        p_destino: $("#b-destino").value
      });
      aviso("#b-aviso", "Brinde salvo.", "ok");
      carregarBrindes();
    }catch(e){
      aviso("#b-aviso", explicar(e));
      btn.disabled = false; btn.textContent = "Salvar brinde";
    }
  });

  const btnEnviar = $("#b-enviar");
  if(btnEnviar) btnEnviar.addEventListener("click", async () => {
    const cod = $("#b-rastreio").value.trim();
    if(!cod){ aviso("#b-aviso-envio","Informe o código de rastreio."); return; }
    btnEnviar.disabled = true; btnEnviar.textContent = "Salvando…";
    try{
      const r = await rpc("patro_informar_rastreio", {
        p_patrocinador_id: PATRO.patrocinador_id,
        p_transportadora: $("#b-transp").value.trim() || null,
        p_rastreio: cod
      });
      aviso("#b-aviso-envio", `Rastreio registrado.`, "ok");
      carregarBrindes();
    }catch(e){
      aviso("#b-aviso-envio", explicar(e));
      btnEnviar.disabled = false; btnEnviar.textContent = "Informar envio";
    }
  });
}


// =====================================================================
// ABA: FINANCEIRO
//
// A conta já era calculada; o patrocinador é que não tinha como vê-la.
// Mostrar o item ao lado do total responde a pergunta seguinte antes
// que ela seja feita: não é "quanto deu", é "por que deu isso".
// =====================================================================
const ROTULO_FATURA = {
  estimada: "Estimativa", emitida: "Emitida", paga: "Paga",
  sem_cobranca: "Sem cobrança"
};

async function carregarFinanceiro(){
  const alvo = $("#painel-financeiro");
  alvo.innerHTML = `<p class="carregando">Carregando…</p>`;

  let f;
  try{
    f = await rpc("patro_minha_fatura", { p_patrocinador_id: PATRO.patrocinador_id });
  }catch(e){ aviso(alvo, explicar(e)); return; }

  const itens = f.itens || [];

  if(f.status === "sem_cobranca"){
    alvo.innerHTML = `
      <h2>Financeiro</h2>
      <div class="vazio">
        Nada a cobrar até agora. Quarto além da cota, transfer e entrega de
        brinde no quarto são o que gera custo — e você não tem nenhum deles.
      </div>`;
    return;
  }

  alvo.innerHTML = `
    <h2>Financeiro</h2>
    <p class="sub">
      ${f.status === "estimada"
        ? "Estimativa: muda sozinha se você alterar quartos, transfer ou brinde."
        : "Valor fechado pela organização — mudanças no portal não alteram mais esta conta."}
    </p>

    <div class="cartao">
      <div class="cartao-cab">
        <div>
          <h3>${moeda(f.total)}</h3>
          <p class="meta">
            ${f.vencimento ? `vence em ${dataBR(f.vencimento)}` : "sem vencimento definido"}
            ${f.paga_em ? ` · paga em ${dataBR(f.paga_em)}` : ""}
          </p>
        </div>
        <span class="selo ${f.status === "paga" ? "ok" : "pend"}">
          ${ROTULO_FATURA[f.status] || esc(f.status)}
        </span>
      </div>

      ${itens.length ? `
        <table style="margin-top:14px;">
          <tr><th>Item</th><th>Qtd</th><th>Unitário</th><th>Total</th></tr>
          ${itens.map(i => `<tr>
            <td>${esc(i.descricao)}</td>
            <td class="meta">${i.quantidade}</td>
            <td class="meta">${moeda(i.valor_unit)}</td>
            <td><strong>${moeda(i.valor_total)}</strong></td>
          </tr>`).join("")}
        </table>`
        : `<p class="fila-nota" style="margin-top:12px;">Sem itens lançados.</p>`}

      ${f.observacao ? `<p class="fila-nota" style="margin-top:12px;">
        <strong>Observação da organização:</strong> ${esc(f.observacao)}</p>` : ""}
    </div>

    <p class="fila-nota">
      Dúvida sobre algum lançamento? Fale com a organização antes do vencimento.
    </p>`;
}

// =====================================================================
// ABA: CONVIDADOS
//
// Sai só quem está aprovado E com contrato assinado. Quem ainda pode
// não vir não é presença confirmada, e prometer presença que não se
// cumpre é pior do que não informar.
//
// Sem e-mail e sem telefone de propósito: contato o patrocinador recebe
// de quem ele efetivamente escolheu, pelo mailing da sessão.
// =====================================================================
async function carregarConvidados(){
  const alvo = $("#painel-convidados");
  alvo.innerHTML = `<p class="carregando">Carregando…</p>`;

  let filtros;
  try{
    filtros = await rpc("patro_filtros_convidados", { p_patrocinador_id: PATRO.patrocinador_id });
  }catch(e){ aviso(alvo, explicar(e)); return; }

  const opcoes = (lista, rotulo) =>
    `<option value="">${rotulo}</option>` +
    (lista || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");

  alvo.innerHTML = `
    <h2>Quem já confirmou</h2>
    <p class="sub">
      ${filtros.total} executivo(s) com inscrição aprovada e contrato assinado.
      Contato de quem você escolher para a mesa sai no mailing da sessão.
    </p>
    <div class="linha">
      <div><label>Buscar</label>
        <input type="text" id="cv-busca" placeholder="Nome ou empresa"></div>
      <div style="max-width:170px;"><label>Estado</label>
        <select id="cv-estado">${opcoes(filtros.estados, "Todos")}</select></div>
      <div style="max-width:190px;"><label>Cidade</label>
        <select id="cv-cidade">${opcoes(filtros.cidades, "Todas")}</select></div>
      <div style="max-width:200px;"><label>Segmento</label>
        <select id="cv-segmento">${opcoes(filtros.segmentos, "Todos")}</select></div>
    </div>
    <div id="cv-lista"><p class="carregando">Carregando…</p></div>`;

  const buscar = async () => {
    const box = $("#cv-lista");
    try{
      const l = await rpc("patro_convidados_confirmados", {
        p_patrocinador_id: PATRO.patrocinador_id,
        p_termo:    $("#cv-busca").value.trim() || null,
        p_cidade:   $("#cv-cidade").value || null,
        p_estado:   $("#cv-estado").value || null,
        p_segmento: $("#cv-segmento").value || null,
        p_limite: 500, p_offset: 0
      });
      box.innerHTML = l.length ? `
        <p class="meta" style="margin:10px 0;">${l.length} resultado(s).</p>
        <div class="cartao"><table>
          <tr><th>Nome</th><th>Empresa</th><th>Cidade</th><th>Segmento</th><th></th></tr>
          ${l.map(c => `<tr>
            <td><strong>${esc(c.nome)}</strong>
                ${c.cargo ? `<br><span class="meta">${esc(c.cargo)}</span>` : ""}</td>
            <td>${esc(c.empresa || "—")}
                ${c.porte ? `<br><span class="meta">${esc(c.porte)}</span>` : ""}</td>
            <td class="meta">${esc(c.cidade || "—")}${c.estado ? " · " + esc(c.estado) : ""}</td>
            <td class="meta">${esc(c.segmento || "—")}</td>
            <td>${c.ja_e_meu_convidado
                   ? `<span class="selo ok">na sua mesa</span>` : ""}</td>
          </tr>`).join("")}
        </table></div>`
        : `<div class="vazio">Ninguém com esse filtro.</div>`;
    }catch(e){ aviso(box, explicar(e)); }
  };

  let t;
  $("#cv-busca").addEventListener("input", () => {
    clearTimeout(t); t = setTimeout(buscar, 350);
  });
  ["#cv-estado","#cv-cidade","#cv-segmento"].forEach(sel =>
    $(sel).addEventListener("change", buscar));
  buscar();
}

// =====================================================================
// ABA: INDICAR CIO
// =====================================================================
async function carregarIndicacoes(){
  const alvo = $("#painel-indicacoes");

  alvo.innerHTML = `
    <h2>Indicar um CIO</h2>
    <p class="sub">Sugira executivos para o evento. A organização faz o convite e você acompanha o status por aqui.</p>

    <div class="cartao">
      <div class="linha">
        <div><label>Nome</label><input type="text" id="i-nome" placeholder="Nome completo"></div>
        <div><label>Empresa</label><input type="text" id="i-empresa"></div>
      </div>
      <div class="linha">
        <div><label>Cargo</label><input type="text" id="i-cargo" placeholder="CIO, Diretor de TI…"></div>
        <div><label>E-mail</label><input type="email" id="i-email"></div>
        <div><label>Telefone</label><input type="text" id="i-telefone"></div>
      </div>
      <div class="linha">
        <div><label>Observação</label><textarea id="i-obs" placeholder="Contexto que ajude a organização"></textarea></div>
      </div>
      <div id="i-aviso"></div>
      <button class="btn" id="i-enviar">Enviar indicação</button>
    </div>

    <h2 style="margin-top:26px;">Suas indicações</h2>
    <div id="i-lista"><p class="carregando">Carregando…</p></div>`;

  $("#i-enviar").addEventListener("click", enviarIndicacao);
  listarIndicacoes();
}

async function enviarIndicacao(){
  const nome = $("#i-nome").value.trim();
  if(!nome){ aviso("#i-aviso","Informe pelo menos o nome do CIO."); return; }

  const btn = $("#i-enviar");
  btn.disabled = true; btn.textContent = "Enviando…";

  try{
    const r = await rpc("patro_indicar_cio", {
      p_patrocinador_id: PATRO.patrocinador_id,
      p_nome: nome,
      p_empresa:  $("#i-empresa").value.trim()  || null,
      p_cargo:    $("#i-cargo").value.trim()    || null,
      p_email:    $("#i-email").value.trim()    || null,
      p_telefone: $("#i-telefone").value.trim() || null,
      p_observacao: $("#i-obs").value.trim()    || null
    });

    aviso("#i-aviso", r.ja_na_base
      ? "Indicação registrada. Esse executivo já está na nossa base — a organização confirma o status."
      : "Indicação enviada.", "ok");

    ["#i-nome","#i-empresa","#i-cargo","#i-email","#i-telefone","#i-obs"]
      .forEach(s => $(s).value = "");
    listarIndicacoes();
  }catch(e){
    aviso("#i-aviso", explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Enviar indicação";
  }
}

const ROTULO_STATUS = {
  nova:"Aguardando convite", convidado:"Convidado",
  inscrito:"Inscrito", recusado:"Não seguiu", duplicado:"Já na base"
};

async function listarIndicacoes(){
  try{
    const lista = await rpc("patro_listar_indicacoes", { p_patrocinador_id: PATRO.patrocinador_id });

    $("#i-lista").innerHTML = lista.length === 0
      ? `<div class="vazio">Você ainda não indicou ninguém.</div>`
      : `<div class="cartao"><table>
          <tr><th>Nome</th><th>Empresa</th><th>Status</th></tr>
          ${lista.map(i => `
            <tr>
              <td>${esc(i.nome)}</td>
              <td>${esc(i.empresa || "—")}</td>
              <td><span class="selo ${i.status === "inscrito" ? "ok" : "pend"}">
                ${esc(ROTULO_STATUS[i.status] || i.status)}</span></td>
            </tr>`).join("")}
        </table></div>`;
  }catch(e){
    aviso("#i-lista", explicar(e));
  }
}

// =====================================================================
// ABA: MANUAL
// =====================================================================
async function carregarManual(){
  const alvo = $("#painel-manual");
  alvo.innerHTML = `<p class="carregando">Carregando…</p>`;

  try{
    const m = (await rpc("patro_manual", { p_evento_slug: EVENTO }))[0];
    if(!m){ alvo.innerHTML = `<div class="vazio">Manual ainda não publicado.</div>`; return; }

    // Prazo de contrato e de cancelamento sao do CIO inscrito, nao do
    // patrocinador: ele nao assina contrato de inscricao nem paga
    // no-show. Mostrar aqui fazia a empresa procurar uma pendencia que
    // nao era dela.
    alvo.innerHTML = `
      <h2>${esc(m.nome)}</h2>
      <p class="sub">${esc(m.local || "")} · ${dataBR(m.data_inicio)} a ${dataBR(m.data_fim)}</p>

      <div class="cartao">
        <h3>Seu pacote</h3>
        <table>
          <tr><td><strong>Cota</strong></td><td>${esc(PATRO.cota || "—")}</td></tr>
          <tr><td><strong>Quartos</strong></td>
              <td>${PATRO.quartos_total} no total ·
                  ${PATRO.quartos_preenchidos} preenchido(s)</td></tr>
          <tr><td><strong>Vagas na mesa redonda</strong></td>
              <td>${PATRO.vagas_mesa_redonda ?? "—"}</td></tr>
          <tr><td><strong>Reunião exclusiva</strong></td>
              <td>${PATRO.tem_reuniao_exclusiva ? "Sim" : "Não"}</td></tr>
          <tr><td><strong>Jantar</strong></td>
              <td>${PATRO.tem_jantar ? "Sim" : "Não"}</td></tr>
        </table>
      </div>

      <div class="cartao">
        <h3>Seus prazos</h3>
        <table>
          <tr><th>Prazo</th><th>Data</th><th>O que é</th></tr>
          <tr><td><strong>Rooming list</strong></td>
              <td class="meta">${dataBR(m.prazo_rooming)}</td>
              <td style="color:var(--suave)">
                Nome de quem ocupa cada quarto da sua cota.</td></tr>
          <tr><td><strong>Escolha dos convidados</strong></td>
              <td class="meta">—</td>
              <td style="color:var(--suave)">
                Depende da sua cota e de quem escolhe antes de você.
                A data aparece na aba <strong>Mesa redonda</strong> quando a fila abre.</td></tr>
        </table>
      </div>`;
  }catch(e){
    aviso(alvo, explicar(e));
  }
}
</script>
</body>
</html>
