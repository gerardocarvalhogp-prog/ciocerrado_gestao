<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · CIO Cerrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --verde:#14312B; --verde-med:#1D6F5C; --ouro:#A8842C;
  --papel:#FBFAF7; --superficie:#FFFFFF; --linha:#DDE0D8;
  --texto:#243B35; --suave:#6B7C76; --erro:#9B3226; --raio:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--papel);color:var(--texto);
  font-family:'Public Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}

.topo{background:var(--verde);color:#fff;padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.marca{font-family:'Archivo',sans-serif;font-weight:700;font-size:15.5px;}
.marca span{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;}
.topo-dir{display:flex;align-items:center;gap:11px;}
.quem{font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.85;}
.sair{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:var(--raio);padding:4px 10px;font-size:12px;}
.sel-evento{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:var(--raio);padding:5px 9px;font-size:12.5px;
  font-family:inherit;max-width:260px;}
.sel-evento option{color:var(--texto);}
.escopo-global{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:#EFEFEA;color:var(--suave);border-radius:20px;
  padding:2px 9px;margin-left:8px;text-transform:uppercase;letter-spacing:.04em;}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 80px;}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--linha);
  margin-bottom:22px;overflow-x:auto;}
.aba{background:none;border:none;border-bottom:2px solid transparent;
  padding:9px 13px;font-size:13.5px;color:var(--suave);white-space:nowrap;}
.aba[aria-selected="true"]{color:var(--verde);border-bottom-color:var(--verde);font-weight:600;}
.aba .contador{font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:var(--ouro);color:#fff;border-radius:10px;padding:1px 6px;margin-left:5px;}

h1{font-family:'Archivo',sans-serif;font-size:21px;margin:0 0 3px;letter-spacing:-.015em;}
h2{font-family:'Archivo',sans-serif;font-size:16px;margin:0 0 8px;}
.sub{color:var(--suave);font-size:13px;margin:0 0 18px;}

.cartao{background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--raio);padding:15px;margin-bottom:12px;}
.barra{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
.barra > div{min-width:150px;}

label{display:block;font-size:11.5px;color:var(--suave);margin-bottom:3px;}
input[type=text],input[type=email],input[type=file],select{
  width:100%;padding:7px 9px;border:1px solid var(--linha);border-radius:var(--raio);
  font-family:inherit;font-size:13.5px;background:var(--superficie);color:var(--texto);}

.btn{background:var(--verde);color:#fff;border:none;border-radius:var(--raio);
  padding:8px 14px;font-size:13.5px;font-weight:500;}
.btn:hover{background:#0E241F;}
.btn:disabled{background:#A9B5B0;cursor:not-allowed;}
.btn.sec{background:transparent;color:var(--verde);border:1px solid var(--linha);}
.btn.sec:hover{background:#F1F3EE;}
.btn.mini{padding:4px 9px;font-size:12px;}
.btn.perigo{background:transparent;color:var(--erro);border:1px solid #E4CFCB;}
.btn.ok{background:var(--verde-med);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--suave);
  border-bottom:1px solid var(--linha);padding:7px 6px;position:sticky;top:0;
  background:var(--superficie);}
td{padding:7px 6px;border-bottom:1px solid #F0F1EC;vertical-align:top;}
.rolagem{max-height:520px;overflow:auto;}

.selo{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;
  border-radius:20px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.selo.ok{background:#E4F0EA;color:var(--verde-med);}
.selo.pend{background:#EFEFEA;color:var(--suave);}
.selo.alerta{background:#F7EFD9;color:var(--ouro);}
.selo.erro{background:#FBF0EE;color:var(--erro);}

.aviso{border-radius:var(--raio);padding:10px 12px;font-size:13px;margin-bottom:12px;
  border:1px solid var(--linha);background:var(--superficie);}
.aviso.erro{background:#FBF0EE;border-color:#E4CFCB;color:var(--erro);}
.aviso.ok{background:#E8F2EC;border-color:#C9E0D4;color:var(--verde-med);}
.vazio{border:1px dashed var(--linha);border-radius:var(--raio);padding:22px;
  text-align:center;color:var(--suave);font-size:13.5px;}
.carregando{color:var(--suave);font-size:13px;padding:18px 0;}
.oculto{display:none !important;}
.paginacao{display:flex;gap:8px;align-items:center;margin-top:12px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--suave);}

.login{max-width:380px;margin:12vh auto;padding:0 20px;}
.login h1{font-size:20px;}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--suave);}
.confianca{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
</style>
</head>
<body>

<div id="tela-login" class="login">
  <div class="cartao">
    <h1>Painel CIO Cerrado</h1>
    <p class="sub">Acesso restrito à equipe. Entre com seu e-mail.</p>
    <div id="login-aviso"></div>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="email">
    <div style="margin-top:11px;">
      <button class="btn" id="btn-entrar" style="width:100%;">Enviar link de acesso</button>
    </div>
  </div>
</div>

<div id="app" class="oculto">
  <header class="topo">
    <div class="marca">CIO Cerrado<span>Painel da organização</span></div>
    <div class="topo-dir">
      <select id="sel-evento" class="sel-evento" title="Evento ativo"></select>
      <span class="quem" id="quem"></span>
      <button class="sair" id="btn-sair">Sair</button>
    </div>
  </header>
  <div class="wrap">
    <div class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="painel" aria-selected="true">Painel</button>
      <button class="aba" role="tab" data-aba="aprovacoes" aria-selected="false">Aprovações<span class="contador oculto" id="c-aprov"></span></button>
      <button class="aba" role="tab" data-aba="cadastro" aria-selected="false">Cadastro<span class="contador oculto" id="c-sug"></span></button>
      <button class="aba" role="tab" data-aba="quartos" aria-selected="false">Quartos</button>
      <button class="aba" role="tab" data-aba="etiquetas" aria-selected="false">Etiquetas</button>
      <button class="aba" role="tab" data-aba="sessoes" aria-selected="false">Mesas e jantares</button>
      <button class="aba" role="tab" data-aba="pesquisa" aria-selected="false">Pesquisa</button>
      <button class="aba" role="tab" data-aba="prospeccao" aria-selected="false">Prospecção</button>
      <button class="aba" role="tab" data-aba="financeiro" aria-selected="false">Financeiro</button>
      <button class="aba" role="tab" data-aba="relatorios" aria-selected="false">Relatórios</button>
      <button class="aba" role="tab" data-aba="estrutura" aria-selected="false">Estrutura</button>
      <button class="aba" role="tab" data-aba="patrocinadores" aria-selected="false">Patrocinadores</button>
      <button class="aba" role="tab" data-aba="precos" aria-selected="false">Preços</button>
      <button class="aba" role="tab" data-aba="equipe" aria-selected="false">Equipe</button>
    </div>
    <div id="aviso-global"></div>
    <div id="conteudo"><p class="carregando">Carregando…</p></div>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACAO
// =====================================================================
const SUPABASE_URL  = "https://jlvcjqfrsxxexflvwbvn.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdmNqcWZyc3h4ZXhmbHZ3YnZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY0NTAsImV4cCI6MjEwMTM1MjQ1MH0.SkY0N_k2oaYAqZUpZCmm0GBY3j8vsZzB5oX4Am75MnE";
// Evento ativo. Vem da URL na primeira carga e depois muda pelo
// seletor do cabecalho — as duas abas globais (Cadastro e Equipe)
// ignoram este valor.
let EVENTO = new URLSearchParams(location.search).get("evento") || "cerrado2027";

// Abas que NAO dependem do evento: a base de gestores e a equipe do
// painel valem para todas as edicoes.
const ABAS_GLOBAIS = ["cadastro", "equipe"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  db: { schema: "gestao" }
});

const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function aviso(alvo, texto, tipo="erro"){
  const el = typeof alvo === "string" ? $(alvo) : alvo;
  if(!el) return;
  el.innerHTML = texto ? `<div class="aviso ${tipo}">${esc(texto)}</div>` : "";
}

function explicar(e){
  const m = e?.message || String(e);
  if(m.includes("Acesso restrito a administradores"))
    return "Esta ação exige perfil de administrador. Seu acesso é de staff.";
  if(m.includes("Acesso restrito"))  return "Seu e-mail não está cadastrado na equipe.";
  if(m.includes("JWT") || m.includes("session")) return "Sua sessão expirou. Entre novamente.";
  return m;
}

async function rpc(nome, params){
  const { data, error } = await sb.rpc(nome, params);
  if(error) throw error;
  return data;
}

const dataBR = d => d ? String(d).split("T")[0].split("-").reverse().join("/") : "—";
const moeda = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dataHora = d => d ? new Date(d).toLocaleString("pt-BR") : "—";

// timestamptz do banco -> valor de <input type="datetime-local">, que
// so aceita "YYYY-MM-DDTHH:MM" em hora LOCAL. Passar o ISO com Z faz o
// campo vir vazio, sem reclamar.
function paraInputHora(ts){
  if(!ts) return "";
  const d = new Date(ts);
  if(isNaN(d)) return "";
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 16);
}

// Hoje em ISO, para comparar com data que vem do banco como texto
// ("2026-09-01"). Comparar string com string evita o fuso: `new Date`
// num "YYYY-MM-DD" e lido como UTC e volta um dia atras no Brasil.
const HOJE_ISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
  .toISOString().slice(0, 10);

// Exporta qualquer lista para Excel, mantendo a ordem das colunas.
function exportar(linhas, colunas, nomeArquivo, nomeAba="Dados"){
  if(!linhas || linhas.length === 0){
    aviso("#aviso-global","Não há dados para exportar."); return;
  }
  const dados = linhas.map(l => {
    const o = {};
    colunas.forEach(([campo,titulo]) => o[titulo] = l[campo] ?? "");
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nomeAba);
  XLSX.writeFile(wb, nomeArquivo);
}

// =====================================================================
// LOGIN
// =====================================================================
$("#btn-entrar").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  if(!email){ aviso("#login-aviso","Informe seu e-mail."); return; }
  const btn = $("#btn-entrar");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const { error } = await sb.auth.signInWithOtp({
      email, options:{ emailRedirectTo: location.href }});
    if(error) throw error;
    aviso("#login-aviso","Link enviado. Abra seu e-mail para entrar.","ok");
  }catch(e){ aviso("#login-aviso", explicar(e)); }
  finally{ btn.disabled = false; btn.textContent = "Enviar link de acesso"; }
});
$("#email").addEventListener("keydown", e => { if(e.key==="Enter") $("#btn-entrar").click(); });
$("#btn-sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

// =====================================================================
// BOOT
// =====================================================================
let iniciado = false;
sb.auth.onAuthStateChange(ev => {
  if(ev === "SIGNED_OUT"){ location.reload(); return; }
  if(!iniciado) iniciar();
});
(async function(){
  const { data } = await sb.auth.getSession();
  if(data?.session) iniciar();
})();

async function iniciar(){
  if(iniciado) return;
  iniciado = true;
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  $("#tela-login").classList.add("oculto");
  $("#app").classList.remove("oculto");
  $("#quem").textContent = user.email;

  $$(".aba").forEach(b => b.addEventListener("click", () => {
    $$(".aba").forEach(x => x.setAttribute("aria-selected", x === b));
    ABA_ATUAL = b.dataset.aba;
    ABAS[ABA_ATUAL]();
  }));

  await carregarSeletorEventos();
  ABAS.painel();
  atualizarContadores();
}

let ABA_ATUAL = "painel";

async function carregarSeletorEventos(){
  const sel = $("#sel-evento");
  try{
    const evs = await rpc("admin_listar_eventos");

    if(evs.length === 0){
      sel.innerHTML = `<option>Nenhum evento</option>`;
      sel.disabled = true;
      return;
    }

    // se a URL trouxe um slug que nao existe, cai no primeiro da lista
    // em vez de deixar todas as abas vazias sem explicar por que
    if(!evs.some(e => e.slug === EVENTO)) EVENTO = evs[0].slug;

    const rotulo = { rascunho:"rascunho", aberto:"aberto", encerrado:"encerrado" };
    sel.innerHTML = evs.map(e => `
      <option value="${esc(e.slug)}" ${e.slug === EVENTO ? "selected" : ""}>
        ${esc(e.nome)} · ${rotulo[e.status] || e.status}
      </option>`).join("");
    sel.disabled = false;

    sel.addEventListener("change", () => trocarEvento(sel.value));
  }catch(e){
    sel.innerHTML = `<option>${esc(EVENTO)}</option>`;
    sel.disabled = true;
  }
}

function trocarEvento(slug){
  EVENTO = slug;

  // mantem o link compartilhavel: quem copiar a URL abre no mesmo evento
  const u = new URL(location.href);
  u.searchParams.set("evento", slug);
  history.replaceState(null, "", u);

  aviso("#aviso-global", "");

  // as duas abas globais nao mudam de conteudo ao trocar de evento;
  // redesenhar seria so um piscar sem sentido
  if(!ABAS_GLOBAIS.includes(ABA_ATUAL)) ABAS[ABA_ATUAL]();
  atualizarContadores();
}

async function atualizarContadores(){
  try{
    const [pend, sug] = await Promise.all([
      rpc("admin_listar_pendentes", { p_evento_slug: EVENTO }),
      rpc("admin_listar_sugestoes", { p_status: "pendente" })
    ]);
    marcar("#c-aprov", pend.length);
    marcar("#c-sug",   sug.length);
  }catch(e){ /* contador e acessorio: nao bloqueia o painel */ }
}
function marcar(sel, n){
  const el = $(sel);
  el.textContent = n;
  el.classList.toggle("oculto", !n);
}

// =====================================================================
// ABA: PAINEL
// =====================================================================
const ABAS = {};

ABAS.painel = async function(){
  const c = $("#conteudo");
  c.innerHTML = `<p class="carregando">Carregando painel…</p>`;
  try{
    // Pagina de verdade: com limite fixo de 500, um evento maior perderia
    // gente da lista sem avisar ninguem.
    const linhas = await puxarTudo("admin_rel_painel");

    const total = linhas.length;
    const cont = k => linhas.filter(k).length;

    c.innerHTML = `
      <h1>Painel do evento</h1>
      <p class="sub">${total} participante(s) · quem está pendente aparece primeiro na busca.</p>

      <div class="barra">
        <div><label>Buscar</label><input type="text" id="p-busca" placeholder="Nome ou empresa"></div>
        <div><label>Contrato</label>
          <select id="p-contrato">
            <option value="">Todos</option>
            <option value="assinado">Assinado</option>
            <option value="enviado">Enviado</option>
            <option value="nao_enviado">Não enviado</option>
          </select></div>
        <div><label>Rooming</label>
          <select id="p-rooming">
            <option value="">Todos</option>
            <option value="completo">Completo</option>
            <option value="nao_iniciado">Não iniciado</option>
          </select></div>
        <div style="min-width:auto;">
          <button class="btn sec" id="p-exportar">Exportar Excel</button>
        </div>
      </div>

      <div class="cartao">
        <p class="meta" style="margin:0 0 10px;">
          ${cont(l=>l.status_contrato==="assinado")} contrato(s) assinado(s) ·
          ${cont(l=>l.status_rooming==="completo")} rooming completo(s) ·
          ${cont(l=>l.usa_transfer)} usando transfer
        </p>
        <div class="rolagem"><table id="p-tabela"></table></div>
      </div>`;

    const desenhar = () => {
      const busca = $("#p-busca").value.toLowerCase();
      const fc = $("#p-contrato").value, fr = $("#p-rooming").value;
      const vis = linhas.filter(l =>
        (!busca || `${l.nome} ${l.empresa}`.toLowerCase().includes(busca)) &&
        (!fc || l.status_contrato === fc) &&
        (!fr || l.status_rooming === fr));

      $("#p-tabela").innerHTML = `
        <tr><th>Nome</th><th>Empresa</th><th>Inscrição</th><th>Contrato</th>
            <th>Rooming</th><th>Transfer</th><th>Quarto</th></tr>
        ${vis.map(l => `<tr>
          <td>${esc(l.nome)}</td>
          <td>${esc(l.empresa||"—")}</td>
          <td><span class="selo ${l.status_inscricao==="aprovado"?"ok":"pend"}">${esc(l.status_inscricao)}</span></td>
          <td><span class="selo ${l.status_contrato==="assinado"?"ok":"alerta"}">${esc(l.status_contrato)}</span></td>
          <td><span class="selo ${l.status_rooming==="completo"?"ok":"pend"}">${esc(l.status_rooming)}</span></td>
          <td>${l.usa_transfer ? "Sim" : "—"}</td>
          <td class="meta">${esc(l.quarto||"—")}</td>
        </tr>`).join("") ||
        `<tr><td colspan="7" style="color:var(--suave)">Nenhum resultado para esse filtro.</td></tr>`}`;
    };

    ["#p-busca","#p-contrato","#p-rooming"].forEach(s =>
      $(s).addEventListener("input", desenhar));
    $("#p-exportar").addEventListener("click", () => exportar(linhas, [
      ["nome","Nome"],["empresa","Empresa"],["email","E-mail"],
      ["status_inscricao","Inscrição"],["status_contrato","Contrato"],
      ["status_rooming","Rooming"],["quarto","Quarto"]
    ], "painel-cio-cerrado.xlsx", "Painel"));

    desenhar();
  }catch(e){ aviso(c, explicar(e)); }
};

// =====================================================================
// ABA: APROVACOES
// =====================================================================
ABAS.aprovacoes = async function(){
  const c = $("#conteudo");
  c.innerHTML = `<p class="carregando">Carregando fila…</p>`;
  try{
    const [pend, indic] = await Promise.all([
      rpc("admin_listar_pendentes",  { p_evento_slug: EVENTO }),
      rpc("admin_listar_indicacoes", { p_evento_slug: EVENTO, p_status: "nova" })
    ]);

    c.innerHTML = `
      <h1>Aprovações</h1>
      <p class="sub">Cadastros aguardando decisão e indicações que ainda não viraram inscrição.</p>

      <h2>Aguardando aprovação</h2>
      <div class="cartao" id="box-pend">${pend.length ? "" :
        `<div class="vazio">Nada na fila. Novos cadastros aparecem aqui.</div>`}</div>

      <h2 style="margin-top:22px;">Indicações de patrocinadores</h2>
      <div class="cartao" id="box-indic">${indic.length ? "" :
        `<div class="vazio">Nenhuma indicação nova.</div>`}</div>`;

    if(pend.length) $("#box-pend").innerHTML = `<table>
      <tr><th>Nome</th><th>Empresa</th><th>Contato</th><th>Origem</th><th></th></tr>
      ${pend.map(p => `<tr data-id="${esc(p.participante_id)}">
        <td><strong>${esc(p.nome)}</strong><br><span class="meta">${esc(p.cargo||"")}</span></td>
        <td>${esc(p.empresa||"—")}</td>
        <td class="meta">${esc(p.email)}<br>${esc(p.telefone||"")}</td>
        <td><span class="selo pend">${esc(p.origem)}</span>
            ${p.indicado_por ? `<br><span class="meta">por ${esc(p.indicado_por)}</span>` : ""}</td>
        <td style="white-space:nowrap;">
          <button class="btn ok mini aprovar">Aprovar</button>
          <button class="btn perigo mini recusar">Recusar</button>

        <td>${esc(i.empresa||"—")}</td>

async function decidir(btn, aprovado){
  const tr = btn.closest("tr");
  const id = tr.dataset.id;
  if(!aprovado && !confirm("Recusar este cadastro?")) return;

  $$("button", tr).forEach(b => b.disabled = true);
  try{
    await rpc("admin_aprovar_participante",
      { p_participante_id: id, p_aprovado: aprovado });
    aviso("#aviso-global", aprovado
      ? "Aprovado. O contrato entra na fila de envio."
      : "Cadastro recusado.", "ok");
    ABAS.aprovacoes(); atualizarContadores();
  }catch(e){
    aviso("#aviso-global", explicar(e));
    $$("button", tr).forEach(b => b.disabled = false);
  }
}

ABAS.cadastro = async function(){
  const c = $("#conteudo");
  c.innerHTML = `
    <h1>Cadastro de gestores <span class="escopo-global">todos os eventos</span></h1>
    <p class="sub">Base única de gestores, compartilhada entre as edições. Suba a planilha para criar e atualizar em lote.</p>

    <div class="cartao">
      <h2>Importar planilha</h2>
      <p class="sub" style="margin-bottom:12px;">
        Colunas esperadas: nome, email, empresa, cargo, telefone, cnpj, segmento, estado, perfil.
        Célula vazia não apaga o que já existe. <strong>Troca de empresa</strong> de quem já está
        cadastrado não é aplicada direto — vira sugestão para você aprovar abaixo.
      </p>
      <div class="barra">
        <div><label>Arquivo (.xlsx ou .csv)</label><input type="file" id="arq" accept=".xlsx,.xls,.csv"></div>
        <div style="min-width:auto;"><button class="btn" id="btn-importar" disabled>Importar</button></div>
      </div>
      <div id="imp-aviso"></div>
      <div id="imp-previa"></div>
    </div>

    <h2 style="margin-top:22px;">Sugestões para revisar</h2>
    <p class="sub">Trocas de empresa, gestores novos e divergências encontradas na base. Nada é aplicado sem sua aprovação.</p>
    <div class="cartao" id="box-sug"><p class="carregando">Carregando…</p></div>`;

  let LINHAS = [];

  $("#arq").addEventListener("change", async ev => {
    const f = ev.target.files[0];
    if(!f) return;
    try{
      const buf = await f.arrayBuffer();
      const wb  = XLSX.read(buf, { type:"array" });
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const cru = XLSX.utils.sheet_to_json(ws, { defval:"" });

      // normaliza o cabecalho: a planilha vem com maiuscula, acento e
      // espaco, e a funcao do banco espera chaves minusculas e simples
      LINHAS = cru.map(l => {
        const o = {};
        Object.entries(l).forEach(([k,v]) => {
          const chave = String(k).trim().toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .replace(/[^a-z]/g,"")
            .replace(/^e?mail$/,"email");
          o[chave] = String(v).trim();
        });
        return o;
      });

      const semEmail = LINHAS.filter(l => !l.email || !l.nome).length;
      $("#imp-previa").innerHTML = `
        <p class="meta" style="margin-top:10px;">
          ${LINHAS.length} linha(s) lida(s)${semEmail ? ` · ${semEmail} sem nome ou e-mail serão ignoradas` : ""}
        </p>
        <div class="rolagem" style="max-height:220px;margin-top:8px;">
          <table><tr><th>Nome</th><th>E-mail</th><th>Empresa</th></tr>
          ${LINHAS.slice(0,20).map(l => `<tr>
            <td>${esc(l.nome||"—")}</td><td class="meta">${esc(l.email||"—")}</td>
            <td>${esc(l.empresa||"—")}</td></tr>`).join("")}</table>
        </div>`;
      $("#btn-importar").disabled = LINHAS.length === 0;
      aviso("#imp-aviso","");
    }catch(e){
      aviso("#imp-aviso","Não foi possível ler o arquivo. Confira se é um .xlsx ou .csv válido.");
    }
  });

  $("#btn-importar").addEventListener("click", async () => {
    const btn = $("#btn-importar");
    btn.disabled = true; btn.textContent = "Importando…";
    try{
      const r = await rpc("admin_importar_gestores", { p_linhas: LINHAS });
      aviso("#imp-aviso",
        `${r.criados} criado(s), ${r.atualizados} atualizado(s), ${r.erros} ignorado(s)` +
        (r.sugestoes ? ` · ${r.sugestoes} troca(s) de empresa aguardando sua aprovação abaixo` : "") + ".",
        r.erros ? "erro" : "ok");
      // a fila de sugestões pode ter crescido com esta importação
      carregarSugestoes();
      atualizarContadores();

      if(r.erros && r.detalhe_erros?.length){
        $("#imp-previa").innerHTML = `<table style="margin-top:10px;">
          <tr><th>Linha</th><th>Nome</th><th>Motivo</th></tr>
          ${r.detalhe_erros.map(d => `<tr>
            <td class="meta">${d.linha}</td><td>${esc(d.nome||"—")}</td>
            <td><span class="selo erro">${esc(d.motivo)}</span></td></tr>`).join("")}</table>`;
      }
    }catch(e){
      aviso("#imp-aviso", explicar(e));
    }finally{
      btn.disabled = false; btn.textContent = "Importar";
    }
  });

  carregarSugestoes();
};

const ROTULO_SUG = {
  troca_empresa:"Trocou de empresa",
  novo_gestor:"Novo gestor",
  nova_empresa:"Empresa nova",
  dado_divergente:"Dado divergente"
};

async function carregarSugestoes(){
  try{
    const sug = await rpc("admin_listar_sugestoes", { p_status:"pendente" });
    $("#box-sug").innerHTML = sug.length === 0
      ? `<div class="vazio">Nada para revisar agora.</div>`
      : `<table>
          <tr><th>Tipo</th><th>Quem</th><th>De → para</th><th>Confiança</th><th>Origem</th><th></th></tr>
          ${sug.map(s => `<tr data-id="${esc(s.id)}">

            <td><strong>${esc(s.gestor_nome||s.empresa||"—")}</strong>
                ${s.campo ? `<br><span class="meta">${esc(s.campo)}</span>` : ""}</td>
            <td>${esc(s.valor_atual||"—")} → <strong>${esc(s.valor_sugerido||"—")}</strong>
                ${s.justificativa ? `<br><span class="meta">${esc(s.justificativa)}</span>` : ""}</td>
            <td class="confianca">${s.confianca != null ? s.confianca+"%" : "—"}</td>
            <td class="meta">${esc(s.fonte||"—")}</td>

              <button class="btn ok mini aplicar">Aprovar</button>
              <button class="btn sec mini ignorar">Ignorar</button>
            </td></tr>`).join("")}</table>`;

    $$("#box-sug .aplicar").forEach(b => b.addEventListener("click", () => revisar(b, true)));
    $$("#box-sug .ignorar").forEach(b => b.addEventListener("click", () => revisar(b, false)));
  }catch(e){ aviso("#box-sug", explicar(e)); }
}

async function revisar(btn, aprovar){
  const tr = btn.closest("tr");
  $$("button", tr).forEach(b => b.disabled = true);
  try{
    await rpc("admin_aplicar_sugestao",
      { p_sugestao_id: tr.dataset.id, p_aprovar: aprovar });
    tr.remove();
    atualizarContadores();
  }catch(e){
    aviso("#aviso-global", explicar(e));
    $$("button", tr).forEach(b => b.disabled = false);
  }
}

ABAS.quartos = async function(){
  const c = $("#conteudo");
  c.innerHTML = `<p class="carregando">Carregando alocação…</p>`;
  try{
    const [pessoas, livres] = await Promise.all([
      rpc("admin_listar_alocacao", { p_evento_slug: EVENTO, p_apenas_sem_quarto:false }),
      rpc("admin_quartos_livres",  { p_evento_slug: EVENTO })
    ]);

    // agrupa por reserva: o quarto e da reserva, nao da pessoa
    const reservas = new Map();
    pessoas.forEach(p => {
      if(!reservas.has(p.reserva_id))
        reservas.set(p.reserva_id, {
          reserva_id:p.reserva_id, empresa:p.empresa, quarto_tipo:p.quarto_tipo,
          quarto_id:p.quarto_id, quarto_numero:p.quarto_numero, gente:[] });
      reservas.get(p.reserva_id).gente.push(p.nome);
    });
    const lista = [...reservas.values()];
    const semQuarto = lista.filter(r => !r.quarto_id).length;

    c.innerHTML = `
      <h1>Separar quartos</h1>
      <p class="sub">${lista.length} reserva(s) · ${semQuarto} ainda sem número · ${livres.length} quarto(s) livre(s).</p>
      <div class="barra">
        <div><label>Buscar</label><input type="text" id="q-busca" placeholder="Empresa ou pessoa"></div>
        <div><label>Mostrar</label>
          <select id="q-filtro">
            <option value="">Todas as reservas</option>
            <option value="sem">Só as sem número</option>
          </select></div>
      </div>
      <div class="cartao"><div class="rolagem"><table id="q-tabela"></table></div></div>`;

    const opcoes = q => livres.map(l =>
      `<option value="${esc(l.id)}">${esc(l.numero||"s/n")} · ${esc(l.tipo)} (${l.capacidade})</option>`).join("");

    const desenhar = () => {
      const busca = $("#q-busca").value.toLowerCase();
      const so = $("#q-filtro").value;
      const vis = lista.filter(r =>
        (!busca || `${r.empresa} ${r.gente.join(" ")}`.toLowerCase().includes(busca)) &&
        (so !== "sem" || !r.quarto_id));

      $("#q-tabela").innerHTML = `
        <tr><th>Empresa</th><th>Pessoas</th><th>Tipo</th><th>Quarto</th></tr>
        ${vis.map(r => `<tr data-reserva="${esc(r.reserva_id)}">
          <td>${esc(r.empresa||"—")}</td>
          <td>${r.gente.map(esc).join("<br>")}</td>
          <td class="meta" style="text-transform:capitalize">${esc(r.quarto_tipo||"—")}</td>
          <td>
            ${r.quarto_id
              ? `<span class="selo ok">${esc(r.quarto_numero||"s/n")}</span>
                 <button class="btn sec mini soltar" style="margin-left:6px;">Liberar</button>`
              : `<select class="escolher"><option value="">— escolher —</option>${opcoes(r)}</select>`}
          </td></tr>`).join("") ||
        `<tr><td colspan="4" style="color:var(--suave)">Nenhuma reserva com esse filtro.</td></tr>`}`;

      $$("#q-tabela .escolher").forEach(s => s.addEventListener("change", () => alocar(s)));
      $$("#q-tabela .soltar").forEach(b => b.addEventListener("click", () => alocar(b, true)));
    };

    ["#q-busca","#q-filtro"].forEach(s => $(s).addEventListener("input", desenhar));
    desenhar();
  }catch(e){ aviso(c, explicar(e)); }
};

async function alocar(el, liberar=false){
  const reserva = el.closest("tr").dataset.reserva;
  const quarto  = liberar ? null : el.value;
  if(!liberar && !quarto) return;

  el.disabled = true;
  try{
    const r = await rpc("admin_alocar_quarto",
      { p_reserva_id: reserva, p_quarto_id: quarto });

    if(!r.ok){
      // o banco recusou por um motivo que a tela precisa explicar
      aviso("#aviso-global", r.motivo === "quarto_ocupado"
        ? "Esse quarto acabou de ser ocupado por outra reserva."
        : `Não cabe: a reserva tem ${r.ocupantes} pessoa(s) e o quarto comporta ${r.capacidade}.`);
    }
    ABAS.quartos();
  }catch(e){
    aviso("#aviso-global", explicar(e));
    el.disabled = false;
  }
}

        });

      }catch(e){
        aviso("#aviso-global", explicar(e));
        b.disabled = false; b.textContent = "Adicionar";
      }
    }));
  }catch(e){ aviso(box, explicar(e)); }
}

// Puxa todas as paginas: o Data API corta em 1000 linhas por resposta.
async function puxarTudo(fn, extras={}, passo=500){
  let todos = [], offset = 0, total = null;
  while(total === null || offset < total){
    const p = await rpc(fn, { p_evento_slug: EVENTO, p_limite: passo, p_offset: offset, ...extras });
    if(p.length === 0) break;
    if(total === null) total = Number(p[0].total_geral);
    todos = todos.concat(p);
    offset += passo;
    if(todos.length >= total) break;
  }
  return todos;
}

// A fatura é recalculada do zero a cada save do rooming, mas só
// enquanto está "estimada". Emitir é o ato que congela o valor: daí em
// diante o portal pode mexer no quarto que a conta não muda mais.
// Por isso o botão de recalcular avisa que só pega as estimadas.
// =====================================================================
const ROTULO_FAT = {
  estimada:"Estimada", emitida:"Emitida", paga:"Paga", cancelada:"Cancelada"
};
const SELO_FAT = {
  estimada:"pend", emitida:"alerta", paga:"ok", cancelada:"erro"
};

ABAS.financeiro = async function(){
  const c = $("#conteudo");
  c.innerHTML = `<p class="carregando">Carregando…</p>`;

          ${moeda(r.recebido)} recebido em ${r.qtd_pago} ·
          total lançado ${moeda(r.total)}

        <div><label>Status</label>
          <select id="fi-status">
            <option value="">Todas</option>
            <option value="estimada">Estimada</option>

            <option value="paga">Paga</option>
            <option value="cancelada">Cancelada</option>
          </select></div>
        <div><label>Buscar</label>
          <input type="text" id="fi-busca" placeholder="Nome ou empresa"></div>
        <div style="min-width:auto;">
          <button class="btn sec" id="fi-recalcular">Recalcular estimadas</button></div>
        <div style="min-width:auto;">
          <button class="btn sec" id="fi-exportar">Exportar Excel</button></div>

      <div class="cartao"><div class="rolagem"><table id="fi-tabela"></table></div></div>
      <div id="fi-detalhe"></div>`;

    let FAT = [];

    const desenhar = () => {
      const busca = $("#fi-busca").value.toLowerCase();
      const vis = FAT.filter(f =>
        !busca || `${f.nome} ${f.empresa||""}`.toLowerCase().includes(busca));

      $("#fi-tabela").innerHTML = `
        <tr><th>Quem</th><th>Tipo</th><th>Itens</th><th>Valor</th>

                            data-status="${esc(f.status)}">
          <td><strong>${esc(f.nome)}</strong>
              ${f.empresa && f.empresa !== f.nome
                ? `<br><span class="meta">${esc(f.empresa)}</span>` : ""}

          <td class="meta">${f.tipo === "patrocinador" ? "Patrocinador" : "Participante"}</td>
          <td class="meta" style="max-width:260px;">${esc(f.itens || "—")}</td>
          <td><strong>${moeda(f.total)}</strong></td>
          <td><span class="selo ${SELO_FAT[f.status]||"pend"}">${esc(ROTULO_FAT[f.status]||f.status)}</span>

      $$("#fi-tabela .fi-ver").forEach(b =>

      $$("#fi-tabela .fi-marcar").forEach(b =>

function abrirMarcar(tr){
  const box = $("#fi-detalhe");
  const atual = tr.dataset.status;
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });

  box.innerHTML = `
    <h2 style="margin-top:16px;">Alterar · ${esc(tr.dataset.nome)}</h2>
    <div class="cartao">
      <p class="sub" style="margin-bottom:12px;">

        mexer nesta fatura, mesmo que o rooming mude.
      </p>
      <div class="barra">
        <div style="max-width:170px;"><label>Status</label>
          <select id="fm-status">
            ${["estimada","emitida","paga","cancelada"].map(s =>
              `<option value="${s}" ${s===atual?"selected":""}>${ROTULO_FAT[s]}</option>`).join("")}
          </select></div>
        <div style="max-width:180px;"><label>Vencimento</label>
          <input type="date" id="fm-venc"></div>

      <button class="btn" id="fm-salvar">Salvar</button>
      <button class="btn sec" id="fm-cancelar" style="margin-left:6px;">Fechar</button>
    </div>`;

  $("#fm-cancelar").addEventListener("click", () => box.innerHTML = "");

  $("#fm-salvar").addEventListener("click", async () => {
    const b = $("#fm-salvar");
    const status = $("#fm-status").value;

    // a forma de pagamento só é gravada quando o status é "paga"; pedir
    // aqui evita a pessoa preencher e o valor sumir sem explicação
    if(status === "paga" && !$("#fm-forma").value.trim()){
      aviso("#fm-aviso","Informe a forma de pagamento para marcar como paga.");
      return;
    }

    b.disabled = true; b.textContent = "Salvando…";
    try{
      const x = await rpc("admin_marcar_fatura", {
        p_fatura_id: tr.dataset.id,
        p_status: status,
        p_forma_pagamento: $("#fm-forma").value.trim() || null,
        p_observacao: $("#fm-obs").value.trim() || null,
        p_vencimento: $("#fm-venc").value || null
      });
      aviso("#aviso-global",
        `${tr.dataset.nome}: ${ROTULO_FAT[x.de]||x.de} → ${ROTULO_FAT[x.para]||x.para}.`, "ok");
      box.innerHTML = "";
      ABAS.financeiro();
    }catch(e){
      aviso("#fm-aviso", explicar(e));
      b.disabled = false; b.textContent = "Salvar";
    }
  });
}

let COTA_UNICA = false;

// Escolher os patrocinadores pela cota, em vez de abrir cada empresa
// e trocar o campo "cota" um por um.
async function patrocinadoresDaCota(cotaId, cotaNome){
  const box = $("#co-detalhe");
  box.innerHTML = `<p class="carregando">Carregando…</p>`;
  try{
    const todos = await rpc("admin_listar_patrocinadores", { p_evento_slug: EVENTO });

    box.innerHTML = `
      <h2 style="margin-top:16px;">Patrocinadores da cota ${esc(cotaNome)}</h2>
      <p class="sub">Marque quem pertence a esta cota. Desmarcar deixa a empresa sem cota, não a remove.</p>
      <div class="rolagem" style="max-height:300px;">
        <table>
          <tr><th></th><th>Empresa</th><th>Cota atual</th></tr>
          ${todos.map(p => `<tr>
            <td><input type="checkbox" class="cp-pick" value="${esc(p.id)}"
                       ${p.cota === cotaNome ? "checked" : ""}></td>
            <td>${esc(p.empresa)}</td>
            <td class="meta">${esc(p.cota || "sem cota")}</td>
          </tr>`).join("")}
        </table>
      </div>
      <div id="cp-aviso"></div>
      <button class="btn" id="cp-salvar" style="margin-top:10px;">Salvar cota</button>`;

    $("#cp-salvar").addEventListener("click", async () => {
      const b = $("#cp-salvar");
      const ids = $$(".cp-pick:checked", box).map(c => c.value);
      b.disabled = true; b.textContent = "Salvando…";
      try{
        const r = await rpc("admin_definir_patrocinadores_cota", {
          p_cota_id: cotaId, p_patrocinadores: ids });
        aviso("#cp-aviso",
          `${r.na_cota} na cota` + (r.removidos ? ` · ${r.removidos} removido(s)` : ""), "ok");
        blocoCotas();
      }catch(e){ aviso("#cp-aviso", explicar(e)); }
      finally{ b.disabled = false; b.textContent = "Salvar cota"; }
    });
  }catch(e){ aviso(box, explicar(e)); }
}

async function salvarCota(){
  const nome  = $("#co-nome").value.trim();
  if(!nome){ aviso("#co-aviso","Informe o nome da cota."); return; }

  const ordem = COTA_UNICA ? 1 : parseInt($("#co-ordem")?.value, 10);
  if(!COTA_UNICA && (!ordem || ordem < 1)){
    aviso("#co-aviso","A ordem começa em 1."); return;
  }

  const quartos = {};
  [["single","#co-q-single"],["duplo","#co-q-duplo"],["triplo","#co-q-triplo"]]
    .forEach(([t,s]) => {
      const n = parseInt($(s).value, 10);
      if(n > 0) quartos[t] = n;
    });

  const b = $("#co-salvar");
  b.disabled = true; b.textContent = "Salvando…";
  try{
    await rpc("admin_salvar_cota", {
      p_evento_slug: EVENTO, p_nome: nome, p_ordem: ordem,
      p_quartos: quartos,
      p_vagas_mesa: parseInt($("#co-mesa").value,10) || 0,
      p_reuniao: $("#co-reuniao").value === "1",
      p_jantar:  $("#co-jantar").value  === "1",
      // vazio vira null de proposito: e assim que se tira o prazo de
      // uma cota que ja teve um
      p_prazo_indicacao: $("#co-prazo")?.value || null,
      p_janela_horas: parseInt($("#co-janela")?.value, 10) || null
    });
    ["#co-nome","#co-mesa","#co-q-single","#co-q-duplo","#co-q-triplo"]
      .forEach(s => $(s).value = "");
    if($("#co-ordem"))  $("#co-ordem").value  = "";
    if($("#co-prazo"))  $("#co-prazo").value  = "";
    if($("#co-janela")) $("#co-janela").value = "";
    blocoCotas();
  }catch(e){ aviso("#co-aviso", explicar(e)); }
  finally{ b.disabled = false; b.textContent = "Salvar cota"; }
}

    `"natureza":"privada|hibrida|publica","cidade":"sede","estado":"UF"}\n` +

// =====================================================================
// CHAMADA DE IA
// Passa pela Edge Function "ia": a chave da Anthropic fica no servidor.
// Chamar api.anthropic.com direto daqui exigiria a chave dentro deste
// arquivo, que é público.
// =====================================================================
async function ia(prompt, { buscarWeb = false, json = false, maxTokens = 2000 } = {}){
  const { data, error } = await sb.functions.invoke("ia", {
    body: { prompt, buscar_web: buscarWeb, json, max_tokens: maxTokens }
  });
  if(error) throw new Error(error.message || "Falha ao chamar a IA.");
  if(data?.erro) throw new Error(data.erro);
  return json ? data.dados : data.texto;
}

let PESQ_LINHAS = [];

// Mapeia as 73 colunas do export. As de investimento e as de perfil
// vão para grupos separados, senão a agregação por área misturaria
// "COMO A TI ESCOLHE FORNECEDORES" com "INVESTIMENTO INFRA - BACKUP".
const MAPA_PESQ = {
  "E-MAIL CORPORATIVO": "email",
  "Faturamento Anual da Emprea": "faturamento",
  "Orçamento Anual da Área de TI(CAPEX e OPEX)": "orcamento_ti",
  "Número de Colaboradores da Empresa": "colaboradores",
  "Número Colaboradores de TI da Empresa": "colaboradores_ti",
  "SISTEMA ERP ATUAL": "erp_atual",
  "Quantidade de dispositivos(Desktops, notebooks, smartphones, etc.)": "dispositivos",
  "Quais são seus serviços de TI já terceirizados ?": "terceirizados",
  "TERMO DE CONSENTIMENTO E RESPONSABILIDADE – LGPD": "consentimento_lgpd",
};

const chave = s => String(s||"").trim().toUpperCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

async function lerPesquisa(ev){
  const f = ev.target.files[0];
  if(!f) return;
  try{
    const buf = await f.arrayBuffer();
    const wb  = XLSX.read(buf, { type:"array" });
    const ws  = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

    // O export traz título e local nas primeiras linhas antes do
    // cabeçalho real. O critério antigo era "primeira linha com mais de
    // 20 colunas" — funcionava com o export atual (73 colunas), mas
    // quebrava em qualquer formulário mais curto, caindo na linha 1 e
    // importando zero. Agora pega a linha mais preenchida entre as
    // primeiras 20, exigindo ao menos 3 colunas.
    let iCab = 0, melhor = 0;
    aoa.slice(0, 20).forEach((l, i) => {
      const n = l.filter(v => String(v).trim()).length;
      if(n > melhor){ melhor = n; iCab = i; }
    });

    if(melhor < 3){
      aviso("#pq-aviso",
        "Não encontrei uma linha de cabeçalho neste arquivo. Confira se é o export de participantes do Sympla.");
      $("#pq-importar").disabled = true;
      $("#pq-previa").innerHTML = "";
      return;
    }

    const cab = aoa[iCab].map(v => String(v).trim());
    const mapaNorm = {};
    Object.entries(MAPA_PESQ).forEach(([k,v]) => mapaNorm[chave(k)] = v);

    PESQ_LINHAS = aoa.slice(iCab+1)
      .filter(l => l.some(v => String(v).trim()))
      .map(l => {
        const o = { investimentos:{}, perfil:{} };
        cab.forEach((titulo, i) => {
          const valor = String(l[i] ?? "").trim();
          if(!titulo) return;
          const campo = mapaNorm[chave(titulo)];
          if(campo){ o[campo] = valor; return; }
          if(chave(titulo).startsWith("INVESTIMENTO")){
            if(valor) o.investimentos[titulo.replace(/^INVESTIMENTO\s*/i,"").trim()] = valor;
          }else if(valor){
            o.perfil[titulo] = valor;
          }
        });
        o.nome = String(l[0] ?? "").trim();
        return o;
      })
      .filter(o => o.email);

    const areas = PESQ_LINHAS[0] ? Object.keys(PESQ_LINHAS[0].investimentos).length : 0;
    $("#pq-previa").innerHTML = `
      <p class="meta" style="margin-top:10px;">
        ${PESQ_LINHAS.length} respondente(s) · ${areas} área(s) de investimento por linha
        · cabeçalho na linha ${iCab+1} (${melhor} colunas)
      </p>`;
    $("#pq-importar").disabled = PESQ_LINHAS.length === 0;

    // Zero respondentes quase sempre é coluna de e-mail com outro nome,
    // não arquivo vazio — dizer isso poupa uma investigação.
    aviso("#pq-aviso", PESQ_LINHAS.length === 0
      ? `Li a linha ${iCab+1} como cabeçalho, mas nenhuma linha tinha e-mail. ` +
        `A coluna precisa se chamar "E-MAIL CORPORATIVO".`
      : "", "erro");
  }catch(e){
    aviso("#pq-aviso","Não consegui ler o arquivo. Confira se é o export do Sympla em .xlsx.");
  }
}

    // escolher o jantar preenche o nome do patrocinador

      if(p) $("#pr-nome").value = p;

    $("#pr-rodar").addEventListener("click", rodarProspeccao);
  }catch(e){ aviso(c, explicar(e)); }

async function rodarProspeccao(){
  const btn = $("#pr-rodar");
  const nome = $("#pr-nome").value.trim();

  if(!nome){
    aviso("#pr-aviso","Informe a empresa patrocinadora — é o perfil dela que define a aderência.");
    return;
  }

  PROSP_PATRO = nome;
  PROSP_EXECS = $("#pr-execs").value;

  btn.disabled = true;
  const status = t => $("#pr-status").innerHTML = `<p class="carregando">${esc(t)}</p>`;

  try{
    // rodadas marcadas viram lista de empresas bloqueadas
    const marcadas = $$(".pr-rod:checked").map(c => c.value);
    let bloquear = [];
    if(marcadas.length){
      status("Levantando empresas das rodadas anteriores…");
      for(const r of marcadas){
        const emp = await rpc("admin_empresas_da_rodada", { p_rodada: r });
        bloquear = bloquear.concat(emp.map(x => x.empresa));
      }
    }

    status("Buscando empresas na base…");
    let base = await rpc("admin_prospeccao_base", {
      p_evento_slug: EVENTO,
      p_excluir_fornecedores: $("#pr-forn").checked,
      p_excluir_empresas: bloquear.length ? bloquear : null,
      p_excluir_convidados: $("#pr-hist").checked,
      p_tipo_sessao: "jantar",
      p_limite: 500
    });

    if(base.length === 0){
      $("#pr-status").innerHTML = "";
      aviso("#pr-aviso","Nenhuma empresa nova com esses filtros. Tente desmarcar rodadas anteriores ou o histórico.");
      btn.disabled = false; return;
    }

    // ---- abrangência geográfica interpretada pela IA ----
    const abr = $("#pr-abr").value.trim();
    if(abr){
      status(`Interpretando a abrangência "${abr}"…`);
      const pares = [...new Set(base.map(e =>
        `${(e.cidade||"").trim()}|${(e.estado||"").trim()}`))].filter(p => p !== "|");

      if(pares.length){
        try{
          const idx = await ia(
            `Abrangência geográfica desejada (texto do organizador do evento): "${abr}"\n\n` +
            `Lista de localidades (indice: cidade|UF):\n` +
            pares.map((p,i) => `${i}: ${p}`).join("\n") +
            `\n\nQuais índices pertencem a essa abrangência? Interprete com bom senso: ` +
            `"e região"/"entorno" inclui a região metropolitana e municípios vizinhos; ` +
            `siglas como BSB = Brasília; "todo o Brasil" = todos. ` +
            `Responda APENAS um array JSON de índices, sem markdown. Ex.: [0,3,7]`,
            { json: true, maxTokens: 1500 });

          const ok = new Set((Array.isArray(idx) ? idx : []).map(Number)
            .map(i => pares[i]).filter(Boolean).map(p => p.toUpperCase()));

          if(ok.size){
            base = base.filter(e =>
              ok.has(`${(e.cidade||"").trim()}|${(e.estado||"").trim()}`.toUpperCase()));
          }
        }catch(e){
          // Se a IA falhar, cai para comparação textual simples em vez
          // de ignorar o filtro e trazer o Brasil inteiro.
          const a = abr.toUpperCase();
          base = base.filter(e => {
            const cid = (e.cidade||"").trim().toUpperCase();
            const est = (e.estado||"").trim().toUpperCase();
            return (cid && a.includes(cid)) || (est && a.includes(est));
          });
          status("Não consegui interpretar a abrangência; usei comparação simples.");
        }
      }
    }

    if(base.length === 0){
      $("#pr-status").innerHTML = "";
      aviso("#pr-aviso",`Nenhuma empresa dentro de "${abr}". Amplie a abrangência.`);
      btn.disabled = false; return;
    }

    // ---- perfil do patrocinador ----
    status(`Pesquisando o perfil de ${nome}…`);
    const site = $("#pr-site").value.trim();
    let perfil = nome + (site ? " — " + site : "");
    try{
      perfil = await ia(
        `Pesquise a empresa "${nome}"${site ? ` (site: ${site})` : ""} e responda em no máximo ` +
        `120 palavras: o que ela vende, principais serviços/produtos, e que perfil de cliente ` +
        `empresarial ela busca. Responda só o texto, sem preâmbulo.`,
        { buscarWeb: true, maxTokens: 600 });
    }catch(e){
      status(`Não consegui pesquisar ${nome} na web. Seguindo com o cadastro.`);
    }

    // ---- classificação e score em lotes ----
    const soPriv = $("#pr-priv").checked;
    const incHib = $("#pr-hib").checked;
    const perfilDesejado = $("#pr-perfil").value.trim();
    const fatMin = $("#pr-fatmin").value.trim();
    const obs = $("#pr-obs").value.trim();

    const regraIncluir = soPriv
      ? (incHib
          ? '- incluir=true para privadas e híbridas; incluir=false para públicas.'
          : '- incluir=true somente para privadas; false para híbridas e públicas.')
      : '- incluir=true para todas.';

    const LOTE = 12;
    const nLotes = Math.ceil(base.length / LOTE);
    const saida = [];

    for(let i = 0; i < nLotes; i++){
      status(`Analisando aderência — lote ${i+1} de ${nLotes} (${base.length} empresas)…`);
      const chunk = base.slice(i*LOTE, (i+1)*LOTE);

      const lista = chunk.map((e,j) =>
        `${j}|${e.empresa}|seg:${e.segmento||"?"}|fat:${e.faturamento||"?"}|func:${e.funcionarios||"?"}`
      ).join("\n");

      const prompt = `Você é analista de prospecção B2B.

PATROCINADOR (quem vai oferecer o jantar): ${nome}
Perfil: ${perfil}
${perfilDesejado ? "Perfil de convidado desejado: " + perfilDesejado : ""}
${fatMin ? "Faturamento mínimo desejado: " + fatMin : ""}
${obs ? "Observações do organizador: " + obs : ""}

REGRAS DE CLASSIFICAÇÃO:
- natureza "privada": empresa privada comum.
- natureza "hibrida": Sistema S (SENAI/SESI/SESC/SEBRAE/SEST SENAT), serviços sociais autônomos, fundações/associações privadas ligadas a estatais (ex.: fundos de pensão, autogestões de saúde), capital misto.
- natureza "publica": órgãos de governo, autarquias, tribunais, ministérios, forças armadas, estatais puras, organismos internacionais.
${regraIncluir}
- score 0-100 = aderência comercial entre a empresa e o que o patrocinador vende (porte, segmento, maturidade provável).

EMPRESAS (indice|nome|dados):
${lista}

Responda APENAS um array JSON, sem markdown, um objeto por empresa:
[{"i":0,"natureza":"privada","incluir":true,"score":85,"just":"máx 15 palavras"}]`;

      let arr = [];
      try{
        arr = await ia(prompt, { json: true, maxTokens: 2000 }) || [];
      }catch(e){ arr = []; }

      chunk.forEach((e,j) => {
        const m = (Array.isArray(arr) ? arr : []).find(x => x.i === j) || {};
        saida.push({
          ...e,
          natureza: m.natureza || "privada",
          incluir: m.incluir !== false,
          score: Math.max(0, Math.min(100, Number(m.score) || 50)),
          just: m.just || "",
          manter: m.incluir !== false,
          sem_analise: !m.natureza
        });
      });
    }

    saida.sort((a,b) => b.score - a.score);

    // limite conta ASSENTOS, não empresas: com 2 executivos, uma
    // empresa ocupa duas vagas do jantar
    const cap = parseInt($("#pr-max").value, 10);
    if(cap > 0){
      let vagas = 0;
      for(const r of saida){
        if(!r.incluir){ r.manter = false; continue; }
        const assentos = PROSP_EXECS === "2" ? (r.exec2_nome ? 2 : 1) : 1;
        if(vagas + assentos <= cap){ r.manter = true; vagas += assentos; }
        else r.manter = false;
      }
    }

    PROSP = saida;
    $("#pr-status").innerHTML = "";
    desenharProspeccao();
  }catch(e){
    $("#pr-status").innerHTML = "";
    aviso("#pr-aviso", explicar(e));
  }finally{
    btn.disabled = false;
  }
}

const assentosDe = r => PROSP_EXECS === "2" ? (r.exec2_nome ? 2 : 1) : 1;

function desenharProspeccao(){
  const box = $("#pr-resultado");
  const dentro = PROSP.filter(r => r.manter && r.incluir);
  const nConvidados = dentro.reduce((n,r) => n + assentosDe(r), 0);
  const semAnalise = PROSP.filter(r => r.sem_analise).length;

  box.innerHTML = `
    <div class="cartao">
      <div class="cartao-cab" style="margin-bottom:10px;">
        <div>
          <h2 style="margin:0;">${dentro.length} empresa(s) · ${nConvidados} convidado(s)</h2>
          <p class="meta">de ${PROSP.length} analisada(s)${semAnalise ? ` · ${semAnalise} sem pontuação (revise)` : ""}</p>
        </div>
        <div style="white-space:nowrap;">
          <button class="btn sec mini" id="pr-x-completa">Análise completa</button>
          <button class="btn sec mini" id="pr-x-validacao">Validação</button>
          <button class="btn sec mini" id="pr-x-sympla">Convites Sympla</button>
          <button class="btn sec mini" id="pr-copiar">Copiar e-mails</button>
        </div>
      </div>
      <div class="rolagem" style="max-height:460px;">
        <table>
          <tr><th></th><th>Empresa</th><th>Executivos</th><th>Porte</th>
              <th>Natureza</th><th>Aderência</th><th>Por quê</th></tr>
          ${PROSP.map((r,i) => `<tr data-i="${i}" ${r.incluir ? "" : 'style="opacity:.5"'}>
            <td><input type="checkbox" class="pr-pick" ${r.manter ? "checked" : ""}></td>
            <td><strong>${esc(r.empresa)}</strong>
                <br><span class="meta">${esc(r.segmento||"—")}${r.cidade ? " · "+esc(r.cidade) : ""}${r.estado ? "/"+esc(r.estado) : ""}</span>
                ${r.ja_convidado_em ? `<br><span class="selo alerta">já foi em ${esc(r.ja_convidado_em)}</span>` : ""}</td>
            <td>${esc(r.exec1_nome||"—")}<br><span class="meta">${esc(r.exec1_cargo||"")}</span>
                ${r.exec2_nome ? `<br>${PROSP_EXECS === "2"
                    ? `${esc(r.exec2_nome)}<br><span class="meta">${esc(r.exec2_cargo||"")}</span>`
                    : `<span class="meta">2ª opção: ${esc(r.exec2_nome)}</span>`}` : ""}</td>
            <td class="meta">${esc(r.faturamento||"—")}${r.funcionarios ? `<br>${esc(r.funcionarios)} func.` : ""}</td>
            <td><span class="selo ${r.natureza==="publica"?"erro":r.natureza==="hibrida"?"alerta":"pend"}">${esc(r.natureza)}</span></td>
            <td><span class="selo ${r.score>=70?"ok":r.score>=50?"alerta":"pend"}">${r.score}%</span></td>
            <td class="meta">${esc(r.just||"—")}</td>
          </tr>`).join("")}
        </table>
      </div>
      <div style="margin-top:12px;">
        <button class="btn" id="pr-salvar">Salvar seleção</button>
        <span class="meta" id="pr-conta" style="margin-left:10px;"></span>
      </div>
      <div id="pr-aviso2"></div>
    </div>`;

  const sincronizar = () => {
    $$(".pr-pick").forEach((c,i) => PROSP[i].manter = c.checked);
    const sel = PROSP.filter(r => r.manter);
    const n = sel.reduce((s,r) => s + assentosDe(r), 0);
    $("#pr-conta").textContent = `${sel.length} empresa(s) · ${n} convidado(s)`;
  };
  $$(".pr-pick").forEach(c => c.addEventListener("change", sincronizar));
  sincronizar();

  const sel = () => PROSP.filter(r => r.manter);
  const arq = s => `Jantar_${PROSP_PATRO.replace(/\W+/g,"_")}_${s}.xlsx`;

  $("#pr-x-completa").addEventListener("click", () => exportar(
    sel().map((r,i) => ({
      n: i+1,
      exec1: r.exec1_nome || "—", cargo1: r.exec1_cargo || "—",
      exec2: r.exec2_nome || "—", cargo2: r.exec2_cargo || "—",
      empresa: r.empresa, segmento: r.segmento,
      natureza: r.natureza, score: r.score + "%", just: r.just
    })),
    [["n","#"],["exec1","Executivo Principal"],["cargo1","Cargo"],
     ["exec2","2ª Opção"],["cargo2","Cargo (2ª Opção)"],
     ["empresa","Empresa"],["segmento","Segmento"],["natureza","Natureza"],
     ["score","% Aderência"],["just","Justificativa"]],
    arq("Analise_Completa"), "Lista"));

  $("#pr-x-validacao").addEventListener("click", () => exportar(
    sel().map((r,i) => ({
      n: i+1, empresa: r.empresa, segmento: r.segmento,
      cidade: r.cidade || "—", estado: r.estado || "—", score: r.score + "%"
    })),
    [["n","#"],["empresa","Empresa"],["segmento","Segmento"],
     ["cidade","Cidade"],["estado","Estado"],["score","% Aderência"]],
    arq("Validacao"), "Lista"));

  $("#pr-x-sympla").addEventListener("click", () => {
    // uma linha POR EXECUTIVO, não por empresa: é o formato que o
    // Sympla importa
    const linhas = [];
    sel().forEach(r => {
      const execs = PROSP_EXECS === "2"
        ? [[r.exec1_nome, r.exec1_cargo, r.exec1_email, r.exec1_telefone],
           [r.exec2_nome, r.exec2_cargo, r.exec2_email, r.exec2_telefone]]
        : [[r.exec1_nome, r.exec1_cargo, r.exec1_email, r.exec1_telefone]];

      execs.forEach(([n,c,em,t]) => {
        if(!n) return;
        const partes = String(n).split(/\s+/);
        linhas.push({
          nome: partes[0] || "", sobrenome: partes.slice(1).join(" "),
          email: em || "", telefone: t || "", empresa: r.empresa, cargo: c || ""
        });
      });
    });

    exportar(linhas, [["nome","Nome"],["sobrenome","Sobrenome"],["email","E-mail"],
      ["telefone","Telefone"],["empresa","Empresa"],["cargo","Cargo"]],
      arq("Convites_Sympla"), "Convites");

    const semEmail = linhas.filter(l => !l.email).length;
    if(semEmail) aviso("#pr-aviso2",
      `${semEmail} convidado(s) sem e-mail na base — complete antes de importar no Sympla.`);
  });

  $("#pr-copiar").addEventListener("click", async () => {
    const emails = [];
    sel().forEach(r => {
      emails.push(r.exec1_email);
      if(PROSP_EXECS === "2") emails.push(r.exec2_email);
    });
    const unicos = [...new Set(emails.map(e => (e||"").trim()).filter(Boolean))];

    if(!unicos.length){ aviso("#pr-aviso2","Nenhum e-mail na base para os selecionados."); return; }
    const texto = unicos.join(";");
    try{
      await navigator.clipboard.writeText(texto);
      const total = sel().reduce((s,r) => s + assentosDe(r), 0);
      aviso("#pr-aviso2",
        `${unicos.length} e-mail(s) copiados no formato Sympla` +
        (total > unicos.length ? ` — ${total - unicos.length} sem e-mail na base` : "") +
        ". Cole em Divulgue → Convite por e-mail.", "ok");
    }catch{
      window.prompt("Copie a lista de e-mails:", texto);
    }
  });

  $("#pr-salvar").addEventListener("click", async () => {
    const b = $("#pr-salvar");
    b.disabled = true; b.textContent = "Salvando…";
    try{
      const r = await rpc("admin_salvar_prospeccao", {
        p_evento_slug: EVENTO,
        p_sessao_id: $("#pr-sessao").value || null,
        p_itens: PROSP.map(x => ({
          gestor_id: x.exec1_id, empresa: x.empresa, score: x.score,
          natureza: x.natureza, justificativa: x.just, aprovado: !!x.manter
        }))
      });
      aviso("#pr-aviso2",
        `${r.salvos} registro(s) salvos. Esta rodada passa a aparecer na lista de "não repetir".`,
        "ok");
    }catch(e){ aviso("#pr-aviso2", explicar(e)); }
    finally{ b.disabled = false; b.textContent = "Salvar seleção"; }
  });
}

  listarPrecos();
};

// Aceita "1.234,56" e "1234.56": a pessoa digita como está acostumada.
function lerValor(txt){
  const t = String(txt||"").trim().replace(/[^\d.,-]/g,"");
  if(!t) return NaN;
  const v = t.includes(",") ? t.replace(/\./g,"").replace(",",".") : t;
  return Number(v);
}

async function listarPrecos(){
  try{
    const l = await rpc("admin_listar_precos", { p_evento_slug: EVENTO });
    $("#pr-lista").innerHTML = l.length === 0
      ? `<div class="vazio">Nenhum preço cadastrado. Adicione acima.</div>`
      : `<table>
          <tr><th>Item</th><th>Descrição / faixa</th><th>Valor</th><th></th></tr>
          ${l.map(p => `<tr data-id="${esc(p.id)}" data-item="${esc(p.item)}"
                            data-desc="${esc(p.descricao||"")}" data-valor="${p.valor}"
                            data-imin="${p.idade_min ?? ""}" data-imax="${p.idade_max ?? ""}">
            <td class="meta">${esc(p.item)}
              ${ITENS_FIXOS.includes(p.item) ? `<br><span class="selo pend">usado na fatura</span>` : ""}</td>
            <td>${esc(p.descricao||"—")}
              ${p.faixa ? `<br><span class="selo alerta">${esc(p.faixa.trim())}</span>` : ""}</td>
            <td><strong>${moeda(p.valor)}</strong></td>
            <td style="white-space:nowrap;">
              <button class="btn sec mini editar">Editar</button>
              <button class="btn perigo mini apagar">Remover</button>
            </td></tr>`).join("")}</table>`;

    $$("#pr-lista .editar").forEach(b => b.addEventListener("click", () => {
      const tr = b.closest("tr");
      $("#pr-item").value  = tr.dataset.item;
      $("#pr-desc").value  = tr.dataset.desc;
      $("#pr-imin").value  = tr.dataset.imin;
      $("#pr-imax").value  = tr.dataset.imax;
      $("#pr-valor").value = String(tr.dataset.valor).replace(".",",");
      $("#pr-item").focus();
      window.scrollTo({ top:0, behavior:"smooth" });
    }));

    $$("#pr-lista .apagar").forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      if(!confirm(`Remover o preço "${tr.dataset.item}"?`)) return;
      b.disabled = true;
      try{
        await rpc("admin_remover_preco", { p_preco_id: tr.dataset.id });
        listarPrecos();
      }catch(e){ aviso("#aviso-global", explicar(e)); b.disabled = false; }
    }));
  }catch(e){ aviso("#pr-lista", explicar(e)); }
}

async function salvarPreco(){
  const item  = $("#pr-item").value.trim();
  const valor = lerValor($("#pr-valor").value);

  if(!item){ aviso("#pr-aviso","Informe o item."); return; }
  if(Number.isNaN(valor)){ aviso("#pr-aviso","Informe um valor numérico."); return; }
  if(valor < 0){ aviso("#pr-aviso","O valor não pode ser negativo."); return; }

  const idade = s => {
    const v = $(s).value.trim();
    if(v === "") return null;
    const n = parseInt(v, 10);
    return Number.isNaN(n) ? undefined : n;
  };
  const imin = idade("#pr-imin"), imax = idade("#pr-imax");

  if(imin === undefined || imax === undefined){
    aviso("#pr-aviso","Idade precisa ser um número, ou em branco."); return;
  }
  if(imin !== null && imax !== null && imax < imin){
    aviso("#pr-aviso","A idade final é menor que a inicial."); return;
  }

  const btn = $("#pr-salvar");
  btn.disabled = true; btn.textContent = "Salvando…";
  try{
    const r = await rpc("admin_salvar_preco", {
      p_evento_slug: EVENTO, p_item: item, p_valor: valor,
      p_descricao: $("#pr-desc").value.trim() || null,
      p_idade_min: imin, p_idade_max: imax
    });
    aviso("#pr-aviso",
      `Preço de "${r.item}"${r.faixa || ""} salvo em ${moeda(valor)}.`, "ok");
    ["#pr-item","#pr-desc","#pr-valor","#pr-imin","#pr-imax"]
      .forEach(s => $(s).value = "");
    listarPrecos();
  }catch(e){ aviso("#pr-aviso", explicar(e)); }
  finally{ btn.disabled = false; btn.textContent = "Salvar preço"; }
}

async function listarEquipe(){
  try{
    const l = await rpc("admin_listar_equipe");
    const { data:{ user } } = await sb.auth.getUser();
    const meu = (user?.email || "").toLowerCase();

    $("#eq-lista").innerHTML = `<table>
      <tr><th>E-mail</th><th>Nome</th><th>Perfil</th><th>Desde</th><th></th></tr>
      ${l.map(m => {
        const souEu = m.email.toLowerCase() === meu;
        return `<tr data-id="${esc(m.id)}" data-email="${esc(m.email)}"
                    data-nome="${esc(m.nome||"")}" data-role="${esc(m.role)}">
          <td>${esc(m.email)} ${souEu ? `<span class="selo ok">você</span>` : ""}</td>
          <td>${esc(m.nome||"—")}</td>
          <td><span class="selo ${m.role==="admin"?"alerta":"pend"}">${esc(m.role)}</span></td>
          <td class="meta">${dataBR(m.created_at)}</td>
          <td style="white-space:nowrap;">
            <button class="btn sec mini editar">Editar</button>
            ${souEu ? "" : `<button class="btn perigo mini apagar">Remover</button>`}
          </td></tr>`;
      }).join("")}</table>`;

    $$("#eq-lista .editar").forEach(b => b.addEventListener("click", () => {
      const tr = b.closest("tr");
      $("#eq-email").value = tr.dataset.email;
      $("#eq-nome").value  = tr.dataset.nome;
      $("#eq-role").value  = tr.dataset.role;
      $("#eq-email").focus();
      window.scrollTo({ top:0, behavior:"smooth" });
    }));

    $$("#eq-lista .apagar").forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      if(!confirm(`Remover o acesso de ${tr.dataset.email}?`)) return;
      b.disabled = true;
      try{
        await rpc("admin_remover_membro", { p_id: tr.dataset.id });
        listarEquipe();
      }catch(e){ aviso("#aviso-global", explicar(e)); b.disabled = false; }
    }));
  }catch(e){ aviso("#eq-lista", explicar(e)); }
}

async function salvarMembro(){
  const email = $("#eq-email").value.trim();
  if(!email){ aviso("#eq-aviso","Informe o e-mail."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    aviso("#eq-aviso","E-mail inválido. Um endereço errado aqui vira acesso que nunca funciona.");
    return;
  }

  const btn = $("#eq-salvar");
  btn.disabled = true; btn.textContent = "Salvando…";
  try{
    await rpc("admin_salvar_membro", {
      p_email: email,
      p_nome:  $("#eq-nome").value.trim() || null,
      p_role:  $("#eq-role").value
    });
    aviso("#eq-aviso", `Acesso de ${email} salvo.`, "ok");
    ["#eq-email","#eq-nome"].forEach(s => $(s).value = "");
    listarEquipe();
  }catch(e){ aviso("#eq-aviso", explicar(e)); }
  finally{ btn.disabled = false; btn.textContent = "Salvar"; }
}

          <button class="btn sec mini" id="x-det">Exportar Excel</button>
