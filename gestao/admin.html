// ABA: ATIVIDADES (presenca) — exclusivo do evento grande. Fica
// desligado por padrao (eventos.usa_atividades); jantar e eventos
// menores nao usam isso, e a tela nem mostra a opcao de ligar sem
// entrar aqui e pedir.
// =====================================================================
ABAS.atividades = async function(){
  const c = $("#conteudo");
  c.innerHTML = DS.skeletonCartoes(2);

  let ligado = false;
  try{
    const evs = await rpc("admin_listar_eventos");
    ligado = !!(evs.find(e => e.slug === EVENTO)?.usa_atividades);
  }catch(e){ aviso(c, explicar(e)); return; }

  if(!ligado){
    c.innerHTML = `
      <h1>Atividades</h1>
      <div class="cartao">
        <p>Este evento não usa controle de presença por atividade — é o caso da
           maioria dos eventos. Ligue só se for acompanhar quem passou em cada
           atividade do dia (workshop, palestra, mesa redonda com lista própria).</p>
        <button class="btn" id="at-ligar">Ligar atividades para este evento</button>
      </div>`;
    $("#at-ligar").addEventListener("click", async () => {
      try{
        await rpc("admin_definir_usa_atividades", { p_evento_slug: EVENTO, p_ligado: true });
        ABAS.atividades();
      }catch(e){ aviso(c, explicar(e)); }
    });
    return;
  }

  c.innerHTML = `
    <h1>Atividades</h1>
    <p class="sub">Uma atividade por linha do dia. Cada uma tem sua própria lista de presença.</p>

    <div class="cartao">
      <h2 style="margin-top:0;">Nova atividade</h2>
      <div class="linha">
        <div><label>Nome</label><input type="text" id="at-nome" placeholder="Workshop de IA"></div>
        <div style="max-width:160px;"><label>Data</label><input type="date" id="at-data"></div>
      </div>
      <div class="linha">
        <div style="max-width:140px;"><label>Início</label><input type="time" id="at-inicio"></div>
        <div style="max-width:140px;"><label>Fim</label><input type="time" id="at-fim"></div>
        <div><label>Local</label><input type="text" id="at-local" placeholder="Salão A"></div>
        <div style="max-width:170px;"><label>Presença</label>
          <select id="at-tipo">
            <option value="geral">Geral (todos)</option>
            <option value="exclusiva">Exclusiva (lista fechada)</option>
          </select></div>
      </div>
      <div id="at-aviso"></div>
      <button class="btn" id="at-salvar" style="margin-top:8px;">Adicionar</button>
      <button class="btn sec" id="at-desligar" style="margin-top:8px;margin-left:6px;">
        Desligar atividades deste evento</button>
    </div>

    <div id="at-lista"></div>
    <div id="at-presenca"></div>`;

  const carregarLista = async () => {
    $("#at-lista").innerHTML = DS.skeletonLinhas(2);
    try{
      const lista = await rpc("admin_listar_atividades", { p_evento_slug: EVENTO });
      $("#at-lista").innerHTML = lista.length ? `
        <div class="cartao"><div class="rolagem"><table>
          <tr><th>Atividade</th><th>Quando</th><th>Local</th><th>Tipo</th><th>Presença</th><th></th></tr>
          ${lista.map(a => `<tr data-id="${esc(a.id)}" data-nome="${esc(a.nome)}">
            <td><strong>${esc(a.nome)}</strong></td>
            <td class="meta">${a.data ? dataBR(a.data) : "—"}
                ${a.horario_inicio ? ` · ${a.horario_inicio.slice(0,5)}${a.horario_fim ? "–"+a.horario_fim.slice(0,5) : ""}` : ""}</td>
            <td class="meta">${esc(a.local||"—")}</td>
            <td>${a.tipo_presenca === "exclusiva"
                  ? `<span class="selo alerta">Exclusiva</span>` : `<span class="meta">Geral</span>`}</td>
            <td><span class="selo ${Number(a.presentes) ? "ok" : "pend"}">${a.presentes} / ${a.esperados}</span></td>
            <td style="white-space:nowrap;">
              ${a.tipo_presenca === "exclusiva"
                ? `<button class="btn sec mini at-convidados">Convidados</button>` : ""}
              <button class="btn sec mini at-presenca">Presença</button>
              <a class="btn sec mini" href="checkin.html?atividade=${esc(a.id)}" target="_blank" rel="noopener"
                 style="text-decoration:none;display:inline-block;">Abrir check-in</a>
              <button class="btn perigo mini at-remover">Remover</button>
            </td>
          </tr>`).join("")}
        </table></div></div>`
        : `<div class="cartao"><p class="meta" style="margin:0;">Nenhuma atividade cadastrada ainda.</p></div>`;

      $$(".at-presenca").forEach(b => b.addEventListener("click", () => {
        const tr = b.closest("tr");
        abrirPresenca(tr.dataset.id, tr.dataset.nome);

      $$(".at-convidados").forEach(b => b.addEventListener("click", () => {
        const tr = b.closest("tr");
        abrirConvidadosAtividade(tr.dataset.id, tr.dataset.nome);
      }));
      $$(".at-remover").forEach(b => b.addEventListener("click", async () => {
        const tr = b.closest("tr");
        if(!(await DS.confirmar(`Remove também o histórico de presença dela.`,
            {titulo:`Remover "${tr.dataset.nome}"?`, tom:"perigo", textoConfirmar:"Remover"}))) return;
        try{ await rpc("admin_remover_atividade", { p_atividade_id: tr.dataset.id }); carregarLista(); }
        catch(e){ aviso("#at-aviso", explicar(e)); }
      }));
    }catch(e){ aviso("#at-lista", explicar(e)); }
  };

  $("#at-salvar").addEventListener("click", async () => {

      await rpc("admin_salvar_atividade", {
        p_id: null, p_evento_slug: EVENTO, p_nome: nome,
        p_data: $("#at-data").value || null,
        p_horario_inicio: $("#at-inicio").value || null,
        p_horario_fim: $("#at-fim").value || null,
        p_local: $("#at-local").value.trim() || null,
        p_tipo_presenca: $("#at-tipo").value
      });
      ["#at-nome","#at-data","#at-inicio","#at-fim","#at-local"].forEach(s => $(s).value = "");
      $("#at-tipo").value = "geral";
      aviso("#at-aviso", "");
      carregarLista();
    }catch(e){ aviso("#at-aviso", explicar(e)); }
    finally{ btn.disabled = false; btn.textContent = "Adicionar"; }
  });

  $("#at-desligar").addEventListener("click", async () => {
    if(!(await DS.confirmar(
        "As atividades cadastradas e o histórico de presença continuam salvos — só a aba fica inativa pra este evento.",
        {titulo:"Desligar atividades deste evento?"}))) return;
    try{
      await rpc("admin_definir_usa_atividades", { p_evento_slug: EVENTO, p_ligado: false });
      ABAS.atividades();
    }catch(e){ aviso("#at-aviso", explicar(e)); }
  });

    const box = $("#at-presenca");
    box.innerHTML = DS.skeletonLinhas(3);
    box.scrollIntoView({ behavior: "smooth", block: "start" });

    const desenhar = async () => {
      try{
        const lista = await rpc("atividade_checkin_listar", {
          p_atividade_id: atividadeId,

          p_limite: 300

          ${lista.map(p => `<tr data-key="${esc(p.pessoa_key)}" data-checkin="${esc(p.checkin_id||"")}">
            <td>${esc(p.nome)}</td>
            <td class="meta">${esc(p.empresa||"—")}</td>
            <td>${p.checkin_id
                 ? `<span class="selo ok">Presente</span> <span class="meta">${dataBR(p.registrado_em)}</span>`
                 : `<span class="selo pend">Pendente</span>`}</td>
            <td>${p.checkin_id
                 ? `<button class="btn sec mini pr-desfazer">Desfazer</button>`
                 : `<button class="btn mini pr-marcar">Marcar presença</button>`}</td>
          </tr>`).join("")}`
          : `<tr><td colspan="4" style="color:var(--suave)">Nada com esse filtro.</td></tr>`;

        $$(".pr-marcar").forEach(b => b.addEventListener("click", async () => {
          const tr = b.closest("tr");
          b.disabled = true;
          try{ await rpc("atividade_checkin_registrar", { p_atividade_id: atividadeId, p_pessoa_key: tr.dataset.key }); desenhar(); }
          catch(e){ DS.avisar(explicar(e), {tom:"erro"}); b.disabled = false; }
        }));
        $$(".pr-desfazer").forEach(b => b.addEventListener("click", async () => {
          const tr = b.closest("tr");
          b.disabled = true;
          try{ await rpc("checkin_desfazer", { p_checkin_id: tr.dataset.checkin }); desenhar(); }
          catch(e){ DS.avisar(explicar(e), {tom:"erro"}); b.disabled = false; }
        }));
      }catch(e){ aviso("#pr-tabela", explicar(e)); }
    };

    box.innerHTML = `
      <div class="cartao">
        <h2 style="margin-top:0;">Presença — ${esc(nome)}</h2>
        <div class="barra">
          <div><label>Buscar</label><input type="text" id="pr-busca" placeholder="Nome ou empresa"></div>
          <div style="min-width:auto;align-self:flex-end;">
            <label style="display:flex;align-items:center;gap:6px;font-weight:normal;">
              <input type="checkbox" id="pr-pendentes"> Só pendentes</label></div>
          <div style="min-width:auto;align-self:flex-end;">
            <button class="btn" id="pr-ler-qr">Ler QR do crachá</button></div>
        </div>
        <div class="rolagem"><table id="pr-tabela"><tr><td>${DS.skeletonLinhas(2)}</td></tr></table></div>
      </div>`;

    $("#pr-busca").addEventListener("input", () => { clearTimeout(window._prTimer); window._prTimer = setTimeout(desenhar, 300); });
    $("#pr-pendentes").addEventListener("change", desenhar);
    $("#pr-ler-qr").addEventListener("click", () => {
      DS.lerQR(async (pessoaKey) => {
        try{
          const r = await rpc("atividade_checkin_registrar", { p_atividade_id: atividadeId, p_pessoa_key: pessoaKey });
          DS.avisar(r.ja_estava ? `${r.nome} já estava presente.` : `${r.nome} — presença marcada.`, {tom:"ok"});
          desenhar();
        }catch(e){ DS.avisar(explicar(e), {tom:"erro"}); }
      });
    });

    desenhar();
  };

  const abrirConvidadosAtividade = async (atividadeId, nome) => {
    const box = $("#at-presenca");
    box.innerHTML = DS.skeletonLinhas(3);
    box.scrollIntoView({ behavior: "smooth", block: "start" });

    try{
      const todos = await rpc("admin_listar_convidados_atividade", { p_atividade_id: atividadeId });

      box.innerHTML = `
        <div class="cartao">
          <h2 style="margin-top:0;">Convidados — ${esc(nome)}</h2>
          <p class="sub">Marque quem participa desta atividade fechada. Só quem estiver marcado aparece no check-in.</p>
          <div class="rolagem" style="max-height:300px;">
            <table>
              <tr><th></th><th>Nome</th><th>Empresa</th></tr>
              ${todos.map(p => `<tr>
                <td><input type="checkbox" class="ac-pick" value="${esc(p.participante_id)}" ${p.marcado ? "checked" : ""}></td>
                <td>${esc(p.nome)}</td>
                <td class="meta">${esc(p.empresa||"—")}</td>
              </tr>`).join("") ||
              `<tr><td colspan="3" style="color:var(--suave)">Nenhum participante aprovado ainda neste evento.</td></tr>`}

          </div>
          <div id="ac-aviso"></div>
          <button class="btn" id="ac-salvar" style="margin-top:10px;">Salvar convidados</button>
        </div>`;

      $("#ac-salvar").addEventListener("click", async () => {
        const b = $("#ac-salvar");
        const ids = $$(".ac-pick:checked", box).map(c => c.value);
        b.disabled = true; b.textContent = "Salvando…";
        try{
          const r = await rpc("admin_definir_convidados_atividade", {
            p_atividade_id: atividadeId, p_participantes: ids });
          aviso("#ac-aviso",
            `${r.na_lista} na lista` + (r.removidos ? ` · ${r.removidos} removido(s)` : ""), "ok");
          carregarLista();
        }catch(e){ aviso("#ac-aviso", explicar(e)); }
        finally{ b.disabled = false; b.textContent = "Salvar convidados"; }
      });
    }catch(e){ aviso(box, explicar(e)); }
  };

  carregarLista();
};

// Puxa todas as paginas: o Data API corta em 1000 linhas por resposta.
async function puxarTudo(fn, extras={}, passo=500){
  let todos = [], offset = 0, total = null;
  while(total === null || offset < total){
    const p = await rpc(fn, { p_evento_slug: EVENTO, p_limite: passo, p_offset: offset, ...extras });
    if(p.length === 0) break;
    if(total === null) total = Number(p[0].total_geral);
    todos = todos.concat(p);
    offset += passo;
    if(todos.length >= total) break;
  }
  return todos;
}

// ABA: FINANCEIRO
//
// A fatura é recalculada do zero a cada save do rooming, mas só
// enquanto está "estimada". Emitir é o ato que congela o valor: daí em
// diante o portal pode mexer no quarto que a conta não muda mais.
// Por isso o botão de recalcular avisa que só pega as estimadas.
// =====================================================================
const ROTULO_FAT = {
  estimada:"Estimada", emitida:"Emitida", paga:"Paga", cancelada:"Cancelada"
};
const SELO_FAT = {
  estimada:"pend", emitida:"alerta", paga:"ok", cancelada:"erro"
};

ABAS.financeiro = async function(){
  const c = $("#conteudo");
  c.innerHTML = DS.skeletonCartoes(3);

  try{
    const r = await rpc("admin_financeiro_resumo", { p_evento_slug: EVENTO });

    c.innerHTML = `
      <h1>Financeiro</h1>
      <p class="sub">
        Valores adicionais de familiar, criança, transfer e quarto extra.
        A cota do patrocinador não entra aqui — ela é do contrato.
      </p>

      <div class="cartao">
        <p class="meta" style="margin:0;">
          <strong style="font-size:15px;color:var(--verde);">${moeda(r.em_aberto)}</strong>
          em aberto em ${r.qtd_aberto} fatura(s) ·
          ${moeda(r.recebido)} recebido em ${r.qtd_pago} ·
          total lançado ${moeda(r.total)}
          ${Number(r.vencidas) ? ` · <span class="selo erro">${r.vencidas} vencida(s)</span>` : ""}
        </p>
      </div>

      <div class="barra">
        <div><label>Status</label>
          <select id="fi-status">
            <option value="">Todas</option>
            <option value="estimada">Estimada</option>
            <option value="emitida">Emitida</option>
            <option value="paga">Paga</option>
            <option value="cancelada">Cancelada</option>
          </select></div>
        <div><label>Buscar</label>
          <input type="text" id="fi-busca" placeholder="Nome ou empresa"></div>
        <div style="min-width:auto;">
          <button class="btn sec" id="fi-recalcular">Recalcular estimadas</button></div>
        <div style="min-width:auto;">
          <button class="btn sec" id="fi-exportar">Exportar Excel</button></div>
      </div>

      <div id="fi-aviso"></div>
      <div class="cartao"><div class="rolagem"><table id="fi-tabela"></table></div></div>
      <div id="fi-detalhe"></div>`;

    let FAT = [];

    const desenhar = () => {
      const busca = $("#fi-busca").value.toLowerCase();
      const vis = FAT.filter(f =>
        !busca || `${f.nome} ${f.empresa||""}`.toLowerCase().includes(busca));

      $("#fi-tabela").innerHTML = `
        <tr><th>Quem</th><th>Tipo</th><th>Itens</th><th>Valor</th>
            <th>Status</th><th>Vencimento</th><th></th></tr>
        ${vis.map(f => `<tr data-id="${esc(f.id)}" data-nome="${esc(f.nome)}"
                            data-status="${esc(f.status)}"
                            data-vencimento="${esc(f.vencimento||"")}"
                            data-forma="${esc(f.forma_pagamento||"")}"
                            data-obs="${esc(f.observacao||"")}">
          <td><strong>${esc(f.nome)}</strong>
              ${f.empresa && f.empresa !== f.nome
                ? `<br><span class="meta">${esc(f.empresa)}</span>` : ""}
              ${f.email ? `<br><span class="meta">${esc(f.email)}</span>` : ""}</td>
          <td class="meta">${f.tipo === "patrocinador" ? "Patrocinador" : "Participante"}</td>
          <td class="meta" style="max-width:260px;">${esc(f.itens || "—")}</td>
          <td><strong>${moeda(f.total)}</strong></td>
          <td><span class="selo ${SELO_FAT[f.status]||"pend"}">${esc(ROTULO_FAT[f.status]||f.status)}</span>
              ${f.paga_em ? `<br><span class="meta">${dataBR(f.paga_em)}</span>` : ""}</td>
          <td class="meta">${f.vencimento ? dataBR(f.vencimento) : "—"}</td>
          <td style="white-space:nowrap;">
            <button class="btn sec mini fi-ver">Itens</button>
            <button class="btn sec mini fi-marcar">Alterar</button>
          </td></tr>`).join("") ||
        `<tr><td colspan="7" style="color:var(--suave)">Nenhuma fatura com esse filtro.</td></tr>`}`;

      $$("#fi-tabela .fi-ver").forEach(b =>
        b.addEventListener("click", () => verItens(b.closest("tr"))));
      $$("#fi-tabela .fi-marcar").forEach(b =>
        b.addEventListener("click", () => abrirMarcar(b.closest("tr"))));
    };

    const carregar = async () => {
      $("#fi-tabela").innerHTML = `<tr><td colspan="99">${DS.skeletonLinhas(2)}</td></tr>`;
      try{
        // pagina de verdade: uma edição com 130 CIOs e 61 patrocinadores
        // passa folgado do teto de 1000 linhas do Data API
        FAT = await puxarTudo("admin_listar_faturas",
          { p_status: $("#fi-status").value || null });
        desenhar();
      }catch(e){ aviso("#fi-tabela", explicar(e)); }
    };

    $("#fi-status").addEventListener("change", carregar);
    $("#fi-busca").addEventListener("input", desenhar);

    $("#fi-exportar").addEventListener("click", () => exportar(FAT, [
      ["tipo","Tipo"],["nome","Nome"],["empresa","Empresa"],["email","E-mail"],
      ["itens","Itens"],["total","Valor"],["status","Status"],
      ["vencimento","Vencimento"],["forma_pagamento","Forma de pagamento"],
      ["observacao","Observação"]
    ], "financeiro-cio-cerrado.xlsx", "Faturas"));

    $("#fi-recalcular").addEventListener("click", async () => {
      if(!(await DS.confirmar(
          "Todas as faturas ainda estimadas deste evento serão recalculadas. As já emitidas, pagas ou canceladas não são tocadas.",
          {titulo:"Recalcular faturas do evento?", tom:"perigo", textoConfirmar:"Recalcular"}))) return;
      const b = $("#fi-recalcular");
      b.disabled = true; b.textContent = "Recalculando…";
      try{
        const x = await rpc("admin_recalcular_faturas", { p_evento_slug: EVENTO });
        aviso("#fi-aviso",
          `${x.participantes} participante(s) e ${x.patrocinadores} patrocinador(es) ` +
          `recalculados · total ${moeda(x.total)}.`, "ok");
        ABAS.financeiro();
      }catch(e){
        aviso("#fi-aviso", explicar(e));
        b.disabled = false; b.textContent = "Recalcular estimadas";
      }
    });

    await carregar();
  }catch(e){ aviso(c, explicar(e)); }
};

async function verItens(tr){
  const box = $("#fi-detalhe");
  box.innerHTML = DS.skeletonCartoes(3);
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });
  try{
    const l = await rpc("admin_fatura_itens", { p_fatura_id: tr.dataset.id });
    box.innerHTML = `
      <h2 style="margin-top:16px;">Itens · ${esc(tr.dataset.nome)}</h2>
      <div class="cartao">
        ${l.length ? `<table>
          <tr><th>Descrição</th><th>Qtd</th><th>Unitário</th><th>Total</th></tr>
          ${l.map(i => `<tr>
            <td>${esc(i.descricao)}</td>
            <td class="meta">${i.quantidade}</td>
            <td class="meta">${moeda(i.valor_unit)}</td>
            <td><strong>${moeda(i.valor_total)}</strong></td>
          </tr>`).join("")}
        </table>` : `<div class="vazio">
          Sem itens. A fatura fica em zero quando não há familiar,
          criança, transfer nem quarto extra.
        </div>`}
      </div>`;
  }catch(e){ aviso(box, explicar(e)); }
}

function abrirMarcar(tr){
  const box = $("#fi-detalhe");
  const atual = tr.dataset.status;
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });

  box.innerHTML = `
    <h2 style="margin-top:16px;">Alterar · ${esc(tr.dataset.nome)}</h2>
    <div class="cartao">
      <p class="sub" style="margin-bottom:12px;">
        Emitir congela o valor: a partir daí o recálculo automático deixa de
        mexer nesta fatura, mesmo que o rooming mude.
      </p>
      <div class="barra">
        <div style="max-width:170px;"><label>Status</label>
          <select id="fm-status">
            ${["estimada","emitida","paga","cancelada"].map(s =>
              `<option value="${s}" ${s===atual?"selected":""}>${ROTULO_FAT[s]}</option>`).join("")}
          </select></div>
        <div style="max-width:180px;"><label>Vencimento</label>
          <input type="date" id="fm-venc" value="${esc(tr.dataset.vencimento||"")}"></div>
        <div style="max-width:200px;"><label>Forma de pagamento</label>
          <input type="text" id="fm-forma" placeholder="Pix, boleto, transferência" value="${esc(tr.dataset.forma||"")}"></div>
      </div>
      <div class="barra">
        <div><label>Observação</label><input type="text" id="fm-obs" value="${esc(tr.dataset.obs||"")}"></div>
      </div>
      <div id="fm-aviso"></div>
      <button class="btn" id="fm-salvar">Salvar</button>
      <button class="btn sec" id="fm-cancelar" style="margin-left:6px;">Fechar</button>
    </div>`;

  $("#fm-cancelar").addEventListener("click", () => box.innerHTML = "");

  $("#fm-salvar").addEventListener("click", async () => {
    const b = $("#fm-salvar");
    const status = $("#fm-status").value;

    // a forma de pagamento só é gravada quando o status é "paga"; pedir
    // aqui evita a pessoa preencher e o valor sumir sem explicação
    if(status === "paga" && !$("#fm-forma").value.trim()){
      aviso("#fm-aviso","Informe a forma de pagamento para marcar como paga.");
      return;
    }

    // emitir é o ato que vira cobrança; sem vencimento a fatura não
    // entra em nenhum controle de atraso. O banco também recusa —
    // aqui é só para o aviso aparecer no formulário, e não como erro
    // vindo do servidor depois do clique.
    if(status === "emitida" && !$("#fm-venc").value && !tr.dataset.vencimento){
      aviso("#fm-aviso","Informe a data de vencimento para emitir a fatura.");
      $("#fm-venc").focus();
      return;
    }

    b.disabled = true; b.textContent = "Salvando…";
    try{
      const x = await rpc("admin_marcar_fatura", {
        p_fatura_id: tr.dataset.id,
        p_status: status,
        p_forma_pagamento: $("#fm-forma").value.trim() || null,
        p_observacao: $("#fm-obs").value.trim() || null,
        p_vencimento: $("#fm-venc").value || null
      });
      aviso("#aviso-global",
        `${tr.dataset.nome}: ${ROTULO_FAT[x.de]||x.de} → ${ROTULO_FAT[x.para]||x.para}.`, "ok");
      box.innerHTML = "";
      ABAS.financeiro();
    }catch(e){
      aviso("#fm-aviso", explicar(e));
      b.disabled = false; b.textContent = "Salvar";
    }
  });
}

      if($("#co-janela")) $("#co-janela").value = "";
      $("#co-escolhe").value = "1";

      catch(e){ aviso("#co-aviso", explicar(e)); b.disabled = false; }
    }));

    $$(".co-patro").forEach(b => b.addEventListener("click", () => {
      const tr = b.closest("tr");
      const existente = tr.nextElementSibling;
      if(existente && existente.classList.contains("cp-expandido")){
        existente.remove();
        return;
      }
      // so uma cota expandida por vez — evita a tabela crescer sem fim
      $$(".cp-expandido").forEach(e => e.remove());
      const linha = document.createElement("tr");
      linha.className = "cp-expandido";
      const td = document.createElement("td");
      td.colSpan = tr.children.length;
      linha.appendChild(td);
      tr.after(linha);
      patrocinadoresDaCota(td, tr.dataset.id, tr.dataset.nome);
    }));
  }catch(e){ aviso("#bl-cotas", explicar(e)); }
}

async function patrocinadoresDaCota(box, cotaId, cotaNome){

      <div class="rolagem" style="max-height:300px;">
        <table>
          <tr><th></th><th>Empresa</th><th>Cota atual</th></tr>
          ${todos.map(p => `<tr>
            <td><input type="checkbox" class="cp-pick" value="${esc(p.id)}"
                       ${p.cota === cotaNome ? "checked" : ""}></td>

      </div>`;

      const ids = $$(".cp-pick:checked", box).map(c => c.value);
      b.disabled = true; b.textContent = "Salvando…";
      try{
        const r = await rpc("admin_definir_patrocinadores_cota", {
          p_cota_id: cotaId, p_patrocinadores: ids });
        aviso("#cp-aviso",
          `${r.na_cota} na cota` + (r.removidos ? ` · ${r.removidos} removido(s)` : ""), "ok");

async function salvarCota(){
  const nome  = $("#co-nome").value.trim();
  if(!nome){
    DS.marcarInvalido($("#co-nome"), "Informe o nome da cota.");
    $("#co-nome").focus();
    return;
  }
  DS.limparInvalido($("#co-nome"));

  const ordem = COTA_UNICA ? 1 : parseInt($("#co-ordem")?.value, 10);
  if(!COTA_UNICA && (!ordem || ordem < 1)){
    DS.marcarInvalido($("#co-ordem"), "A ordem começa em 1.");
    $("#co-ordem").focus();
    return;
  }
  if(!COTA_UNICA && $("#co-ordem")) DS.limparInvalido($("#co-ordem"));

  const quartos = {};
  [["single","#co-q-single"],["duplo","#co-q-duplo"],["triplo","#co-q-triplo"]]
    .forEach(([t,s]) => {
      const n = parseInt($(s).value, 10);
      if(n > 0) quartos[t] = n;
    });

  const b = $("#co-salvar");
  b.disabled = true; b.textContent = "Salvando…";
  try{
    await rpc("admin_salvar_cota", {
      p_evento_slug: EVENTO, p_nome: nome, p_ordem: ordem,
      p_quartos: quartos,
      p_vagas_mesa: parseInt($("#co-mesa").value,10) || 0,
      p_reuniao: $("#co-reuniao").value === "1",
      p_jantar:  $("#co-jantar").value  === "1",
      // vazio vira null de proposito: e assim que se tira o prazo de
      // uma cota que ja teve um
      p_prazo_indicacao: $("#co-prazo")?.value || null,
      p_janela_horas: parseInt($("#co-janela")?.value, 10) || null,
      p_limite_indicacoes: parseInt($("#co-limite-ind").value, 10) || null,
      p_escolhe_convidados: $("#co-escolhe").value === "1",
      p_upload_logo: $("#co-up-logo").checked,
      p_upload_banner: $("#co-up-banner").checked,
      p_upload_arte_revista: $("#co-up-revista").checked,
      p_upload_apresentacao: $("#co-up-apresentacao").checked,
      p_upload_video: $("#co-up-video").checked,
      p_prazo_upload: $("#co-up-prazo").value || null
    });
    ["#co-nome","#co-mesa","#co-q-single","#co-q-duplo","#co-q-triplo","#co-limite-ind","#co-up-prazo"]
      .forEach(s => $(s).value = "");
    ["#co-up-logo","#co-up-banner","#co-up-revista","#co-up-apresentacao","#co-up-video"]
      .forEach(s => $(s).checked = false);
    if($("#co-ordem"))  $("#co-ordem").value  = "";
    if($("#co-prazo"))  $("#co-prazo").value  = "";
    if($("#co-janela")) $("#co-janela").value = "";
    $("#co-escolhe").value = "1";
    if($("#co-cancelar")) $("#co-cancelar").style.display = "none";
    blocoCotas();
  }catch(e){ aviso("#co-aviso", explicar(e)); }
  finally{ b.disabled = false; b.textContent = "Salvar cota"; }
}

// =====================================================================
// ESPELHO DE QUARTOS DO RESORT
//
// O hotel manda uma aba por prédio, cada uma com duas partes: um
// dicionário de categorias no topo e, depois de uma linha "MAPA DE
// ALOCAÇÕES", uma linha por apartamento.
//
// A leitura é por posição de coluna, não por nome: os títulos vêm com
// acento, maiúscula e células mescladas, e o mesmo arquivo muda de
// cabeçalho entre versões. O que não muda é a ordem — prédio, andar,
// corredor, apto, categoria.
// =====================================================================
// Gera um exemplo no formato EXATO que lerMapaResort espera — a leitura
// é por posição de coluna, não por título, então o jeito mais confiável
// de mostrar "assim que o arquivo tem que vir" é gerar com o mesmo
// código que depois vai ler de volta.
function baixarModeloMapaResort(){
  const linhas = [
    ["", "SUP", "Superior", "", "2 camas queen e 1 cama de viúva"],
    ["", "STD", "Standard", "", "1 cama king"],
    [],
    ["MAPA DE ALOCAÇÕES"],
    ["", "PRÉDIO", "ANDAR", "CORREDOR", "Nº DO APTO", "CATEGORIA"],
    ["", "Alexânia 1", "2", "A", "201", "SUP"],
    ["", "Alexânia 1", "2", "A", "202", "STD"],
    ["", "Alexânia 1", "3", "B", "301", "SUP"]
  ];
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Alexânia 1");
  XLSX.writeFile(wb, "modelo-mapa-resort-cio-cerrado.xlsx");
}

function lerMapaResort(wb){
  const cats = new Map();
  const quartos = [];
  const semAcento = t => String(t ?? "").normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").toUpperCase();

  wb.SheetNames.forEach(nome => {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header:1, defval:"" });

    // Só entra aba que traz o mapa, e o próprio arquivo diz onde ele
    // começa. Sem esta âncora a leitura pesca lixo das outras abas:
    // qualquer linha com número numa coluna e texto na seguinte vira
    // "apartamento", e a aba COTAS transforma patrocinador em quarto —
    // 703 registros em vez de 424, medido no arquivo de 2026.
    const marco = aoa.findIndex(l =>
      l.some(c => semAcento(c).includes("MAPA DE ALOCA")));
    if(marco < 0) return;

    // o dicionário de categorias fica ACIMA do marco
    aoa.slice(0, marco).forEach(linha => {
      const col = i => String(linha[i] ?? "").trim();
      const cod = col(1);
      if(cod && cod === cod.toUpperCase() && !/^\d+$/.test(cod)
         && /cama|apartamento/i.test(col(4))){
        if(!cats.has(cod)) cats.set(cod, { codigo:cod, nome:col(2), descricao:col(4) });
      }
    });

    // e o mapa, abaixo dele. +1 pula a linha de títulos.
    aoa.slice(marco + 1).forEach(linha => {
      const col = i => String(linha[i] ?? "").trim();
      const apto = col(4), categoria = col(5);
      if(/^\d+$/.test(apto) && categoria){
        quartos.push({ numero:apto, bloco:col(1), andar:col(2),
                       corredor:col(3), categoria });
      }
    });
  });

  return { categorias:[...cats.values()], quartos };
}

async function importarMapaResort(arquivo){
  const box = $("#mp-aviso");
  try{
    const buf = await arquivo.arrayBuffer();
    const wb  = XLSX.read(buf, { type:"array" });
    const { categorias, quartos } = lerMapaResort(wb);

    if(quartos.length === 0){
      aviso(box, "Não encontrei nenhum apartamento neste arquivo. " +
                 "Confira se é o Mapa de Alocações do resort.");
      return;
    }

    if(!(await DS.confirmar(
        "Quartos que já existem têm prédio, andar, corredor e categoria atualizados. " +
        "Capacidade e tipo NÃO são tocados — quem os define é a categoria, logo abaixo.",
        {titulo:`Importar ${quartos.length} apartamento(s) e ${categorias.length} categoria(s)?`}))) return;

    const r = await rpc("admin_importar_mapa_quartos", {
      p_evento_slug: EVENTO, p_categorias: categorias, p_quartos: quartos });

    aviso(box, `${r.linhas_recebidas} linha(s) lidas · ` +
               `${r.quartos_no_evento} quarto(s) no evento · ` +
               `${r.categorias} categoria(s).`, "ok");
    blocoQuartos();
    blocoCategorias();
  }catch(e){ aviso(box, explicar(e)); }
}

// A capacidade real está em prosa no arquivo do hotel ("2 camas queen e
// 1 cama de viúva"), e o que o resort aceita cobrar não está escrito em
// lugar nenhum. Por isso o import entra com 2 e a organização ajusta
// aqui, uma vez por categoria — são 192 apartamentos SUP, corrigir um a
// um seria transcrever o mapa de novo.

  const alvo = $("#bl-categorias");

  try{
    const l = await rpc("admin_listar_categorias_quarto", { p_evento_slug: EVENTO });
    if(l.length === 0){ alvo.innerHTML = ""; return; }

    alvo.innerHTML = `
      <div class="cartao">
        <h2>Categorias do resort</h2>
        <p class="sub" style="margin-bottom:10px;">
          Vieram do arquivo do hotel. Confirme com o resort quantas pessoas cada
          uma comporta e qual o tipo para efeito de preço — mudar aqui vale para
          todos os quartos da categoria.
        </p>
        <div id="cat-aviso"></div>
        <div class="rolagem"><table>
          <tr><th>Código</th><th>Categoria</th><th>Quartos</th>
              <th>Comporta</th><th>Tipo</th><th></th></tr>
          ${l.map(c => `<tr data-cod="${esc(c.codigo)}">
            <td><strong>${esc(c.codigo)}</strong></td>
            <td>${esc(c.nome || "—")}<br>
                <span class="meta">${esc((c.descricao||"").slice(0,70))}</span></td>
            <td class="meta">${c.quartos}</td>
            <td><input type="text" class="cat-cap" value="${c.capacidade}"
                       style="max-width:60px;"></td>
            <td><select class="cat-tipo">
                  ${["single","duplo","triplo"].map(t =>
                    `<option value="${t}" ${t===c.tipo?"selected":""}>${t}</option>`).join("")}
                </select></td>
            <td><button class="btn sec mini cat-salvar">Salvar</button></td>
          </tr>`).join("")}
        </table></div>
      </div>`;

    $$(".cat-salvar", alvo).forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      b.disabled = true;
      try{
        const r = await rpc("admin_salvar_categoria_quarto", {
          p_evento_slug: EVENTO,
          p_codigo: tr.dataset.cod,
          p_capacidade: parseInt(tr.querySelector(".cat-cap").value, 10),
          p_tipo: tr.querySelector(".cat-tipo").value

}

          const achou = await enriquecerUmPatrocinador(tr.dataset.id, tr.dataset.empresa, tr.dataset.site);
          if(achou) ok++; else semAchado++;
        }catch(e){ erro++; }

        `IA em lote: ${ok} atualizada(s)` +
        (semAchado ? `, ${semAchado} sem dado encontrado` : "") +
        (erro ? `, ${erro} com erro` : "") + ".",
        erro ? "erro" : "ok");

      catch(e){ aviso("#aviso-global", explicar(e)); b.disabled = false; }

  DS.limparInvalido($("#pt-empresa"));

  const b = $("#pt-salvar");
  b.disabled = true; b.textContent = "Salvando…";
  try{
    await rpc("admin_salvar_patrocinador", {
      p_evento_slug: EVENTO, p_empresa: empresa,
      p_cota_nome: $("#pt-cota").value || null,
      p_cnpj: $("#pt-cnpj").value.trim() || null,
      p_segmento: $("#pt-segmento").value.trim() || null,

      p_site: $("#pt-site").value.trim() || null,
      p_resumo: $("#pt-resumo").value.trim() || null,
      p_natureza: $("#pt-natureza").value || null,
      p_cidade: $("#pt-cidade").value.trim() || null,
      p_estado: $("#pt-estado").value.trim().toUpperCase() || null,
      p_lounge: $("#pt-lounge").value.trim() || null
    });
    ["#pt-empresa","#pt-cnpj","#pt-segmento","#pt-vende","#pt-extras","#pt-mesa",
     "#pt-site","#pt-resumo","#pt-cidade","#pt-estado","#pt-lounge"].forEach(s => $(s).value = "");
    $("#pt-natureza").value = "";
    ABAS.patrocinadores();
  }catch(e){ aviso("#pt-aviso", explicar(e)); }
  finally{ b.disabled = false; b.textContent = "Salvar"; }
}

// Busca os dados da empresa na web. Devolve JSON para preencher o
// formulário — nunca salva sozinha: quem confirma é você.
async function pesquisarEmpresa(nome, site){
  const d = await ia(
    `Pesquise a empresa "${nome}"${site ? ` (site: ${site})` : ""} e responda APENAS ` +
    `um objeto JSON, sem markdown, com estas chaves:\n` +
    `{"site":"domínio oficial","resumo":"o que a empresa faz, máx 25 palavras",` +
    `"o_que_vende":"principais produtos e serviços, máx 20 palavras",` +
    `"segmento":"segmento de atuação em 1-3 palavras",` +
    `"cnpj":"CNPJ no formato XX.XXX.XXX/XXXX-XX, so a matriz",` +
    `"natureza":"privada|hibrida|publica","cidade":"sede","estado":"UF"}\n` +
    `natureza: "hibrida" para Sistema S, fundações e associações ligadas a estatais, ` +
    `fundos de pensão e capital misto; "publica" para governo, autarquias e estatais puras. ` +
    `Use string vazia no que não encontrar — não invente.`,
    { buscarWeb: true, json: true, maxTokens: 800 });

  if(!d || typeof d !== "object"){
    throw new Error("A busca não retornou dados utilizáveis para essa empresa.");
  }
  return d;
}

// Uma busca + gravação, reaproveitada pelo botão "IA" da linha e pelo
// botão de lote — os dois fazem exatamente a mesma coisa, só o
// segundo repete isto várias vezes, uma empresa de cada vez.
async function enriquecerUmPatrocinador(id, empresa, site){
  const d = await pesquisarEmpresa(empresa, site);
  await rpc("admin_enriquecer_patrocinador", {
    p_id: id,
    p_site: d.site || null, p_resumo: d.resumo || null,
    p_o_que_vende: d.o_que_vende || null, p_segmento: d.segmento || null,
    p_natureza: d.natureza || null,
    p_cidade: d.cidade || null, p_estado: d.estado || null,
    p_cnpj: d.cnpj || null
  });
  return ["site","resumo","o_que_vende","segmento","cidade","estado","cnpj"]
    .filter(k => String(d[k] || "").trim()).length;
}

// Mesma ideia da busca de patrocinador, mas so pra dado profissional
// PUBLICO de uma pessoa (cargo, empresa, segmento, cidade/UF,
// linkedin) — CPF, telefone e e-mail nunca entram aqui.
async function pesquisarGestor(nome, empresa){
  const d = await ia(
    `Pesquise o profissional "${nome}"${empresa ? `, que trabalha ou trabalhou na empresa "${empresa}"` : ""} ` +
    `e responda APENAS um objeto JSON, sem markdown, com estas chaves:\n` +
    `{"cargo":"cargo atual, curto","empresa":"empresa atual",` +
    `"segmento":"segmento de atuação da empresa em 1-3 palavras",` +
    `"cidade":"cidade onde trabalha","estado":"UF",` +
    `"linkedin":"URL do perfil no LinkedIn, se encontrar"}\n` +
    `Use string vazia no que não encontrar — não invente. Nunca inclua CPF, ` +
    `telefone ou e-mail pessoal na resposta, mesmo que encontre.`,
    { buscarWeb: true, json: true, maxTokens: 500 });

  if(!d || typeof d !== "object"){
    throw new Error("A busca não retornou dados utilizáveis para essa pessoa.");
  }
  return d;
}

async function enriquecerUmGestor(id, nome, empresa){
  const d = await pesquisarGestor(nome, empresa);
  await rpc("admin_enriquecer_gestor", {

    p_segmento: d.segmento || null,
    p_cidade: d.cidade || null, p_estado: d.estado || null,
    p_linkedin: d.linkedin || null
  });

}

// CHAMADA DE IA
// Passa pela Edge Function "ia": a chave da Anthropic fica no servidor.
// Chamar api.anthropic.com direto daqui exigiria a chave dentro deste
// arquivo, que é público.
// =====================================================================
async function ia(prompt, { buscarWeb = false, json = false, maxTokens = 2000 } = {}){
  const { data, error } = await sb.functions.invoke("ia", {
    body: { prompt, buscar_web: buscarWeb, json, max_tokens: maxTokens }
  });
  if(error) throw new Error(error.message || "Falha ao chamar a IA.");
  if(data?.erro) throw new Error(data.erro);
  return json ? data.dados : data.texto;
}

let PESQ_LINHAS = [];

// Mapeia as 73 colunas do export. As de investimento e as de perfil
// vão para grupos separados, senão a agregação por área misturaria
// "COMO A TI ESCOLHE FORNECEDORES" com "INVESTIMENTO INFRA - BACKUP".
const MAPA_PESQ = {
  "E-MAIL CORPORATIVO": "email",
  "Faturamento Anual da Emprea": "faturamento",
  "Orçamento Anual da Área de TI(CAPEX e OPEX)": "orcamento_ti",
  "Número de Colaboradores da Empresa": "colaboradores",
  "Número Colaboradores de TI da Empresa": "colaboradores_ti",
  "SISTEMA ERP ATUAL": "erp_atual",
  "Quantidade de dispositivos(Desktops, notebooks, smartphones, etc.)": "dispositivos",
  "Quais são seus serviços de TI já terceirizados ?": "terceirizados",
  "TERMO DE CONSENTIMENTO E RESPONSABILIDADE – LGPD": "consentimento_lgpd",
};

const chave = s => String(s||"").trim().toUpperCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

async function lerPesquisa(ev){
  const f = ev.target.files[0];
  if(!f) return;
  try{
    const buf = await f.arrayBuffer();
    const wb  = XLSX.read(buf, { type:"array" });
    const ws  = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

    // O export traz título e local nas primeiras linhas antes do
    // cabeçalho real. O critério antigo era "primeira linha com mais de
    // 20 colunas" — funcionava com o export atual (73 colunas), mas
    // quebrava em qualquer formulário mais curto, caindo na linha 1 e
    // importando zero. Agora pega a linha mais preenchida entre as
    // primeiras 20, exigindo ao menos 3 colunas.
    let iCab = 0, melhor = 0;
    aoa.slice(0, 20).forEach((l, i) => {
      const n = l.filter(v => String(v).trim()).length;
      if(n > melhor){ melhor = n; iCab = i; }
    });

    if(melhor < 3){
      aviso("#pq-aviso",
        "Não encontrei uma linha de cabeçalho neste arquivo. Confira se é o export de participantes do Sympla.");
      $("#pq-importar").disabled = true;
      $("#pq-previa").innerHTML = "";
      return;
    }

    const cab = aoa[iCab].map(v => String(v).trim());
    const mapaNorm = {};
    Object.entries(MAPA_PESQ).forEach(([k,v]) => mapaNorm[chave(k)] = v);

    PESQ_LINHAS = aoa.slice(iCab+1)
      .filter(l => l.some(v => String(v).trim()))
      .map(l => {
        const o = { investimentos:{}, perfil:{} };
        cab.forEach((titulo, i) => {
          const valor = String(l[i] ?? "").trim();
          if(!titulo) return;
          const campo = mapaNorm[chave(titulo)];
          if(campo){ o[campo] = valor; return; }
          if(chave(titulo).startsWith("INVESTIMENTO")){
            if(valor) o.investimentos[titulo.replace(/^INVESTIMENTO\s*/i,"").trim()] = valor;
          }else if(valor){
            o.perfil[titulo] = valor;
          }
        });
        o.nome = String(l[0] ?? "").trim();
        return o;
      })
      .filter(o => o.email);

    const areas = PESQ_LINHAS[0] ? Object.keys(PESQ_LINHAS[0].investimentos).length : 0;
    $("#pq-previa").innerHTML = `
      <p class="meta" style="margin-top:10px;">
        ${PESQ_LINHAS.length} respondente(s) · ${areas} área(s) de investimento por linha
        · cabeçalho na linha ${iCab+1} (${melhor} colunas)
      </p>`;
    $("#pq-importar").disabled = PESQ_LINHAS.length === 0;

    // Zero respondentes quase sempre é coluna de e-mail com outro nome,
    // não arquivo vazio — dizer isso poupa uma investigação.
    aviso("#pq-aviso", PESQ_LINHAS.length === 0
      ? `Li a linha ${iCab+1} como cabeçalho, mas nenhuma linha tinha e-mail. ` +
        `A coluna precisa se chamar "E-MAIL CORPORATIVO".`
      : "", "erro");
  }catch(e){
    aviso("#pq-aviso","Não consegui ler o arquivo. Confira se é o export do Sympla em .xlsx.");
  }
}

  const b = $("#pq-importar");

async function rodarProspeccao(){
  const btn = $("#pr-rodar");
  const nome = $("#pr-nome").value.trim();

  if(!nome){
    aviso("#pr-aviso","Informe a empresa patrocinadora — é o perfil dela que define a aderência.");
    return;
  }

  PROSP_PATRO = nome;
  PROSP_EXECS = $("#pr-execs").value;

  btn.disabled = true;
  const status = t => $("#pr-status").innerHTML = `<p class="carregando">${esc(t)}</p>`;

  try{
    // rodadas marcadas viram lista de empresas bloqueadas
    const marcadas = $$(".pr-rod:checked").map(c => c.value);
    let bloquear = [];
    if(marcadas.length){
      status("Levantando empresas das rodadas anteriores…");
      for(const r of marcadas){
        const emp = await rpc("admin_empresas_da_rodada", { p_rodada: r });
        bloquear = bloquear.concat(emp.map(x => x.empresa));
      }
    }

    status("Buscando empresas na base…");
    let base = await rpc("admin_prospeccao_base", {
      p_evento_slug: EVENTO,
      p_excluir_fornecedores: $("#pr-forn").checked,
      p_excluir_empresas: bloquear.length ? bloquear : null,
      p_excluir_convidados: $("#pr-hist").checked,
      p_tipo_sessao: "jantar",
      p_limite: 500
    });

    if(base.length === 0){
      $("#pr-status").innerHTML = "";
      aviso("#pr-aviso","Nenhuma empresa nova com esses filtros. Tente desmarcar rodadas anteriores ou o histórico.");
      btn.disabled = false; return;
    }

    // ---- abrangência geográfica interpretada pela IA ----
    const abr = $("#pr-abr").value.trim();
    if(abr){
      status(`Interpretando a abrangência "${abr}"…`);
      const pares = [...new Set(base.map(e =>
        `${(e.cidade||"").trim()}|${(e.estado||"").trim()}`))].filter(p => p !== "|");

      if(pares.length){
        try{
          const idx = await ia(
            `Abrangência geográfica desejada (texto do organizador do evento): "${abr}"\n\n` +
            `Lista de localidades (indice: cidade|UF):\n` +
            pares.map((p,i) => `${i}: ${p}`).join("\n") +
            `\n\nQuais índices pertencem a essa abrangência? Interprete com bom senso: ` +
            `"e região"/"entorno" inclui a região metropolitana e municípios vizinhos; ` +
            `siglas como BSB = Brasília; "todo o Brasil" = todos. ` +
            `Responda APENAS um array JSON de índices, sem markdown. Ex.: [0,3,7]`,
            { json: true, maxTokens: 1500 });

          const ok = new Set((Array.isArray(idx) ? idx : []).map(Number)
            .map(i => pares[i]).filter(Boolean).map(p => p.toUpperCase()));

          if(ok.size){
            base = base.filter(e =>
              ok.has(`${(e.cidade||"").trim()}|${(e.estado||"").trim()}`.toUpperCase()));
          }
        }catch(e){
          // Se a IA falhar, cai para comparação textual simples em vez
          // de ignorar o filtro e trazer o Brasil inteiro.
          const a = abr.toUpperCase();
          base = base.filter(e => {
            const cid = (e.cidade||"").trim().toUpperCase();
            const est = (e.estado||"").trim().toUpperCase();
            return (cid && a.includes(cid)) || (est && a.includes(est));
          });
          status("Não consegui interpretar a abrangência; usei comparação simples.");
        }
      }
    }

    if(base.length === 0){
      $("#pr-status").innerHTML = "";
      aviso("#pr-aviso",`Nenhuma empresa dentro de "${abr}". Amplie a abrangência.`);
      btn.disabled = false; return;
    }

    // ---- perfil do patrocinador ----
    status(`Pesquisando o perfil de ${nome}…`);
    const site = $("#pr-site").value.trim();
    let perfil = nome + (site ? " — " + site : "");
    try{
      perfil = await ia(
        `Pesquise a empresa "${nome}"${site ? ` (site: ${site})` : ""} e responda em no máximo ` +
        `120 palavras: o que ela vende, principais serviços/produtos, e que perfil de cliente ` +
        `empresarial ela busca. Responda só o texto, sem preâmbulo.`,
        { buscarWeb: true, maxTokens: 600 });
    }catch(e){
      status(`Não consegui pesquisar ${nome} na web. Seguindo com o cadastro.`);
    }

    // ---- classificação e score em lotes ----
    const soPriv = $("#pr-priv").checked;
    const incHib = $("#pr-hib").checked;
    const perfilDesejado = $("#pr-perfil").value.trim();
    const fatMin = $("#pr-fatmin").value.trim();
    const obs = $("#pr-obs").value.trim();

    const regraIncluir = soPriv
      ? (incHib
          ? '- incluir=true para privadas e híbridas; incluir=false para públicas.'
          : '- incluir=true somente para privadas; false para híbridas e públicas.')
      : '- incluir=true para todas.';

    const LOTE = 12;
    const nLotes = Math.ceil(base.length / LOTE);
    const saida = [];

    for(let i = 0; i < nLotes; i++){
      status(`Analisando aderência — lote ${i+1} de ${nLotes} (${base.length} empresas)…`);
      const chunk = base.slice(i*LOTE, (i+1)*LOTE);

      const lista = chunk.map((e,j) =>
        `${j}|${e.empresa}|seg:${e.segmento||"?"}|fat:${e.faturamento||"?"}|func:${e.funcionarios||"?"}`
      ).join("\n");

      const prompt = `Você é analista de prospecção B2B.

PATROCINADOR (quem vai oferecer o jantar): ${nome}
Perfil: ${perfil}
${perfilDesejado ? "Perfil de convidado desejado: " + perfilDesejado : ""}
${fatMin ? "Faturamento mínimo desejado: " + fatMin : ""}
${obs ? "Observações do organizador: " + obs : ""}

REGRAS DE CLASSIFICAÇÃO:
- natureza "privada": empresa privada comum.
- natureza "hibrida": Sistema S (SENAI/SESI/SESC/SEBRAE/SEST SENAT), serviços sociais autônomos, fundações/associações privadas ligadas a estatais (ex.: fundos de pensão, autogestões de saúde), capital misto.
- natureza "publica": órgãos de governo, autarquias, tribunais, ministérios, forças armadas, estatais puras, organismos internacionais.
${regraIncluir}
- score 0-100 = aderência comercial entre a empresa e o que o patrocinador vende (porte, segmento, maturidade provável).

EMPRESAS (indice|nome|dados):
${lista}

Responda APENAS um array JSON, sem markdown, um objeto por empresa:
[{"i":0,"natureza":"privada","incluir":true,"score":85,"just":"máx 15 palavras"}]`;

      let arr = [];
      try{
        arr = await ia(prompt, { json: true, maxTokens: 2000 }) || [];
      }catch(e){ arr = []; }

      chunk.forEach((e,j) => {
        const m = (Array.isArray(arr) ? arr : []).find(x => x.i === j) || {};
        saida.push({
          ...e,
          natureza: m.natureza || "privada",
          incluir: m.incluir !== false,
          score: Math.max(0, Math.min(100, Number(m.score) || 50)),
          just: m.just || "",
          manter: m.incluir !== false,
          sem_analise: !m.natureza
        });
      });
    }

    saida.sort((a,b) => b.score - a.score);

    // limite conta ASSENTOS, não empresas: com 2 executivos, uma
    // empresa ocupa duas vagas do jantar
    const cap = parseInt($("#pr-max").value, 10);
    if(cap > 0){
      let vagas = 0;
      for(const r of saida){
        if(!r.incluir){ r.manter = false; continue; }
        const assentos = PROSP_EXECS === "2" ? (r.exec2_nome ? 2 : 1) : 1;
        if(vagas + assentos <= cap){ r.manter = true; vagas += assentos; }
        else r.manter = false;
      }
    }

    PROSP = saida;
    $("#pr-status").innerHTML = "";
    desenharProspeccao();
  }catch(e){
    $("#pr-status").innerHTML = "";
    aviso("#pr-aviso", explicar(e));
  }finally{
    btn.disabled = false;
  }
}

const assentosDe = r => PROSP_EXECS === "2" ? (r.exec2_nome ? 2 : 1) : 1;

function desenharProspeccao(){
  const box = $("#pr-resultado");
  const dentro = PROSP.filter(r => r.manter && r.incluir);
  const nConvidados = dentro.reduce((n,r) => n + assentosDe(r), 0);
  const semAnalise = PROSP.filter(r => r.sem_analise).length;

  box.innerHTML = `
    <div class="cartao">
      <div class="cartao-cab" style="margin-bottom:10px;">
        <div>
          <h2 style="margin:0;">${dentro.length} empresa(s) · ${nConvidados} convidado(s)</h2>
          <p class="meta">de ${PROSP.length} analisada(s)${semAnalise ? ` · ${semAnalise} sem pontuação (revise)` : ""}</p>
        </div>
        <div style="white-space:nowrap;">
          <button class="btn sec mini" id="pr-x-completa">Análise completa</button>
          <button class="btn sec mini" id="pr-x-validacao">Validação</button>
          <button class="btn sec mini" id="pr-x-sympla">Convites Sympla</button>
          <button class="btn sec mini" id="pr-copiar">Copiar e-mails</button>
        </div>
      </div>
      <div class="rolagem" style="max-height:460px;">
        <table>
          <tr><th></th><th>Empresa</th><th>Executivos</th><th>Porte</th>
              <th>Natureza</th><th>Aderência</th><th>Por quê</th></tr>
          ${PROSP.map((r,i) => `<tr data-i="${i}" ${r.incluir ? "" : 'style="opacity:.5"'}>
            <td><input type="checkbox" class="pr-pick" ${r.manter ? "checked" : ""}></td>
            <td><strong>${esc(r.empresa)}</strong>
                <br><span class="meta">${esc(r.segmento||"—")}${r.cidade ? " · "+esc(r.cidade) : ""}${r.estado ? "/"+esc(r.estado) : ""}</span>
                ${r.ja_convidado_em ? `<br><span class="selo alerta">já foi em ${esc(r.ja_convidado_em)}</span>` : ""}</td>
            <td>${esc(r.exec1_nome||"—")}<br><span class="meta">${esc(r.exec1_cargo||"")}</span>
                ${r.exec2_nome ? `<br>${PROSP_EXECS === "2"
                    ? `${esc(r.exec2_nome)}<br><span class="meta">${esc(r.exec2_cargo||"")}</span>`
                    : `<span class="meta">2ª opção: ${esc(r.exec2_nome)}</span>`}` : ""}</td>
            <td class="meta">${esc(r.faturamento||"—")}${r.funcionarios ? `<br>${esc(r.funcionarios)} func.` : ""}</td>
            <td><span class="selo ${r.natureza==="publica"?"erro":r.natureza==="hibrida"?"alerta":"pend"}">${esc(r.natureza)}</span></td>
            <td><span class="selo ${r.score>=70?"ok":r.score>=50?"alerta":"pend"}">${r.score}%</span></td>
            <td class="meta">${esc(r.just||"—")}</td>
          </tr>`).join("")}
        </table>
      </div>
      <div style="margin-top:12px;">
        <button class="btn" id="pr-salvar">Salvar seleção</button>
        <span class="meta" id="pr-conta" style="margin-left:10px;"></span>
      </div>
      <div id="pr-aviso2"></div>
    </div>`;

  const sincronizar = () => {
    $$(".pr-pick").forEach((c,i) => PROSP[i].manter = c.checked);
    const sel = PROSP.filter(r => r.manter);
    const n = sel.reduce((s,r) => s + assentosDe(r), 0);
    $("#pr-conta").textContent = `${sel.length} empresa(s) · ${n} convidado(s)`;
  };
  $$(".pr-pick").forEach(c => c.addEventListener("change", sincronizar));
  sincronizar();

  const sel = () => PROSP.filter(r => r.manter);
  const arq = s => `Jantar_${PROSP_PATRO.replace(/\W+/g,"_")}_${s}.xlsx`;

  $("#pr-x-completa").addEventListener("click", () => exportar(
    sel().map((r,i) => ({
      n: i+1,
      exec1: r.exec1_nome || "—", cargo1: r.exec1_cargo || "—",
      exec2: r.exec2_nome || "—", cargo2: r.exec2_cargo || "—",
      empresa: r.empresa, segmento: r.segmento,
      natureza: r.natureza, score: r.score + "%", just: r.just
    })),
    [["n","#"],["exec1","Executivo Principal"],["cargo1","Cargo"],
     ["exec2","2ª Opção"],["cargo2","Cargo (2ª Opção)"],
     ["empresa","Empresa"],["segmento","Segmento"],["natureza","Natureza"],
     ["score","% Aderência"],["just","Justificativa"]],
    arq("Analise_Completa"), "Lista"));

  $("#pr-x-validacao").addEventListener("click", () => exportar(
    sel().map((r,i) => ({
      n: i+1, empresa: r.empresa, segmento: r.segmento,
      cidade: r.cidade || "—", estado: r.estado || "—", score: r.score + "%"
    })),
    [["n","#"],["empresa","Empresa"],["segmento","Segmento"],
     ["cidade","Cidade"],["estado","Estado"],["score","% Aderência"]],
    arq("Validacao"), "Lista"));

  $("#pr-x-sympla").addEventListener("click", () => {
    // uma linha POR EXECUTIVO, não por empresa: é o formato que o
    // Sympla importa
    const linhas = [];
    sel().forEach(r => {
      const execs = PROSP_EXECS === "2"
        ? [[r.exec1_nome, r.exec1_cargo, r.exec1_email, r.exec1_telefone],
           [r.exec2_nome, r.exec2_cargo, r.exec2_email, r.exec2_telefone]]
        : [[r.exec1_nome, r.exec1_cargo, r.exec1_email, r.exec1_telefone]];

      execs.forEach(([n,c,em,t]) => {
        if(!n) return;
        const partes = String(n).split(/\s+/);
        linhas.push({
          nome: partes[0] || "", sobrenome: partes.slice(1).join(" "),
          email: em || "", telefone: t || "", empresa: r.empresa, cargo: c || ""
        });
      });
    });

    exportar(linhas, [["nome","Nome"],["sobrenome","Sobrenome"],["email","E-mail"],
      ["telefone","Telefone"],["empresa","Empresa"],["cargo","Cargo"]],
      arq("Convites_Sympla"), "Convites");

    const semEmail = linhas.filter(l => !l.email).length;
    if(semEmail) aviso("#pr-aviso2",
      `${semEmail} convidado(s) sem e-mail na base — complete antes de importar no Sympla.`);
  });

  $("#pr-copiar").addEventListener("click", async () => {
    const emails = [];
    sel().forEach(r => {
      emails.push(r.exec1_email);
      if(PROSP_EXECS === "2") emails.push(r.exec2_email);
    });
    const unicos = [...new Set(emails.map(e => (e||"").trim()).filter(Boolean))];

    if(!unicos.length){ aviso("#pr-aviso2","Nenhum e-mail na base para os selecionados."); return; }
    const texto = unicos.join(";");
    try{
      await navigator.clipboard.writeText(texto);
      const total = sel().reduce((s,r) => s + assentosDe(r), 0);
      aviso("#pr-aviso2",
        `${unicos.length} e-mail(s) copiados no formato Sympla` +
        (total > unicos.length ? ` — ${total - unicos.length} sem e-mail na base` : "") +
        ". Cole em Divulgue → Convite por e-mail.", "ok");
    }catch{
      window.prompt("Copie a lista de e-mails:", texto);
    }
  });

  $("#pr-salvar").addEventListener("click", async () => {
    const b = $("#pr-salvar");
    b.disabled = true; b.textContent = "Salvando…";
    try{
      const r = await rpc("admin_salvar_prospeccao", {
        p_evento_slug: EVENTO,
        p_sessao_id: $("#pr-sessao").value || null,
        p_itens: PROSP.map(x => ({
          gestor_id: x.exec1_id, empresa: x.empresa, score: x.score,
          natureza: x.natureza, justificativa: x.just, aprovado: !!x.manter
        }))
      });
      aviso("#pr-aviso2",
        `${r.salvos} registro(s) salvos. Esta rodada passa a aparecer na lista de "não repetir".`,
        "ok");
    }catch(e){ aviso("#pr-aviso2", explicar(e)); }
    finally{ b.disabled = false; b.textContent = "Salvar seleção"; }
  });
}

// Aceita "1.234,56" e "1234.56": a pessoa digita como está acostumada.
function lerValor(txt){
  const t = String(txt||"").trim().replace(/[^\d.,-]/g,"");
  if(!t) return NaN;
  const v = t.includes(",") ? t.replace(/\./g,"").replace(",",".") : t;
  return Number(v);
}

async function listarPrecos(){
  try{
    const l = await rpc("admin_listar_precos", { p_evento_slug: EVENTO });
    $("#pr-lista").innerHTML = l.length === 0
      ? `<div class="vazio">Nenhum preço cadastrado. Adicione acima.</div>`

                            data-imin="${p.idade_min ?? ""}" data-imax="${p.idade_max ?? ""}">
            <td class="meta">${esc(p.item)}
              ${ITENS_FIXOS.includes(p.item) ? `<br><span class="selo pend">usado na fatura</span>` : ""}</td>
            <td>${esc(p.descricao||"—")}
              ${p.faixa ? `<br><span class="selo alerta">${esc(p.faixa.trim())}</span>` : ""}</td>
            <td><strong>${moeda(p.valor)}</strong></td>
            <td style="white-space:nowrap;">
              <button class="btn sec mini editar">Editar</button>
              <button class="btn perigo mini apagar">Remover</button>

async function salvarPreco(){
  const item  = $("#pr-item").value.trim();
  const valor = lerValor($("#pr-valor").value);

  if(!item){ aviso("#pr-aviso","Informe o item."); return; }
  if(Number.isNaN(valor)){ aviso("#pr-aviso","Informe um valor numérico."); return; }
  if(valor < 0){ aviso("#pr-aviso","O valor não pode ser negativo."); return; }

  const idade = s => {
    const v = $(s).value.trim();
    if(v === "") return null;
    const n = parseInt(v, 10);
    return Number.isNaN(n) ? undefined : n;
  };
  const imin = idade("#pr-imin"), imax = idade("#pr-imax");

  if(imin === undefined || imax === undefined){
    aviso("#pr-aviso","Idade precisa ser um número, ou em branco."); return;
  }
  if(imin !== null && imax !== null && imax < imin){
    aviso("#pr-aviso","A idade final é menor que a inicial."); return;
  }

  const btn = $("#pr-salvar");
  btn.disabled = true; btn.textContent = "Salvando…";
  try{
    const r = await rpc("admin_salvar_preco", {
      p_evento_slug: EVENTO, p_item: item, p_valor: valor,
      p_descricao: $("#pr-desc").value.trim() || null,
      p_idade_min: imin, p_idade_max: imax
    });
    aviso("#pr-aviso",
      `Preço de "${r.item}"${r.faixa || ""} salvo em ${moeda(valor)}.`, "ok");
    ["#pr-item","#pr-desc","#pr-valor","#pr-imin","#pr-imax"]
      .forEach(s => $(s).value = "");
    listarPrecos();
  }catch(e){ aviso("#pr-aviso", explicar(e)); }
  finally{ btn.disabled = false; btn.textContent = "Salvar preço"; }
}

async function salvarMembro(){
  const email = $("#eq-email").value.trim();
  if(!email){ aviso("#eq-aviso","Informe o e-mail."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    aviso("#eq-aviso","E-mail inválido. Um endereço errado aqui vira acesso que nunca funciona.");
    return;
  }

  const btn = $("#eq-salvar");
  btn.disabled = true; btn.textContent = "Salvando…";
  try{
    await rpc("admin_salvar_membro", {
      p_email: email,
      p_nome:  $("#eq-nome").value.trim() || null,
      p_role:  $("#eq-role").value
    });
    aviso("#eq-aviso", `Acesso de ${email} salvo.`, "ok");
    ["#eq-email","#eq-nome"].forEach(s => $(s).value = "");
    listarEquipe();
  }catch(e){ aviso("#eq-aviso", explicar(e)); }
  finally{ btn.disabled = false; btn.textContent = "Salvar"; }
}

      const dados = await rpc("admin_exportar_empresas_app", { p_evento_slug: EVENTO });
      exportar(dados, [
        ["nome","nome"],["cnpj","cnpj"],["site","site"],["segmento","segmento"],
        ["resumo","resumo"],["nivel","nivel"],["patrocinador","patrocinador"],["evento_id","evento_id"]
      ], `empresas-app-${EVENTO}.xlsx`, "Empresas");
    }catch(e){ DS.avisar(explicar(e), {tom:"erro"}); }
    finally{ btn.disabled = false; btn.textContent = "Exportar Empresas"; }
  });

  $("#ia-exp-usuarios").addEventListener("click", async () => {
    const btn = $("#ia-exp-usuarios");
    btn.disabled = true; btn.textContent = "Gerando…";
    try{
      const dados = await rpc("admin_exportar_usuarios_app", { p_evento_slug: EVENTO });
      const semMapa = dados.filter(d => !d.mapeado).length;
      if(semMapa && !(await DS.confirmar(
          `${semMapa} pessoa(s) vão sair sem empresa vinculada no arquivo — a linha entra, só o vínculo com a empresa fica em branco. Prefere mapear antes?`,
          {titulo:"Exportar mesmo assim?", textoConfirmar:"Exportar assim mesmo"}))) return;
      exportar(dados, [
        ["name","name"],["cargo","cargo"],["email","email"],["cidade","cidade"],
        ["estado","estado"],["linkedin","linkedin"],["segmento","segmento"],
        ["telefone","telefone"],["empresa_id","empresa_id"],
        ["ramo_atividade","ramo_atividade"],["evento_id","evento_id"]
      ], `usuarios-app-${EVENTO}.xlsx`, "Usuarios");
    }catch(e){ DS.avisar(explicar(e), {tom:"erro"}); }
    finally{ btn.disabled = false; btn.textContent = "Exportar Usuários"; }
  });

  carregarMapa();
  atualizarResumoExport();
};

</script>
</body>
</html>
