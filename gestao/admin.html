<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--papel);color:var(--texto);
  font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}

.topo{background:var(--verde);color:#fff;padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.marca{font-family:'Archivo',sans-serif;font-weight:700;font-size:15.5px;}
.marca span{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;

.topo-dir{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.quem{font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.85;
  overflow-wrap:anywhere;min-width:0;}
.sair{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;

.sel-evento{

  font-family:inherit;max-width:260px;}
.sel-evento option{color:var(--texto);}
/* padrão = escopo "todos os eventos": mudança aqui vaza pra base toda,
   por isso o tom de --alerta (não --ouro, que tem significado próprio) —
   ver auditoria de UX (retorno de QA, 29/08/2026) */
.escopo-global{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:var(--alerta-bg,#FBF0DC);color:var(--alerta,#9C6413);border-radius:20px;
  padding:2px 9px;margin-left:8px;text-transform:uppercase;letter-spacing:.04em;}

/* modal de cobranca: DS.confirmar() e so pra sim/nao, aqui precisa de

.ac-modal{

  padding:22px 24px;box-shadow:0 20px 50px rgba(20,49,43,.25);
  max-height:85vh;overflow-y:auto;
}
.ac-modal h2{font-family:'Archivo',sans-serif;font-size:var(--tx-lg);margin:0 0 8px;color:var(--texto);}

   linhas / exigiam rolagem lateral. Pedido do Gerardo, 08/09/2026. */

  color:#fff;border-radius:var(--raio);width:34px;height:34px;flex:none;

  width:16px;height:2px;background:#fff;border-radius:2px;}

.menu-fundo{position:fixed;inset:0;background:rgba(15,30,26,.45);z-index:55;

<script>
// =====================================================================
// CONFIGURACAO
// =====================================================================
const SUPABASE_URL  = "https://jlvcjqfrsxxexflvwbvn.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdmNqcWZyc3h4ZXhmbHZ3YnZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY0NTAsImV4cCI6MjEwMTM1MjQ1MH0.SkY0N_k2oaYAqZUpZCmm0GBY3j8vsZzB5oX4Am75MnE";
// Evento ativo. Vem da URL na primeira carga e depois muda pelo
// seletor do cabecalho — as duas abas globais (Cadastro e Equipe)
// ignoram este valor.
let EVENTO = new URLSearchParams(location.search).get("evento") || "cerrado2027";

// Abas que NAO dependem do evento: a base de gestores e a equipe do
// painel valem para todas as edicoes.
const ABAS_GLOBAIS = ["cadastro", "equipe"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  db: { schema: "gestao" }
});

const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function aviso(alvo, texto, tipo="erro"){
  const el = typeof alvo === "string" ? $(alvo) : alvo;
  if(!el) return;
  el.innerHTML = texto ? `<div class="aviso ${tipo}">${esc(texto)}</div>` : "";
}

function explicar(e){
  const m = e?.message || String(e);
  if(m.includes("Email not confirmed"))
    return "Confirme seu e-mail antes de entrar — enviamos um link de confirmação. Não achou? Confira o spam ou peça pra reenviar.";
  if(m.includes("Invalid login credentials")) return "E-mail ou senha incorretos.";
  if(m.includes("Acesso restrito a administradores"))
    return "Esta ação exige perfil de administrador. Seu acesso é de staff.";
  if(m.includes("Acesso restrito"))  return "Seu e-mail não está cadastrado na equipe.";
  if(m.includes("JWT") || m.includes("session")) return "Sua sessão expirou. Entre novamente.";
  return m;
}

async function rpc(nome, params){
  const { data, error } = await sb.rpc(nome, params);
  if(error) throw error;
  return data;
}

const dataBR = d => d ? String(d).split("T")[0].split("-").reverse().join("/") : "—";
const moeda = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dataHora = d => d ? new Date(d).toLocaleString("pt-BR") : "—";

// timestamptz do banco -> valor de <input type="datetime-local">, que
// so aceita "YYYY-MM-DDTHH:MM" em hora LOCAL. Passar o ISO com Z faz o
// campo vir vazio, sem reclamar.
function paraInputHora(ts){
  if(!ts) return "";
  const d = new Date(ts);
  if(isNaN(d)) return "";
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 16);
}

// Hoje em ISO, para comparar com data que vem do banco como texto
// ("2026-09-01"). Comparar string com string evita o fuso: `new Date`
// num "YYYY-MM-DD" e lido como UTC e volta um dia atras no Brasil.
const HOJE_ISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
  .toISOString().slice(0, 10);

// Exporta qualquer lista para Excel, mantendo a ordem das colunas.
// O telefone e digitado a mao na planilha e chega em cinco formatos
// diferentes: "62985240212", "62 3333-4444", "(62) 99251-8766",
// "+55 62 99546-9620", "062984953347". Quem recebe a lista precisa
// discar, entao sai sempre como (DD) 9NNNN-NNNN.
//
// Se nao der para reconhecer o formato, devolve o original em vez de
// inventar: numero errado numa lista de contato e pior que numero feio.
function fone(v){
  if(!v) return "";
  let d = String(v).replace(/\D/g, "");
  if(d.length > 11 && d.startsWith("55")) d = d.slice(2);   // +55
  if(d.length === 12 && d.startsWith("0")) d = d.slice(1);  // 0DD
  if(d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return String(v).trim();
}

function exportar(linhas, colunas, nomeArquivo, nomeAba="Dados"){
  if(!linhas || linhas.length === 0){
    aviso("#aviso-global","Não há dados para exportar."); return;
  }
  const dados = linhas.map(l => {
    const o = {};
    colunas.forEach(([campo,titulo]) => o[titulo] = l[campo] ?? "");
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nomeAba);
  XLSX.writeFile(wb, nomeArquivo);
}

// LOGIN POR SENHA
//
// O magic link continua existindo, como saída de emergência: quem foi
// cadastrado pela organização e nunca entrou não tem senha ainda, e
// quem perde o acesso à caixa de e-mail no meio de um evento não pode
// ficar de fora. Senha é o caminho principal; link é o reserva.
//
// `resetPasswordForEmail` só funciona para quem JÁ existe no Auth —
// quem nunca entrou precisa de "Criar senha", que faz o signUp. Por
// isso os dois botões existem: são situações diferentes com a mesma
// aparência, e juntá-los num só deixaria metade das pessoas presa.
// =====================================================================
function _emailLogin(){
  const v = $("#email").value.trim();
  if(!v){ aviso("#login-aviso","Informe seu e-mail."); return null; }
  return v;
}

$("#btn-entrar").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(!senha){ aviso("#login-aviso","Informe sua senha."); return; }

  const btn = $("#btn-entrar");
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error) throw error;
    // o onAuthStateChange cuida de trocar para a tela do app
  }catch(e){
    aviso("#login-aviso", /invalid login/i.test(e.message || "")
      ? "E-mail ou senha não conferem. Se é seu primeiro acesso, use Criar senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

$("#btn-criar-senha").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(senha.length < 8){
    aviso("#login-aviso","Escolha uma senha de pelo menos 8 caracteres e clique em Criar senha.");
    return;
  }
  const btn = $("#btn-criar-senha");
  btn.disabled = true; btn.textContent = "Criando…";
  try{
    const { error } = await sb.auth.signUp({
      email, password: senha,
      options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso",
      "Senha criada. Se pedirmos confirmação, ela chega por e-mail — depois disso é só entrar.", "ok");
  }catch(e){
    aviso("#login-aviso", /already registered/i.test(e.message || "")
      ? "Esse e-mail já tem cadastro. Use Entrar, ou Esqueci minha senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Criar senha";
  }
});

$("#btn-esqueci").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const btn = $("#btn-esqueci");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.href
    });
    if(error) throw error;
    // A resposta é a mesma existindo ou não a conta, de propósito: dizer
    // "esse e-mail não existe" entrega quem está cadastrado a quem
    // estiver testando endereços.
    aviso("#login-aviso",
      "Se esse e-mail tiver cadastro, enviamos um link para definir a nova senha.", "ok");
  }catch(e){
    aviso("#login-aviso", explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Esqueci minha senha";
  }
});

// Volta do link de recuperação: o Supabase já deixou a sessão aberta,
// e o que falta é a pessoa escolher a senha nova. Sem isso ela entra,
// não troca nada, e no próximo acesso está travada de novo.
sb.auth.onAuthStateChange(async (evento) => {
  if(evento !== "PASSWORD_RECOVERY") return;
  const nova = prompt("Digite a nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada. Use ela no próximo acesso.", {tom: error ? "erro" : "ok"});
});

async function iniciar(){
  if(iniciado) return;
  iniciado = true;
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  $("#tela-login").classList.add("oculto");
  $("#app").classList.remove("oculto");
  $("#quem").textContent = user.email;

  $$(".aba").forEach(b => b.addEventListener("click", () => {
    irParaAba(b.dataset.aba, true);
    fecharMenu();
  }));

  // Cada topico abre/fecha os proprios subtopicos — so um aberto por vez,
  // igual gaveta de app mobile, pra nao virar uma lista comprida sem fim.
  $$(".aba-grupo-cab").forEach(cab => cab.addEventListener("click", () => {
    const grupo = cab.closest(".aba-grupo");
    const jaAberto = grupo.classList.contains("aberto");
    $$(".aba-grupo").forEach(g => { g.classList.remove("aberto"); $(".aba-grupo-cab", g).setAttribute("aria-expanded","false"); });
    if(!jaAberto){ grupo.classList.add("aberto"); cab.setAttribute("aria-expanded","true"); }
  }));

  $("#btn-menu").addEventListener("click", () => abrirMenu());
  $("#btn-menu-fechar").addEventListener("click", () => fecharMenu());
  $("#menu-fundo").addEventListener("click", () => fecharMenu());
  window.addEventListener("keydown", e => { if(e.key === "Escape") fecharMenu(); });

  // Voltar do navegador so mudava a URL — o conteudo ficava parado na
  // ultima aba, porque trocar de aba nunca empilhava historico nenhum.
  // Achado real do QA de usabilidade (Cowork, 29/08/2026).
  window.addEventListener("popstate", () => {
    irParaAba(location.hash.replace("#", "") || "painel", false);
  });

  await aplicarRestricoesPapel();
  await carregarSeletorEventos();
  irParaAba(location.hash.replace("#", "") || "painel", false);
  atualizarContadores();
}

// empilhar=true: veio de clique, cria uma parada nova no historico.
// empilhar=false: veio do proprio historico (voltar/avancar) ou da
// carga inicial — so troca o que esta na tela, sem empilhar de novo.
function irParaAba(nome, empilhar){
  if(typeof ABAS[nome] !== "function") nome = "painel";
  ABA_ATUAL = nome;
  $$(".aba").forEach(x => x.setAttribute("aria-selected", String(x.dataset.aba === nome)));
  sincronizarGrupoAberto(nome);
  if(empilhar){
    const u = new URL(location.href);
    u.hash = nome;
    history.pushState(null, "", u);
  }

  desenharAba(nome);
}

// Abre na gaveta o topico de onde a aba atual faz parte, pra quem
// reabrir o menu ver onde esta em vez de tudo recolhido de novo.
function sincronizarGrupoAberto(nome){
  $$(".aba-grupo").forEach(g => {
    const contem = !!$(`.aba[data-aba="${nome}"]`, g);
    g.classList.toggle("aberto", contem);
    $(".aba-grupo-cab", g).setAttribute("aria-expanded", String(contem));
  });
}

function abrirMenu(){
  $("#menu-nav").classList.add("aberto");
  $("#menu-fundo").classList.add("aberto");
  $("#btn-menu").setAttribute("aria-expanded", "true");
  document.body.style.overflow = "hidden";
}
function fecharMenu(){
  $("#menu-nav").classList.remove("aberto");
  $("#menu-fundo").classList.remove("aberto");
  $("#btn-menu").setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
}

let ABA_ATUAL = "painel";
let SOU_ADMIN = false;

// O backend ja recusa corretamente escrita fora do papel (_exige_admin
// na primeira linha de cada funcao) — isto e so a tela deixar de
// mostrar o que a pessoa nao pode usar. Staff via o menu inteiro
// (Financeiro, Precos, Equipe, a base real de Cadastro...) sem
// conseguir escrever em nada disso: achado real do QA de usabilidade.
const ABAS_SO_ADMIN = new Set([
  "aprovacoes","cadastro","patrocinadores","estrutura",
  "financeiro","precos","pesquisa","prospeccao","equipe","integracao-app"
]);

async function aplicarRestricoesPapel(){
  try{
    SOU_ADMIN = await rpc("is_admin");
  }catch(e){
    SOU_ADMIN = false;
  }
  if(SOU_ADMIN) return;

  ABAS_SO_ADMIN.forEach(nome => {
    const b = $(`.aba[data-aba="${nome}"]`);
    if(b) b.classList.add("oculto");
  });

  // grupo sem nenhuma aba visivel fica sem sentido — some o grupo
  // inteiro (rotulo incluso) em vez de deixar um titulo sem nada embaixo
  $$(".aba-grupo").forEach(grupo => {
    const temVisivel = $$(".aba", grupo).some(b => !b.classList.contains("oculto"));
    grupo.classList.toggle("oculto", !temVisivel);
  });
}

async function carregarSeletorEventos(){
  const sel = $("#sel-evento");
  try{
    const evs = await rpc("admin_listar_eventos");

    if(evs.length === 0){
      sel.innerHTML = `<option>Nenhum evento</option>`;
      sel.disabled = true;
      return;
    }

    // se a URL trouxe um slug que nao existe, cai no primeiro da lista
    // em vez de deixar todas as abas vazias sem explicar por que
    if(!evs.some(e => e.slug === EVENTO)) EVENTO = evs[0].slug;

    const rotulo = { rascunho:"rascunho", aberto:"aberto", encerrado:"encerrado" };
    sel.innerHTML = evs.map(e => `
      <option value="${esc(e.slug)}" ${e.slug === EVENTO ? "selected" : ""}>
        ${esc(e.nome)} · ${rotulo[e.status] || e.status}
      </option>`).join("");
    sel.disabled = false;

    sel.addEventListener("change", () => trocarEvento(sel.value));
  }catch(e){
    sel.innerHTML = `<option>${esc(EVENTO)}</option>`;
    sel.disabled = true;
  }
}

function trocarEvento(slug){
  EVENTO = slug;

  // mantem o link compartilhavel: quem copiar a URL abre no mesmo evento
  const u = new URL(location.href);
  u.searchParams.set("evento", slug);
  history.replaceState(null, "", u);

  aviso("#aviso-global", "");

  // as duas abas globais nao mudam de conteudo ao trocar de evento;
  // redesenhar seria so um piscar sem sentido
  if(!ABAS_GLOBAIS.includes(ABA_ATUAL)) desenharAba(ABA_ATUAL);
  atualizarContadores();
}

async function atualizarContadores(){
  try{
    const [pend, sug] = await Promise.all([
      rpc("admin_listar_pendentes", { p_evento_slug: EVENTO }),
      rpc("admin_listar_sugestoes", { p_status: "pendente" })
    ]);
    marcar("#c-aprov", pend.length);
    marcar("#c-sug",   sug.length);
  }catch(e){ /* contador e acessorio: nao bloqueia o painel */ }
}
function marcar(sel, n){
  const el = $(sel);
  el.textContent = n;
  el.classList.toggle("oculto", !n);
}

          <td class="meta">${ROTULO_PUBLICO[l.publico]}</td>
          <td>${esc(l.etapa_rotulo)}</td>
          <td class="meta">${dataBR(l.aberta_em)}</td>
          <td class="meta">${l.dias_em_aberto ?? "—"}</td>
          <td><span class="selo ${l.nivel === "atrasado" ? "erro" : l.nivel === "atencao" ? "alerta" : "ok"}">
                ${ROTULO_NIVEL[l.nivel]}</span></td>
          <td class="meta">${l.ultima_cobranca_em
                ? `<span class="selo pend">já cobrado</span><br>${dataBR(l.ultima_cobranca_em)}`

        : `<tr><td colspan="8" style="color:var(--suave)">Nada pendente com esse filtro.</td></tr>`;

      $$(".ac-cobrar").forEach(b => b.addEventListener("click", () => {
        const tr = b.closest("tr");
        abrirCobranca(tr.dataset.sujeito, tr.dataset.etapa, tr.dataset.quem, tr.dataset.etapaRotulo);
      }));
    }catch(e){ aviso("#ac-tabela", explicar(e)); }
  };

  const abrirCobranca = async (sujeitoId, etapaChave, quem, etapaRotulo) => {
    let draft;
    try{
      draft = await rpc("admin_preparar_cobranca", { p_sujeito_id: sujeitoId, p_etapa_chave: etapaChave });
    }catch(e){ DS.avisar(explicar(e), {tom:"erro"}); return; }

    const backdrop = document.createElement("div");
    backdrop.className = "ds-backdrop";
    const semDestinatario = !draft.destinatarios || draft.destinatarios.length === 0;
    backdrop.innerHTML = `
      <div class="ac-modal">
        <h2>Cobrar: ${esc(etapaRotulo)}</h2>
        <p class="meta" style="margin:0 0 14px;">
          ${esc(quem)}${draft.dias_em_aberto != null ? ` · ${draft.dias_em_aberto} dia(s) em aberto` : ""}
        </p>
        ${semDestinatario
          ? `<p style="color:var(--erro);">Nenhum e-mail de contato ativo encontrado para cobrar diretamente.</p>`
          : `
            <p class="meta">Para: ${draft.destinatarios.map(esc).join(", ")}</p>
            ${draft.ja_enviado_recentemente
              ? `<p class="meta" style="color:var(--alerta);">
                   Já foi cobrado nos últimos 3 dias (${dataBR(draft.ultimo_envio)}). Enviar de novo mesmo assim?
                 </p>` : ""}
            <label>Assunto</label>
            <input type="text" id="ac-m-assunto" value="${esc(draft.assunto)}">
            <label style="margin-top:10px;display:block;">Mensagem</label>
            <textarea id="ac-m-corpo" rows="6" style="width:100%;">${esc(draft.corpo)}</textarea>`}
        <div class="ds-modal-acoes" style="margin-top:16px;">
          <button type="button" class="btn sec" data-acao="cancelar">Cancelar</button>
          ${semDestinatario ? "" : `<button type="button" class="btn" data-acao="enviar">Enviar agora</button>`}
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    requestAnimationFrame(() => backdrop.classList.add("aberto"));

    const fechar = () => {
      backdrop.classList.remove("aberto");
      setTimeout(() => backdrop.remove(), 150);
    };
    backdrop.addEventListener("click", e => { if(e.target === backdrop) fechar(); });
    backdrop.querySelector('[data-acao="cancelar"]').addEventListener("click", fechar);

    const btnEnviar = backdrop.querySelector('[data-acao="enviar"]');
    if(btnEnviar) btnEnviar.addEventListener("click", async () => {
      const assunto = backdrop.querySelector("#ac-m-assunto").value.trim();
      const corpo = backdrop.querySelector("#ac-m-corpo").value.trim();
      if(!assunto || !corpo){ DS.avisar("Preencha assunto e mensagem.", {tom:"erro"}); return; }
      btnEnviar.disabled = true; btnEnviar.textContent = "Enviando…";
      try{
        const r = await rpc("admin_disparar_cobranca", {
          p_sujeito_id: sujeitoId, p_etapa_chave: etapaChave,
          p_assunto: assunto, p_corpo: corpo, p_forcar: !!draft.ja_enviado_recentemente
        });
        DS.avisar(
          `Enfileirado para ${r.enfileiradas} destinatário(s).` +
          (r.bloqueadas ? ` ${r.bloqueadas} bloqueado(s) por reenvio recente.` : ""),
          { tom: "ok" });
        fechar();
        carregarLista();
      }catch(e){
        DS.avisar(explicar(e), {tom:"erro"});
        btnEnviar.disabled = false; btnEnviar.textContent = "Enviar agora";
      }
    });
  };

  const carregarPrazos = async () => {
    const box = $("#ac-prazos");
    box.innerHTML = DS.skeletonLinhas(3);
    try{
      const prazos = await rpc("admin_listar_prazos", { p_evento_slug: EVENTO });
      box.innerHTML = `
        <div class="cartao" style="margin-top:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <h2 style="margin:0;">Prazos deste evento</h2>
            <button class="btn sec mini" id="ac-prazos-padrao">Aplicar padrão nas etapas sem prazo</button>
          </div>
          <p class="meta" style="margin-top:0;">
            Etapa desmarcada em "Ativa" não aparece pra ninguém neste evento — é assim que
            um evento sem hospedagem, por exemplo, fica sem a etapa de rooming.
          </p>
          <div class="rolagem"><table>
            <tr><th>Etapa</th><th>Público</th><th>Atenção (dias)</th><th>Atrasado (dias)</th><th>Ativa</th><th></th></tr>
            ${prazos.map(p => `<tr data-etapa="${esc(p.etapa_chave)}">
              <td>${esc(p.etapa_rotulo)}</td>
              <td class="meta">${ROTULO_PUBLICO[p.publico]}</td>
              <td><input type="number" min="0" class="pz-atencao" style="width:70px;"
                         value="${p.dias_atencao ?? ""}"
                         ${p.etapa_chave === "fatura_paga" ? "disabled placeholder=\"vencimento\"" : ""}></td>
              <td><input type="number" min="0" class="pz-atrasado" style="width:70px;"
                         value="${p.dias_atrasado ?? ""}"
                         ${p.etapa_chave === "fatura_paga" ? "disabled placeholder=\"vencimento\"" : ""}></td>
              <td><input type="checkbox" class="pz-ativo" ${p.ativo ? "checked" : ""}></td>
              <td><button class="btn sec mini pz-salvar">Salvar</button></td>
            </tr>`).join("")}
          </table></div>
        </div>`;

      $("#ac-prazos-padrao").addEventListener("click", async () => {
        try{
          const r = await rpc("admin_gerar_prazos_padrao", { p_evento_slug: EVENTO });
          DS.avisar(`${r.criados} prazo(s) criado(s) com o padrão.`, {tom:"ok"});
          carregarPrazos(); carregarResumo();
        }catch(e){ DS.avisar(explicar(e), {tom:"erro"}); }
      });

      $$(".pz-salvar").forEach(b => b.addEventListener("click", async () => {
        const tr = b.closest("tr");
        const atencao = tr.querySelector(".pz-atencao").value;
        const atrasado = tr.querySelector(".pz-atrasado").value;
        b.disabled = true;
        try{
          await rpc("admin_salvar_prazo", {
            p_evento_slug: EVENTO, p_etapa_chave: tr.dataset.etapa,
            p_dias_atencao: atencao === "" ? null : Number(atencao),
            p_dias_atrasado: atrasado === "" ? null : Number(atrasado),
            p_ativo: tr.querySelector(".pz-ativo").checked
          });
          DS.avisar("Prazo salvo.", {tom:"ok"});
          carregarResumo(); carregarLista();
        }catch(e){ DS.avisar(explicar(e), {tom:"erro"}); }
        finally{ b.disabled = false; }
      }));
    }catch(e){ aviso(box, explicar(e)); }
  };

  $("#ac-prazos-toggle").addEventListener("click", () => {
    const box = $("#ac-prazos");
    const abrindo = box.classList.contains("oculto");
    box.classList.toggle("oculto");
    if(abrindo && !box.dataset.carregado){
      box.dataset.carregado = "1";
      carregarPrazos();
    }
  });

  ["#ac-nivel","#ac-publico","#ac-etapa"].forEach(s => $(s).addEventListener("change", carregarLista));

  await carregarResumo();
  carregarLista();
};

ABAS.aprovacoes = async function(){
  const c = $("#conteudo");
  c.innerHTML = DS.skeletonCartoes(3);
  try{
    const [pend, indic] = await Promise.all([
      rpc("admin_listar_pendentes",  { p_evento_slug: EVENTO }),
      rpc("admin_listar_indicacoes", { p_evento_slug: EVENTO, p_status: "nova" })
    ]);

    c.innerHTML = `
      <h1>Aprovações</h1>
      <p class="sub">Cadastros aguardando decisão e indicações que ainda não viraram inscrição.</p>

      <h2>Aguardando aprovação</h2>
      <div class="cartao" id="box-pend">${pend.length ? "" :
        `<div class="vazio">Nada na fila. Novos cadastros aparecem aqui.</div>`}</div>

      <h2 style="margin-top:22px;">Indicações de patrocinadores</h2>
      <div class="cartao" id="box-indic">${indic.length ? "" :
        `<div class="vazio">Nenhuma indicação nova.</div>`}</div>`;

    if(pend.length) $("#box-pend").innerHTML = `<table>
      <tr><th>Nome</th><th>Empresa</th><th>Contato</th><th>Origem</th><th></th></tr>
      ${pend.map(p => `<tr data-id="${esc(p.participante_id)}">
        <td><strong>${esc(p.nome)}</strong><br><span class="meta">${esc(p.cargo||"")}</span></td>
        <td>${esc(p.empresa||"—")}</td>
        <td class="meta">${esc(p.email)}<br>${esc(p.telefone||"")}</td>
        <td><span class="selo pend">${esc(p.origem)}</span>
            ${p.indicado_por ? `<br><span class="meta">por ${esc(p.indicado_por)}</span>` : ""}</td>
        <td style="white-space:nowrap;">
          <button class="btn ok mini aprovar">Aprovar</button>
          <button class="btn perigo mini recusar">Recusar</button>
        </td></tr>`).join("")}</table>`;

    $$("#box-pend .aprovar").forEach(b => b.addEventListener("click", () => decidir(b, true)));
    $$("#box-pend .recusar").forEach(b => b.addEventListener("click", () => decidir(b, false)));

    if(indic.length) $("#box-indic").innerHTML = `<table>
      <tr><th>Indicado</th><th>Empresa</th><th>Contato</th><th>Indicado por</th><th></th></tr>
      ${indic.map(i => `<tr data-id="${esc(i.indicacao_id)}">
        <td><strong>${esc(i.nome)}</strong><br><span class="meta">${esc(i.cargo||"")}</span></td>
        <td>${esc(i.empresa||"—")}</td>
        <td class="meta">${esc(i.email||"sem e-mail")}<br>${esc(i.telefone||"")}</td>
        <td>${esc(i.patrocinador)}</td>
        <td><button class="btn mini converter" ${i.email ? "" : "disabled title='Indicação sem e-mail'"}>Criar inscrição</button></td>
      </tr>`).join("")}</table>`;

    $$("#box-indic .converter").forEach(b => b.addEventListener("click", async () => {
      const id = b.closest("tr").dataset.id;
      b.disabled = true; b.textContent = "Criando…";
      try{
        await rpc("admin_converter_indicacao", { p_indicacao_id: id });
        aviso("#aviso-global","Inscrição criada. Ela entra na fila de aprovação.","ok");
        ABAS.aprovacoes(); atualizarContadores();
      }catch(e){
        aviso("#aviso-global", explicar(e));
        b.disabled = false; b.textContent = "Criar inscrição";
      }
    }));
  }catch(e){ aviso(c, explicar(e)); }
};

async function decidir(btn, aprovado){
  const tr = btn.closest("tr");
  const id = tr.dataset.id;
  if(!aprovado && !(await DS.confirmar("O cadastro deixa de aparecer na fila de aprovação.", {titulo:"Recusar este cadastro?", tom:"perigo", textoConfirmar:"Recusar"}))) return;

  $$("button", tr).forEach(b => b.disabled = true);
  try{
    await rpc("admin_aprovar_participante",
      { p_participante_id: id, p_aprovado: aprovado });
    aviso("#aviso-global", aprovado
      ? "Aprovado. O contrato entra na fila de envio."
      : "Cadastro recusado.", "ok");
    ABAS.aprovacoes(); atualizarContadores();
  }catch(e){
    aviso("#aviso-global", explicar(e));
    $$("button", tr).forEach(b => b.disabled = false);
  }
}

      // a fila de sugestões pode ter crescido com esta importação
      carregarSugestoes();
      atualizarContadores();

      if(r.erros && r.detalhe_erros?.length){
        $("#imp-previa").innerHTML = `<table style="margin-top:10px;">
          <tr><th>Linha</th><th>Nome</th><th>Motivo</th></tr>
          ${r.detalhe_erros.map(d => `<tr>
            <td class="meta">${d.linha}</td><td>${esc(d.nome||"—")}</td>
            <td><span class="selo erro">${esc(d.motivo)}</span></td></tr>`).join("")}</table>`;
      }
      carregarGestores();
    }catch(e){
      aviso("#imp-aviso", explicar(e));
    }finally{
      btn.disabled = false; btn.textContent = "Importar";
    }
  });

  // ---------------------------------------------------------------
  // IMPORTAR INSCRITOS DO SYMPLA
  //
  // O export do Sympla tem ~100 colunas (UTM, user agent, respostas da
  // pesquisa inteira). Aqui só interessam as que identificam a pessoa
  // e dizem se a inscrição vale — o resto do questionário entra pela
  // aba Pesquisa, que é outro fluxo.
  // ---------------------------------------------------------------
  let SYMPLA = [];

  // O cabeçalho do Sympla vem com acento, maiúscula e às vezes
  // corrompido na exportação, então casa por prefixo sem acento.
  const acha = (linha, ...alternativas) => {
    const chaves = Object.keys(linha);
    for(const alvo of alternativas){
      const a = alvo.toLowerCase();
      const k = chaves.find(c => c.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]/g,"")
        .startsWith(a.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")));
      if(k && String(linha[k]).trim() !== "") return String(linha[k]).trim();
    }
    return "";
  };

  $("#arq-sympla").addEventListener("change", async ev => {
    const f = ev.target.files[0];
    if(!f) return;
    try{
      const wb  = XLSX.read(await f.arrayBuffer(), { type:"array" });
      const cru = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:"" });

      SYMPLA = cru.map(l => ({
        nome: [acha(l,"Nome"), acha(l,"Sobrenome")].filter(Boolean).join(" ").trim(),
        email: acha(l,"Email"),
        email_corporativo: acha(l,"E-MAIL CORPORATIVO","EMAIL CORPORATIVO"),
        empresa: acha(l,"Empresa"),
        cargo: acha(l,"Cargo"),
        telefone: acha(l,"Telefone Celular","Telefone"),
        cpf: acha(l,"CPF"),
        cnpj: acha(l,"CNPJ"),
        sympla_id: acha(l,"N ingresso","Numero ingresso","Ordem de inscricao"),
        tipo_ingresso: acha(l,"Tipo de ingresso"),
        estado_pagamento: acha(l,"Estado de pagamento")
      })).filter(l => l.nome || l.email);

      const aprov = SYMPLA.filter(l => l.estado_pagamento.toLowerCase()==="aprovado").length;
      const canc  = SYMPLA.filter(l => l.estado_pagamento.toLowerCase()==="cancelado").length;
      const outros = SYMPLA.length - aprov - canc;

      $("#sy-previa").innerHTML = `
        <p class="meta" style="margin-top:10px;">
          ${SYMPLA.length} linha(s) · <strong>${aprov} aprovado(s)</strong>
          ${canc ? ` · ${canc} cancelado(s)` : ""}${outros ? ` · ${outros} em outro estado` : ""}
        </p>
        <div class="rolagem" style="max-height:200px;margin-top:8px;">
          <table><tr><th>Nome</th><th>E-mail usado</th><th>Empresa</th><th>Pagamento</th></tr>
          ${SYMPLA.slice(0,15).map(l => `<tr>
            <td>${esc(l.nome||"—")}</td>
            <td class="meta">${esc(l.email_corporativo || l.email || "—")}</td>
            <td class="meta">${esc(l.empresa||"—")}</td>
            <td><span class="selo ${l.estado_pagamento.toLowerCase()==="aprovado"?"ok":"pend"}">${esc(l.estado_pagamento||"—")}</span></td>
          </tr>`).join("")}</table>
        </div>`;
      $("#btn-sympla").disabled = SYMPLA.length === 0;
      aviso("#sy-aviso","");
    }catch(e){
      aviso("#sy-aviso","Não foi possível ler o arquivo. Confira se é o export do Sympla.");
    }
  });

  $("#btn-sympla").addEventListener("click", async () => {
    const btn = $("#btn-sympla");
    btn.disabled = true; btn.textContent = "Importando…";
    try{
      const r = await rpc("admin_importar_participantes_sympla", {
        p_evento_slug: EVENTO, p_linhas: SYMPLA });
      aviso("#sy-aviso",
        `${r.criados} inscrito(s) novo(s), ${r.atualizados} atualizado(s)` +
        (r.cancelados ? `, ${r.cancelados} cancelado(s)` : "") +
        (r.gestores_novos ? ` · ${r.gestores_novos} entraram também no cadastro geral` : "") +
        (r.erros ? ` · ${r.erros} ignorado(s)` : "") + ".",
        r.erros ? "erro" : "ok");

      if(r.erros && r.detalhe_erros?.length){
        $("#sy-previa").innerHTML = `<table style="margin-top:10px;">
          <tr><th>Linha</th><th>Nome</th><th>Motivo</th></tr>
          ${r.detalhe_erros.map(d => `<tr>
            <td class="meta">${d.linha}</td><td>${esc(d.nome||"—")}</td>
            <td><span class="selo erro">${esc(d.motivo)}</span></td></tr>`).join("")}</table>`;
      }
      carregarGestores();
      atualizarContadores();
    }catch(e){ aviso("#sy-aviso", explicar(e)); }
    finally{ btn.disabled = false; btn.textContent = "Importar inscritos"; }
  });

  // ---------------------------------------------------------------
  // FILTROS
  //
  // As opcoes vem do banco, nao de lista fixa no HTML. O <select> de
  // perfil era escrito a mao aqui e ja estava incompleto: faltavam
  // TRANSICAO, CLIENTE e OPORTUNIDADE, que existem na base — quem
  // filtrasse por eles nao achava ninguem, sem saber por que.
  //
  // Segmento e a excecao ao "vem do que existe": ali a lista e fechada
  // (os 14 itens da planilha, na tabela `segmentos`) e o banco devolve
  // ate os que ainda nao tem ninguem.
  // ---------------------------------------------------------------
  const marcados = sel => {
    const el = $(sel);
    return el ? Array.from(el.selectedOptions).map(o => o.value) : [];
  };

  const carregarFiltros = async () => {
    try{
      const f = await rpc("admin_filtros_gestores", {});
      const encher = (sel, valores) => {
        const el = $(sel);
        if(!el) return;
        el.innerHTML = (valores||[])
          .map(o => `<option value="${esc(o.v)}">${esc(o.v)} (${o.n})</option>`).join("");
      };
      encher("#g-perfil",     f.perfis);
      encher("#g-segmento",   f.segmentos);
      encher("#g-cidade",     f.cidades);
      encher("#g-estado",     f.estados);
      encher("#g-posicao",    f.posicoes);
      encher("#emp-f-segmento", f.segmentos);
      encher("#emp-f-cidade",   f.cidades);
      encher("#emp-f-estado",   f.estados);
      encher("#emp-f-perfil",   f.perfis);

      // o formulario da empresa e escolha unica, e aceita vazio
      const sel = $("#emp-segmento");
      if(sel) sel.innerHTML = `<option value="">—</option>` +
        (f.segmentos||[]).map(o => `<option value="${esc(o.v)}">${esc(o.v)}</option>`).join("");
    }catch(e){ /* filtro e conveniencia: sem ele a busca livre ainda funciona */ }
  };

  // ---------------------------------------------------------------
  // EMPRESAS
  // ---------------------------------------------------------------
  let EMPRESAS_CACHE = [];

  const carregarEmpresas = async () => {
    $("#emp-tabela").innerHTML = `<tr><td colspan="99">${DS.skeletonLinhas(2)}</td></tr>`;
    try{
      EMPRESAS_CACHE = await rpc("admin_listar_empresas", {
        p_busca: $("#emp-busca").value || null,
        p_segmentos: marcados("#emp-f-segmento"),
        p_cidades:   marcados("#emp-f-cidade"),
        p_estados:   marcados("#emp-f-estado"),
        p_perfis:    marcados("#emp-f-perfil"),
        p_so_com_gestores: $("#emp-f-comgestor").checked,
        p_limite: 200, p_offset: 0
      });
      const totalEmp = EMPRESAS_CACHE.length ? Number(EMPRESAS_CACHE[0].total_geral) : 0;
      $("#emp-resumo").innerHTML = `<p class="meta">${totalEmp} empresa(s)` +
        (totalEmp > EMPRESAS_CACHE.length
          ? ` — mostrando as ${EMPRESAS_CACHE.length} primeiras.` : ".") + `</p>`;
      $("#emp-tabela").innerHTML = `
        <tr><th>Nome</th><th>Segmento</th><th>Cidade/UF</th><th>Gestores</th><th></th></tr>
        ${EMPRESAS_CACHE.map(e => `<tr>
          <td>${esc(e.nome)}</td>
          <td class="meta">${esc(e.segmento||"—")}</td>
          <td class="meta">${esc([e.cidade,e.estado].filter(Boolean).join("/")||"—")}</td>
          <td class="meta">${e.qtd_gestores}</td>
          <td style="white-space:nowrap;">
            <button class="btn sec mini emp-editar" data-id="${esc(e.id)}">Editar</button>
            <button class="btn sec mini emp-remover" data-id="${esc(e.id)}">Remover</button>
          </td></tr>`).join("") ||
        `<tr><td colspan="5" style="color:var(--suave)">Nenhuma empresa cadastrada ainda.</td></tr>`}`;

      $$("#emp-tabela .emp-editar").forEach(b => b.addEventListener("click", () => {
        const e = EMPRESAS_CACHE.find(x => x.id === b.dataset.id);
        $("#emp-id").value = e.id;
        $("#emp-nome").value = e.nome || "";
        $("#emp-cnpj").value = e.cnpj || "";
        $("#emp-segmento").value = e.segmento || "";
        $("#emp-cidade").value = e.cidade || "";
        $("#emp-estado").value = e.estado || "";
        $("#emp-site").value = e.site || "";
        $("#emp-cancelar").style.display = "";
        $("#emp-nome").scrollIntoView({ behavior:"smooth", block:"center" });
      }));
      $$("#emp-tabela .emp-remover").forEach(b => b.addEventListener("click", async () => {
        const e = EMPRESAS_CACHE.find(x => x.id === b.dataset.id);
        if(!(await DS.confirmar(`${e.qtd_gestores} gestor(es) vinculado(s) continuam existindo — só perdem o vínculo com esta empresa.`,
            {titulo:`Remover "${e.nome}"?`, tom:"perigo", textoConfirmar:"Remover"}))) return;
        try{
          await rpc("admin_remover_empresa", { p_id: e.id });
          carregarEmpresas(); carregarGestores();
        }catch(err){ aviso("#emp-aviso", explicar(err)); }
      }));
    }catch(e){ aviso("#emp-tabela", explicar(e)); }
  };

  $("#emp-busca").addEventListener("input", carregarEmpresas);
  ["#emp-f-segmento","#emp-f-cidade","#emp-f-estado","#emp-f-perfil","#emp-f-comgestor"]
    .forEach(s => $(s).addEventListener("change", carregarEmpresas));
  $("#emp-f-limpar").addEventListener("click", () => {
    $("#emp-busca").value = "";
    ["#emp-f-segmento","#emp-f-cidade","#emp-f-estado","#emp-f-perfil"].forEach(s =>
      Array.from($(s).options).forEach(o => o.selected = false));
    $("#emp-f-comgestor").checked = false;
    carregarEmpresas();
  });

  $("#emp-cancelar").addEventListener("click", () => {
    $("#emp-id").value = ""; $("#emp-nome").value = ""; $("#emp-cnpj").value = "";
    $("#emp-segmento").value = ""; $("#emp-cidade").value = ""; $("#emp-estado").value = "";
    $("#emp-site").value = ""; $("#emp-cancelar").style.display = "none";
  });

  $("#emp-nome").addEventListener("input", () => DS.limparInvalido($("#emp-nome")));

  $("#emp-salvar").addEventListener("click", async () => {
    if(!$("#emp-nome").value.trim()){
      DS.marcarInvalido($("#emp-nome"), "Informe o nome da empresa.");
      $("#emp-nome").focus();
      return;
    }
    const btn = $("#emp-salvar");
    btn.disabled = true;
    try{
      await rpc("admin_salvar_empresa", {
        p_nome: $("#emp-nome").value, p_id: $("#emp-id").value || null,
        p_cnpj: $("#emp-cnpj").value || null, p_site: $("#emp-site").value || null,
        p_segmento: $("#emp-segmento").value || null,
        p_cidade: $("#emp-cidade").value || null, p_estado: $("#emp-estado").value || null
      });
      $("#emp-cancelar").click();
      aviso("#emp-aviso", "Empresa salva.", "ok");
      carregarEmpresas();
    }catch(e){ aviso("#emp-aviso", explicar(e)); }
    finally{ btn.disabled = false; }
  });

  // ---------------------------------------------------------------
  // GRID DE GESTORES
  // ---------------------------------------------------------------
  let G_OFFSET = 0, G_TOTAL = 0;
  const G_PASSO = 100;
  let GESTORES_CACHE = [];

  const filtrosGestores = () => ({
    p_busca: $("#g-busca").value || null,
    p_perfis:    marcados("#g-perfil"),
    p_segmentos: marcados("#g-segmento"),
    p_cidades:   marcados("#g-cidade"),
    p_estados:   marcados("#g-estado"),
    p_posicoes:  marcados("#g-posicao"),
    // tres estados: vazio nao filtra, "sim" so quem tem, "nao" so quem
    // nao tem — e o null aqui e diferente de false
    p_com_email: $("#g-email").value === "" ? null : $("#g-email").value === "sim"
  });

  const carregarGestores = async () => {
    $("#g-tabela").innerHTML = `<tr><td colspan="99">${DS.skeletonLinhas(2)}</td></tr>`;
    try{
      GESTORES_CACHE = await rpc("admin_listar_gestores", {
        ...filtrosGestores(), p_limite: G_PASSO, p_offset: G_OFFSET
      });
      G_TOTAL = GESTORES_CACHE.length ? Number(GESTORES_CACHE[0].total_geral) : 0;

      $("#g-tabela").innerHTML = `
        <tr><th>Nome</th><th>Empresa</th><th>Cargo</th><th>E-mail</th><th>Perfil</th>
            <th>Segmento</th><th>Cidade/UF</th><th>LinkedIn</th><th></th></tr>
        ${GESTORES_CACHE.map(g => `<tr data-id="${esc(g.id)}">
          <td>${esc(g.nome)}</td>
          <td class="g-empresa-cel">${esc(g.empresa||"—")}
              ${g.empresa_id ? `<br><span class="selo ok" style="font-size:10px;">vinculado</span>` : ""}</td>
          <td class="meta">${esc(g.cargo||"—")}</td>
          <td class="meta">${g.email ? esc(g.email) : `<span class="selo pend">sem e-mail</span>`}</td>
          <td class="meta">${esc(g.perfil||"—")}</td>
          <td class="meta">${esc(g.segmento||"—")}</td>
          <td class="meta">${esc([g.cidade,g.estado].filter(Boolean).join("/")||"—")}</td>
          <td class="meta">${g.linkedin ? `<a href="${esc(g.linkedin)}" target="_blank" rel="noopener">perfil</a>` : "—"}</td>
          <td style="white-space:nowrap;">
            <button class="btn sec mini g-ia" title="Buscar dados profissionais na web">IA</button>
            <button class="btn sec mini g-editar">Editar</button>
            <button class="btn sec mini g-vincular">Vincular empresa</button>
          </td>
        </tr>`).join("") ||
        `<tr><td colspan="9" style="color:var(--suave)">Nenhum gestor com esse filtro.</td></tr>`}`;

      $("#g-resumo").innerHTML = `<p class="meta">${G_TOTAL} gestor(es) no filtro atual.</p>`;
      $("#g-paginacao").innerHTML = G_TOTAL > G_PASSO
        ? `Mostrando ${G_OFFSET+1}–${Math.min(G_OFFSET+G_PASSO, G_TOTAL)} de ${G_TOTAL}
           <button class="btn sec mini" id="g-anterior" ${G_OFFSET===0?"disabled":""}>Anterior</button>
           <button class="btn sec mini" id="g-proximo" ${G_OFFSET+G_PASSO>=G_TOTAL?"disabled":""}>Próxima</button>`
        : "";
      $("#g-anterior")?.addEventListener("click", () => { G_OFFSET = Math.max(0, G_OFFSET-G_PASSO); carregarGestores(); });
      $("#g-proximo")?.addEventListener("click", () => { G_OFFSET += G_PASSO; carregarGestores(); });

      $$("#g-tabela .g-vincular").forEach(b => b.addEventListener("click", async (ev) => {
        const tr = ev.target.closest("tr");
        const gid = tr.dataset.id;
        const nomeEmpresa = prompt("Nome da empresa (precisa já estar cadastrada acima):");
        if(nomeEmpresa === null) return;
        if(nomeEmpresa.trim() === ""){
          await rpc("admin_associar_gestor_empresa", { p_gestor_id: gid, p_empresa_id: null });
          carregarGestores(); return;
        }
        const achada = EMPRESAS_CACHE.find(e => e.nome.toLowerCase() === nomeEmpresa.trim().toLowerCase());
        if(!achada){
          DS.avisar(`"${nomeEmpresa}" não está na lista de empresas cadastradas acima. Cadastre primeiro ou confira a grafia.`, {tom:"erro"});
          return;
        }
        try{
          await rpc("admin_associar_gestor_empresa", { p_gestor_id: gid, p_empresa_id: achada.id });
          carregarGestores();
        }catch(e){ aviso("#g-resumo", explicar(e)); }
      }));

      $$("#g-tabela .g-editar").forEach(b => b.addEventListener("click", (ev) => {
        const gid = ev.target.closest("tr").dataset.id;
        const g = GESTORES_CACHE.find(x => x.id === gid);
        if(g) abrirEditarGestor(g);
      }));

      $$("#g-tabela .g-ia").forEach(b => b.addEventListener("click", async (ev) => {
        const btn = ev.target;
        const gid = btn.closest("tr").dataset.id;
        const g = GESTORES_CACHE.find(x => x.id === gid);
        if(!g) return;
        btn.disabled = true; btn.textContent = "…";
        try{
          const achou = await enriquecerUmGestor(g.id, g.nome, g.empresa);
          aviso("#aviso-global", achou
            ? `${g.nome}: ${achou} campo(s) atualizado(s).`
            : `Nada encontrado sobre ${g.nome}. Preencha à mão.`,
            achou ? "ok" : "erro");
          carregarGestores();
        }catch(e){
          aviso("#aviso-global", explicar(e));
          btn.disabled = false; btn.textContent = "IA";
        }
      }));
    }catch(e){ aviso("#g-tabela", explicar(e)); }
  };

  $("#g-busca").addEventListener("input", () => { G_OFFSET = 0; carregarGestores(); });
  ["#g-perfil","#g-segmento","#g-cidade","#g-estado","#g-posicao","#g-email"].forEach(s =>
    $(s).addEventListener("change", () => { G_OFFSET = 0; carregarGestores(); }));
  $("#g-limpar").addEventListener("click", () => {
    $("#g-busca").value = ""; $("#g-email").value = "";
    ["#g-perfil","#g-segmento","#g-cidade","#g-estado","#g-posicao"].forEach(s =>
      Array.from($(s).options).forEach(o => o.selected = false));
    G_OFFSET = 0; carregarGestores();
  });

  $("#g-exportar").addEventListener("click", async () => {
    const btn = $("#g-exportar");
    btn.disabled = true; btn.textContent = "Preparando…";
    try{
      let todos = [], offset = 0, total = null;
      while(total === null || offset < total){
        const p = await rpc("admin_listar_gestores", {
          ...filtrosGestores(), p_limite: 500, p_offset: offset
        });
        if(p.length === 0) break;
        if(total === null) total = Number(p[0].total_geral);
        todos = todos.concat(p);
        offset += 500;
      }
      exportar(todos.map(g => ({ ...g, telefone: fone(g.telefone) })), [
        ["nome","Nome"],["empresa","Empresa"],["cargo","Cargo"],["email","E-mail"],
        ["telefone","Telefone"],["segmento","Segmento"],["cidade","Cidade"],["estado","UF"],
        ["perfil","Perfil"],["posicao_gestor","Posição"],["linkedin","LinkedIn"]
      ], "gestores-cio-cerrado.xlsx", "Gestores");
    }finally{ btn.disabled = false; btn.textContent = "Exportar Excel"; }
  });

  $("#g-etiquetas").addEventListener("click", () => {
    // etiqueta simples (nome + empresa), sem numero de apto: fora de
    // um evento nao ha reserva nem quarto — a impressao rica fica na
    // aba Etiquetas, que e por evento
    if(!GESTORES_CACHE.length){ aviso("#g-resumo","Nada carregado para gerar etiqueta."); return; }
    exportar(GESTORES_CACHE, [["nome","NOME"],["empresa","EMPRESA"]],
      "etiquetas-gestores-cio-cerrado.xlsx", "Etiquetas");
  });

  carregarSugestoes();
  // os seletores primeiro: as duas listagens leem o que esta marcado
  // neles, e com <select> vazio a leitura da [] — que o banco entende
  // como "sem filtro", entao a primeira carga sai correta de todo jeito
  carregarFiltros();
  carregarEmpresas();
  carregarGestores();
};

// Painel de edição de um gestor — mesmo espírito do "Pessoas" dos
// quartos de equipe: abre embaixo da tabela, sem navegar pra outro lugar.
function abrirEditarGestor(g){
  const box = $("#g-detalhe");
  box.innerHTML = `
    <div class="cartao">
      <h2>Editar gestor</h2>
      <div class="barra">
        <div><label>Nome</label><input type="text" id="ge-nome" value="${esc(g.nome||"")}"></div>
        <div><label>E-mail</label><input type="email" id="ge-email" value="${esc(g.email||"")}"></div>
        <div><label>Cargo</label><input type="text" id="ge-cargo" value="${esc(g.cargo||"")}"></div>
        <div><label>Telefone</label><input type="text" id="ge-telefone" value="${esc(g.telefone||"")}"></div>
      </div>
      <div class="barra">
        <div><label>Empresa (texto livre)</label><input type="text" id="ge-empresa" value="${esc(g.empresa||"")}"></div>
        <div><label>Segmento</label><select id="ge-segmento"><option value="">—</option></select></div>
        <div><label>Cidade</label><input type="text" id="ge-cidade" value="${esc(g.cidade||"")}"></div>
        <div style="max-width:80px;"><label>UF</label><input type="text" id="ge-estado" maxlength="2" value="${esc(g.estado||"")}"></div>
      </div>
      <div class="barra">
        <div style="max-width:200px;"><label>Perfil</label><input type="text" id="ge-perfil" value="${esc(g.perfil||"")}"></div>
        <div><label>LinkedIn</label><input type="text" id="ge-linkedin" value="${esc(g.linkedin||"")}"></div>
      </div>
      <div id="ge-aviso"></div>
      <button class="btn" id="ge-salvar">Salvar</button>
      <button class="btn sec" id="ge-cancelar" style="margin-left:6px;">Cancelar</button>
    </div>`;
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });

  // mesma lista de segmentos que o formulario de empresa ja usa —
  // texto livre aqui viraria NULL sem aviso no proximo save (o
  // segmento so aceita o vocabulario fechado da tabela `segmentos`)
  const optsSegmento = $("#emp-segmento")?.innerHTML || `<option value="">—</option>`;

const ROTULO_SUG = {
  troca_empresa:"Trocou de empresa",
  novo_gestor:"Novo gestor",
  nova_empresa:"Empresa nova",
  dado_divergente:"Dado divergente"
};

// Nome do campo como a pessoa chama, não como a coluna se chama.
const CAMPO_HUMANO = {
  empresa:"a empresa", cargo:"o cargo", email:"o e-mail",
  telefone:"o telefone", segmento:"o segmento", cidade:"a cidade",
  estado:"o estado", cnpj:"o CNPJ", perfil:"o perfil",
  faturamento:"o faturamento", funcionarios:"o nº de funcionários",
  linkedin:"o LinkedIn"
};

// "De → para" numa coluna é curto demais para decidir: quem revisa
// precisa ler a mudança como frase, sem cruzar cabeçalho com célula.
function frameMudanca(s){
  const de   = (s.valor_atual   || "").trim();
  const para = (s.valor_sugerido|| "").trim();
  const campo = CAMPO_HUMANO[s.campo] || (s.campo ? `o campo ${s.campo}` : "o dado");

  if(s.tipo === "troca_empresa")
    return de
      ? `Saiu de <strong>${esc(de)}</strong> e foi para <strong>${esc(para)}</strong>`
      : `Passou a ter empresa <strong>${esc(para)}</strong>`;

  if(!de)   return `Vai preencher ${campo}, hoje vazio, com <strong>${esc(para)}</strong>`;
  if(!para) return `Vai apagar ${campo} (hoje <strong>${esc(de)}</strong>)`;
  return `Muda ${campo} de <strong>${esc(de)}</strong> para <strong>${esc(para)}</strong>`;
}

async function carregarSugestoes(){
  try{
    const sug = await rpc("admin_listar_sugestoes", { p_status:"pendente" });
    $("#box-sug").innerHTML = sug.length === 0
      ? `<div class="vazio">Nada para revisar agora.</div>`
      : `<table>
          <tr><th>Tipo</th><th>Quem</th><th>O que muda</th><th>Confiança</th><th>Origem</th><th></th></tr>
          ${sug.map(s => `<tr data-id="${esc(s.id)}">
            <td><span class="selo alerta">${esc(ROTULO_SUG[s.tipo]||s.tipo)}</span></td>
            <td><strong>${esc(s.gestor_nome||s.empresa||"—")}</strong></td>
            <td>${frameMudanca(s)}
                ${s.justificativa ? `<br><span class="meta">${esc(s.justificativa)}</span>` : ""}</td>
            <td class="confianca">${s.confianca != null ? s.confianca+"%" : "—"}</td>
            <td class="meta">${esc(s.fonte||"—")}</td>
            <td style="white-space:nowrap;">
              <button class="btn ok mini aplicar">Aprovar</button>
              <button class="btn sec mini ignorar">Ignorar</button>
            </td></tr>`).join("")}</table>`;

    $$("#box-sug .aplicar").forEach(b => b.addEventListener("click", () => revisar(b, true)));
    $$("#box-sug .ignorar").forEach(b => b.addEventListener("click", () => revisar(b, false)));
  }catch(e){ aviso("#box-sug", explicar(e)); }
}

async function revisar(btn, aprovar){
  const tr = btn.closest("tr");
  $$("button", tr).forEach(b => b.disabled = true);
  try{
    await rpc("admin_aplicar_sugestao",
      { p_sugestao_id: tr.dataset.id, p_aprovar: aprovar });
    tr.remove();
    atualizarContadores();
  }catch(e){
    aviso("#aviso-global", explicar(e));
    $$("button", tr).forEach(b => b.disabled = false);
  }
}

ABAS.quartos = async function(){

  c.innerHTML = DS.skeletonCartoes(3);
  try{
    const [pessoas, livres] = await Promise.all([
      rpc("admin_listar_alocacao", { p_evento_slug: EVENTO, p_apenas_sem_quarto:false }),
      rpc("admin_quartos_livres",  { p_evento_slug: EVENTO })
    ]);

    // agrupa por reserva: o quarto e da reserva, nao da pessoa
    const reservas = new Map();
    pessoas.forEach(p => {
      if(!reservas.has(p.reserva_id))
        reservas.set(p.reserva_id, {
          reserva_id:p.reserva_id, empresa:p.empresa, quarto_tipo:p.quarto_tipo,
          quarto_id:p.quarto_id, quarto_numero:p.quarto_numero, gente:[] });
      reservas.get(p.reserva_id).gente.push(p.nome);
    });
    const lista = [...reservas.values()];
    const semQuarto = lista.filter(r => !r.quarto_id).length;

    c.innerHTML = `
      <h1>Quartos</h1>
      <p class="sub">Inventário, quartos de equipe e a separação de quem fica em qual número.</p>
      ${SOU_ADMIN ? `
        <div id="bl-quartos">${DS.skeletonCartoes(1)}</div>
        <div id="bl-categorias"></div>
        <div id="bl-equipe"></div>
      ` : ""}

      <h2 style="margin-top:22px;">Separar quartos</h2>
      <p class="sub">${lista.length} reserva(s) · ${semQuarto} ainda sem número · ${livres.length} quarto(s) livre(s).</p>
      <div class="barra">
        <div><label>Buscar</label><input type="text" id="q-busca" placeholder="Empresa ou pessoa"></div>
        <div><label>Mostrar</label>
          <select id="q-filtro">
            <option value="">Todas as reservas</option>
            <option value="sem">Só as sem número</option>
          </select></div>
      </div>
      <div class="cartao"><div class="rolagem"><table id="q-tabela"></table></div></div>`;

    if(SOU_ADMIN){
      await blocoQuartos();
      await blocoCategorias();
      await blocoEquipe();
    }

    const opcoes = r => livres
      .map(l => `<option value="${esc(l.id)}">${esc(l.numero||"s/n")} · ${esc(l.tipo)} (${l.capacidade})</option>`)
      .join("");

    const desenhar = () => {
      const busca = $("#q-busca").value.toLowerCase();
      const so = $("#q-filtro").value;
      const vis = lista.filter(r =>
        (!busca || `${r.empresa} ${r.gente.join(" ")}`.toLowerCase().includes(busca)) &&
        (so !== "sem" || !r.quarto_id));

      $("#q-tabela").innerHTML = `
        <tr><th>Empresa</th><th>Pessoas</th><th>Tipo</th><th>Quarto</th></tr>
        ${vis.map(r => `<tr data-reserva="${esc(r.reserva_id)}">
          <td>${esc(r.empresa||"—")}</td>
          <td>${r.gente.map(esc).join("<br>")}</td>
          <td class="meta" style="text-transform:capitalize">${esc(r.quarto_tipo||"—")}</td>
          <td>
            ${r.quarto_id
              ? `<span class="selo ok">${esc(r.quarto_numero||"s/n")}</span>
                 <button class="btn sec mini soltar" style="margin-left:6px;">Liberar</button>`
              : `<select class="escolher"><option value="">— escolher —</option>${opcoes(r)}</select>`}
          </td></tr>`).join("") ||
        `<tr><td colspan="4" style="color:var(--suave)">Nenhuma reserva com esse filtro.</td></tr>`}`;

      $$("#q-tabela .escolher").forEach(s => s.addEventListener("change", () => alocar(s)));
      $$("#q-tabela .soltar").forEach(b => b.addEventListener("click", () => alocar(b, true)));
    };

    ["#q-busca","#q-filtro"].forEach(s => $(s).addEventListener("input", desenhar));
    desenhar();
  }catch(e){ aviso(c, explicar(e)); }
};

async function alocar(el, liberar=false){
  const reserva = el.closest("tr").dataset.reserva;
  const quarto  = liberar ? null : el.value;
  if(!liberar && !quarto) return;

  el.disabled = true;
  try{
    const r = await rpc("admin_alocar_quarto",
      { p_reserva_id: reserva, p_quarto_id: quarto });

    if(!r.ok){
      // o banco recusou por um motivo que a tela precisa explicar
      aviso("#aviso-global", r.motivo === "quarto_ocupado"
        ? "Esse quarto acabou de ser ocupado por outra reserva."
        : `Não cabe: a reserva tem ${r.ocupantes} pessoa(s) e o quarto comporta ${r.capacidade}.`);
    }
    ABAS.quartos();
  }catch(e){
    aviso("#aviso-global", explicar(e));
    el.disabled = false;
  }
}

      const t = b.closest("tr").dataset;
      $("#og-rotulo").value = t.rotulo;

async function salvarQuartoEquipe(){
  const rotulo = $("#og-rotulo").value.trim();
  if(!rotulo){
    DS.marcarInvalido($("#og-rotulo"), "Informe o time ou responsável.");
    $("#og-rotulo").focus();
    return;
  }
  DS.limparInvalido($("#og-rotulo"));

  const b = $("#og-salvar");
  const editando = b.dataset.editando || null;
  b.disabled = true; b.textContent = "Salvando…";
  try{
    await rpc("admin_salvar_quarto_equipe", {
      p_evento_slug: EVENTO,
      p_reserva_id: editando,
      p_rotulo: rotulo,
      p_tipo: $("#og-tipo").value
    });
    $("#og-rotulo").value = "";
    delete b.dataset.editando;
    blocoEquipe();
  }catch(e){ aviso("#og-aviso", explicar(e)); }
  finally{ b.disabled = false; b.textContent = "Salvar"; }
}

// Painel de pessoas de um quarto de equipe — mesmo espírito do rooming do
// patrocinador (nome, CPF, transfer por pessoa), só que quem edita é o
// admin, direto, sem depender do quarto já ter número.
function abrirPessoasEquipe(reg){
  const box = $("#og-detalhe");
  const CAP = 4;
  let pessoas = reg.ocupantes.length
    ? reg.ocupantes.map(o => ({...o}))
    : [{ nome:"", cpf:"", telefone:"", usa_transfer:false, transfer_origem:null }];

  const desenhar = () => {
    box.innerHTML = `
      <div class="cartao">
        <h2>Pessoas · ${esc(reg.rotulo||"—")}</h2>
        <p class="sub" style="margin-bottom:10px;">Até ${CAP} pessoa(s) por quarto.</p>
        ${pessoas.map((p,i) => `
          <div class="barra" data-i="${i}">
            <div style="min-width:180px;"><label>Nome</label>
              <input type="text" class="og-p-nome" value="${esc(p.nome||"")}"></div>
            <div style="max-width:150px;"><label>CPF</label>
              <input type="text" class="og-p-cpf" value="${esc(p.cpf||"")}"></div>
            <div style="max-width:150px;"><label>Telefone</label>
              <input type="text" class="og-p-tel" value="${esc(p.telefone||"")}"></div>
            <div class="check" style="align-self:end;padding-bottom:8px;">
              <input type="checkbox" class="og-p-transfer" ${p.usa_transfer ? "checked":""}> Usa transfer</div>
            <div style="max-width:140px;"><label>Origem</label>
              <select class="og-p-origem" ${p.usa_transfer ? "" : "disabled"}>
                <option value="">—</option>
                <option value="GYN" ${p.transfer_origem==="GYN"?"selected":""}>Goiânia</option>
                <option value="BSB" ${p.transfer_origem==="BSB"?"selected":""}>Brasília</option>
              </select></div>
            <div style="min-width:auto;align-self:end;">
              <button class="btn perigo mini og-p-remover">Remover</button></div>
          </div>`).join("")}
        <button class="btn sec mini" id="og-p-add" ${pessoas.length >= CAP ? "disabled" : ""}>+ Pessoa</button>
        <div id="og-p-aviso" style="margin-top:8px;"></div>
        <button class="btn" id="og-p-salvar" style="margin-top:8px;">Salvar pessoas</button>
      </div>`;

    $$(".og-p-transfer", box).forEach(el => el.addEventListener("change", e => {
      const sel = e.target.closest(".barra").querySelector(".og-p-origem");
      sel.disabled = !e.target.checked;
      if(!e.target.checked) sel.value = "";
    }));

    $$(".og-p-remover", box).forEach(el => el.addEventListener("click", () => {
      const i = Number(el.closest(".barra").dataset.i);
      pessoas.splice(i,1);
      if(pessoas.length === 0) pessoas.push({ nome:"", cpf:"", telefone:"", usa_transfer:false, transfer_origem:null });
      desenhar();
    }));

    $("#og-p-add").addEventListener("click", () => {
      pessoas.push({ nome:"", cpf:"", telefone:"", usa_transfer:false, transfer_origem:null });
      desenhar();
    });

    $("#og-p-salvar").addEventListener("click", async () => {
      const linhas = [...box.querySelectorAll(".barra")].map(l => ({
        nome: l.querySelector(".og-p-nome").value.trim(),
        cpf: l.querySelector(".og-p-cpf").value.trim() || null,
        telefone: l.querySelector(".og-p-tel").value.trim() || null,
        usa_transfer: l.querySelector(".og-p-transfer").checked,
        transfer_origem: l.querySelector(".og-p-origem").value || null
      })).filter(p => p.nome);

      const b = $("#og-p-salvar");
      b.disabled = true; b.textContent = "Salvando…";
      try{
        await rpc("admin_salvar_ocupantes_equipe", {
          p_reserva_id: reg.reserva_id,
          p_ocupantes: linhas
        });
        aviso("#aviso-global", `Pessoas de "${reg.rotulo}" salvas.`, "ok");
        blocoEquipe();
      }catch(e){ aviso("#og-p-aviso", explicar(e)); b.disabled = false; b.textContent = "Salvar pessoas"; }
    });
  };

  desenhar();
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

};

// Excel de etiquetas com o QR de verdade dentro da celula. O xlsx
// (SheetJS) que o resto do sistema usa nao grava imagem em planilha na
// edicao gratuita — so por isso o exceljs entra aqui, so pra este botao.
async function exportarEtiquetasComQR(lista){
  if(typeof ExcelJS === "undefined"){
    DS.avisar("Gerador de Excel com imagem não carregou. Recarregue a página.", {tom:"erro"});
    return;
  }
  if(typeof window.QRCode !== "function"){
    DS.avisar("Gerador de QR não carregou. Recarregue a página.", {tom:"erro"});
    return;
  }

  const temp = document.createElement("div");
  temp.style.cssText = "position:fixed;left:-9999px;top:-9999px;";
  document.body.appendChild(temp);

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Etiquetas");
  ws.columns = [
    { header:"APTO", key:"apto", width:10 },
    { header:"NOME", key:"nome", width:32 },
    { header:"EMPRESA", key:"empresa", width:28 },
    { header:"CATEGORIA", key:"categoria", width:16 },
    { header:"QR", key:"qr", width:14 }
  ];

  for(let i = 0; i < lista.length; i++){
    const e = lista[i];
    ws.addRow({ apto:e.apto||"", nome:e.nome, empresa:e.empresa||"", categoria:e.categoria }).height = 66;

    const div = document.createElement("div");
    temp.appendChild(div);
    // eslint-disable-next-line no-new
    new QRCode(div, { text: e.pessoa_key, width:110, height:110, correctLevel: QRCode.CorrectLevel.M });
    await new Promise(r => setTimeout(r, 0));
    const canvasEl = div.querySelector("canvas");
    const base64 = canvasEl ? canvasEl.toDataURL("image/png").split(",")[1] : null;
    if(base64){
      const imgId = wb.addImage({ base64, extension:"png" });
      // linha 1 e o cabecalho — a linha de dados i (0-indexada) cai na
      // linha i+2 da planilha, que e indice i+1 no sistema 0-indexado
      // de coordenadas do addImage
      ws.addImage(imgId, { tl:{ col:4, row:i+1 }, ext:{ width:60, height:60 } });
    }
  }
  temp.remove();

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "etiquetas-com-qr-cio-cerrado.xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Gera o QR de cada cracha na propria pagina (biblioteca ja carregada
// aqui) e manda so a imagem pronta (data URL) pra janela de impressao —
// assim a janela nova nao depende de carregar script nenhum, so imprime.
async function imprimirCrachas(lista){
  if(typeof window.QRCode !== "function"){
    DS.avisar("Gerador de QR não carregou. Recarregue a página.", {tom:"erro"});
    return;
  }
  const temp = document.createElement("div");
  temp.style.cssText = "position:fixed;left:-9999px;top:-9999px;";
  document.body.appendChild(temp);

  const cartoes = [];
  for(const e of lista){
    const div = document.createElement("div");
    temp.appendChild(div);
    // eslint-disable-next-line no-new
    new QRCode(div, { text: e.pessoa_key, width: 130, height: 130, correctLevel: QRCode.CorrectLevel.M });
    // qrcodejs desenha de forma sincrona em canvas na maioria dos
    // navegadores; um tick garante que o canvas ja existe antes do toDataURL
    await new Promise(r => setTimeout(r, 0));
    const canvasEl = div.querySelector("canvas");
    const src = canvasEl ? canvasEl.toDataURL("image/png") : div.querySelector("img")?.src;
    cartoes.push({ ...e, qr: src });
  }
  temp.remove();

  const win = window.open("", "_blank");
  if(!win){ DS.avisar("O navegador bloqueou a janela de impressão — permita pop-ups para este site.", {tom:"erro"}); return; }

  win.document.write(`<!doctype html><html><head><meta charset="utf-8">
    <title>Crachás — CIO Cerrado</title>
    <style>
      body{font-family:'Public Sans',Arial,sans-serif;margin:0;padding:16px;}
      .grade{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
      .cracha{
        border:1px solid #ccc;border-radius:8px;padding:14px;
        display:flex;align-items:center;gap:12px;break-inside:avoid;
        page-break-inside:avoid;
      }
      .cracha img{width:80px;height:80px;flex:none;}
      .cracha .info{overflow:hidden;}
      .cracha .nome{font-weight:700;font-size:15px;margin:0 0 2px;}
      .cracha .empresa{font-size:12.5px;color:#555;margin:0 0 4px;}
      .cracha .categoria{font-size:10px;text-transform:uppercase;letter-spacing:.04em;
        color:#387828;font-weight:600;}
      .cracha .apto{font-size:11px;color:#888;}
      @media print{ .grade{gap:6px;} .cracha{border-color:#999;} }
    </style></head><body>
    <div class="grade">
      ${cartoes.map(c => `<div class="cracha">
        ${c.qr ? `<img src="${c.qr}" alt="">` : ""}
        <div class="info">
          <p class="nome">${esc(c.nome)}</p>
          <p class="empresa">${esc(c.empresa||"")}</p>
          <p class="categoria">${esc(c.categoria)}</p>
          ${c.apto ? `<p class="apto">Apto ${esc(c.apto)}</p>` : ""}
        </div>
      </div>`).join("")}
    </div>
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

const ROTULO_BRINDE = {
  prometido: "A enviar", enviado: "A caminho", recebido: "No resort",
  entregue:  "Entregue", cancelado: "Cancelado"
};
const PROXIMO_BRINDE = { prometido: "recebido", enviado: "recebido", recebido: "entregue" };

ABAS.brindes = async function(){
  const c = $("#conteudo");
  c.innerHTML = `
    <h1>Brindes</h1>
    <p class="sub">
      Cada empresa pode ter mais de um brinde (tipo diferente, cada um com seu status).
      Destino: fica no stand ou é entregue no quarto — entrega no quarto é serviço do
      resort e entra na fatura do patrocinador. Aqui a organização confere a chegada e a entrega.
    </p>
    <div id="br-resumo"></div>
    <div class="barra">
      <div style="max-width:200px;"><label>Situação</label>
        <select id="br-status">
          <option value="">Todas</option>
          <option value="prometido">A enviar</option>
          <option value="enviado">A caminho</option>
          <option value="recebido">No resort</option>
          <option value="entregue">Entregue</option>
          <option value="cancelado">Cancelado</option>
        </select></div>
      <div style="min-width:auto;"><button class="btn sec" id="br-exportar">Exportar Excel</button></div>
    </div>
    <div id="br-aviso"></div>
    <div class="cartao"><div class="rolagem"><table id="br-tabela"></table></div></div>`;

  let BR = [];

  const carregar = async () => {
    $("#br-tabela").innerHTML = `<tr><td colspan="99">${DS.skeletonLinhas(2)}</td></tr>`;
    try{
      const [lista, resumo] = await Promise.all([
        rpc("admin_listar_brindes", {
          p_evento_slug: EVENTO,
          p_status: $("#br-status").value || null,
          p_limite: 500, p_offset: 0
        }),
        rpc("admin_brindes_resumo", { p_evento_slug: EVENTO })
      ]);
      BR = lista;

      $("#br-resumo").innerHTML = Number(resumo.total)
        ? `<div class="cartao"><p class="meta" style="margin:0;">
             <strong style="font-size:15px;color:var(--verde);">${resumo.total}</strong> brinde(s)
             de ${resumo.empresas} empresa(s) ·
             ${resumo.prometido} a enviar · ${resumo.enviado} a caminho ·
             ${resumo.recebido} no resort · ${resumo.entregue} entregue(s)
             ${Number(resumo.no_quarto) ? ` · <strong>${resumo.no_quarto} para entrega no quarto</strong>` : ""}
             ${Number(resumo.cancelado) ? ` · ${resumo.cancelado} cancelado(s)` : ""}
           </p></div>`
        : `<div class="cartao"><p class="meta" style="margin:0;">
             Nenhum patrocinador marcou brinde ainda.</p></div>`;

      $("#br-tabela").innerHTML = BR.length ? `
        <tr><th>Empresa</th><th>Destino</th><th>Brinde</th><th>Volumes</th><th>Rastreio</th>
            <th>Situação</th><th></th></tr>
        ${BR.map(b => `<tr data-id="${esc(b.brinde_id)}" data-status="${esc(b.status)}">
          <td><strong>${esc(b.empresa)}</strong><br>
              <span class="meta">${esc(b.cota||"—")}</span></td>
          <td>${b.destino === "quarto"
                 ? `<span class="selo vez">no quarto</span><br><span class="meta">${b.quartos} quarto(s)</span>`
                 : `<span class="meta">stand</span>`}</td>
          <td>${esc(b.descricao||"—")}${b.quantidade ? ` <span class="meta">×${b.quantidade}</span>` : ""}
              ${b.observacao ? `<br><span class="meta">${esc(b.observacao)}</span>` : ""}</td>
          <td class="meta">${b.volumes_despachados ?? "—"}</td>
          <td class="meta">${b.rastreio
               ? `${esc(b.rastreio)}<br>${esc(b.transportadora||"")}`
               : "—"}</td>
          <td><span class="selo ${b.status==="entregue"||b.status==="recebido" ? "ok" : "pend"}">
                ${ROTULO_BRINDE[b.status]||esc(b.status)}</span>
              ${b.recebido_em ? `<br><span class="meta">${dataBR(b.recebido_em)} · ${esc(b.recebido_por||"")}</span>` : ""}
              ${b.entregue_em ? `<br><span class="meta">entregue ${dataBR(b.entregue_em)}</span>` : ""}</td>
          <td style="white-space:nowrap;">
            ${PROXIMO_BRINDE[b.status]

        const tr = b.closest("tr");
        b.disabled = true;
        await marcar(tr.dataset.id, PROXIMO_BRINDE[tr.dataset.status]);
      }));

      // aceitava erro de digitação, não mostrava onde o brinde está, e
      // oferecia como "novidade" o estado em que ele já se encontra.
      $$(".br-mudar").forEach(b => b.addEventListener("click", () => {

        sel.addEventListener("change", () => {

          else sel.remove();
        });
        // clicar fora sem escolher nada fecha, em vez de deixar o
        // seletor pendurado na linha
        sel.addEventListener("blur", () => setTimeout(() => sel.remove(), 150));
      }));
    }catch(e){ aviso("#br-tabela", explicar(e)); }
  };

  const marcar = async (id, status) => {
    try{
      await rpc("admin_marcar_brinde", { p_brinde_id: id, p_status: status, p_observacao: null });
      aviso("#br-aviso", "", "ok");
      carregar();
    }catch(e){ aviso("#br-aviso", explicar(e)); }
  };

  $("#br-status").addEventListener("change", carregar);
  $("#br-exportar").addEventListener("click", () => exportar(BR,
    [["empresa","EMPRESA"],["cota","COTA"],["destino","DESTINO"],["quartos","QUARTOS"],["descricao","BRINDE"],
     ["quantidade","QUANTIDADE"],["volumes_despachados","VOLUMES DESPACHADOS"],
     ["transportadora","TRANSPORTADORA"],["rastreio","RASTREIO"],["status","SITUACAO"],
     ["recebido_em","RECEBIDO EM"],["recebido_por","RECEBIDO POR"],
     ["entregue_em","ENTREGUE EM"],["observacao","OBSERVACAO"]],
    "brindes-cio-cerrado.xlsx", "Brindes"));

  carregar();
};

        const r = await rpc("admin_sortear_sessao", { p_sessao_id: tr.dataset.id });
        aviso("#sg-aviso", `${r.sorteados} convidado(s) sorteado(s).`, "ok");
        ABAS.sessoes();
      }catch(e){ aviso("#sg-aviso", explicar(e)); b.disabled = false; b.textContent = "Sortear"; }
    }));

    ligarGerarSessoes();
  }catch(e){ aviso(c, explicar(e)); }
};

async function abrirSessao(id, s){
  const box = $("#s-detalhe");
  box.innerHTML = DS.skeletonCartoes(3);
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });

  try{
    const [dentro, sugeridos] = await Promise.all([
      rpc("admin_convidados_sessao", { p_sessao_id: id }),
      rpc("admin_match_jantar", { p_sessao_id: id, p_limite: 20 })
    ]);

    box.innerHTML = `
      <h2 style="margin-top:22px;">${esc(s.patrocinador)} · ${esc(String(s.tipo).replace("_"," "))}</h2>
      <p class="sub">${dentro.length} de ${s.vagas} vaga(s) preenchida(s).</p>

      <div class="cartao">
        <h2>Confirmados</h2>
        ${dentro.length ? `<table>
          <tr><th>Nome</th><th>Empresa</th><th>Identificação</th><th>Como entrou</th><th></th></tr>
          ${dentro.map(d => `<tr data-p="${esc(d.participante_id)}">
            <td>${esc(d.nome)}<br><span class="meta">${esc(d.cargo||"")}</span></td>
            <td>${esc(d.empresa||"—")}</td>
            <td>${d.rotulo ? `<span class="selo alerta">${esc(d.rotulo)}</span>` : `<span class="meta">—</span>`}</td>
            <td class="meta">${esc(d.origem)}${d.aderencia!=null?` · ${d.aderencia}%`:""}</td>
            <td><button class="btn perigo mini tirar">Remover</button></td>
          </tr>`).join("")}</table>
          <button class="btn sec mini" id="s-mailing" style="margin-top:10px;">Exportar mailing</button>` :
          `<div class="vazio">Ninguém confirmado ainda.</div>`}
      </div>

      <div class="cartao">
        <h2>Sugestões por aderência</h2>
        <p class="sub" style="margin-bottom:10px;">
          Cruzamento por segmento, porte e o que o patrocinador vende. Confira antes de confirmar.
        </p>
        ${sugeridos.length ? `<table>
          <tr><th>Nome</th><th>Empresa</th><th>Segmento</th><th>Porte</th><th>Aderência</th><th></th></tr>
          ${sugeridos.map(g => `<tr data-p="${esc(g.participante_id)}" data-ad="${g.aderencia}">
            <td>${esc(g.nome)}</td><td>${esc(g.empresa||"—")}</td>
            <td class="meta">${esc(g.segmento||"—")}</td>
            <td class="meta">${esc(g.faturamento||"—")}</td>
            <td><span class="selo ${g.aderencia>=50?"ok":"pend"}">${g.aderencia}%</span></td>
            <td><button class="btn mini por">Adicionar</button></td>
          </tr>`).join("")}</table>` :
          `<div class="vazio">Sem sugestões disponíveis — todos já estão em outra sessão deste tipo.</div>`}
      </div>

      <div class="cartao">
        <h2>Adicionar outro convidado</h2>
        <p class="sub" style="margin-bottom:10px;">
          Sem cálculo de aderência — para quem não apareceu na lista acima.
        </p>
        <div class="barra">
          <div><label>Nome</label><input type="text" id="sv-nome"></div>
          <div><label>Empresa</label><input type="text" id="sv-empresa"></div>
          <div><label>Cargo</label><input type="text" id="sv-cargo"></div>
        </div>
        <div class="barra">
          <div><label>E-mail</label><input type="email" id="sv-email"></div>
          <div><label>Telefone</label><input type="text" id="sv-telefone"></div>
          <div><label>Identificação</label><input type="text" id="sv-rotulo" placeholder="ex.: vegetariano"></div>
        </div>
        <div id="sv-aviso"></div>
        <button class="btn sec" id="sv-salvar" style="margin-top:8px;">Adicionar convidado</button>
      </div>`;

    const bm = $("#s-mailing", box);
    if(bm) bm.addEventListener("click", async () => {
      try{
        const l = await rpc("admin_mailing_sessao", { p_sessao_id: id });
        exportar(l, [["nome","Nome"],["cargo","Cargo"],["empresa","Empresa"],
          ["email","E-mail"],["telefone","Telefone"],["rotulo","Identificação"]],
          `Mailing_${String(s.patrocinador).replace(/\W+/g,"_")}.xlsx`, "Mailing");
      }catch(e){ aviso("#aviso-global", explicar(e)); }
    });

    $$(".tirar", box).forEach(b => b.addEventListener("click", async () => {
      b.disabled = true;
      try{
        await rpc("admin_remover_convidado_sessao",
          { p_sessao_id:id, p_participante_id: b.closest("tr").dataset.p });
        abrirSessao(id, s); ABAS.sessoes();
      }catch(e){ aviso("#aviso-global", explicar(e)); b.disabled = false; }
    }));

    $$(".por", box).forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      b.disabled = true; b.textContent = "Adicionando…";
      try{
        await rpc("admin_adicionar_convidado_sessao", {
          p_sessao_id: id,
          p_participante_id: tr.dataset.p,
          p_aderencia: Number(tr.dataset.ad) || null
        });
        abrirSessao(id, s);
      }catch(e){
        aviso("#aviso-global", explicar(e));
        b.disabled = false; b.textContent = "Adicionar";
      }
    }));

    $("#sv-salvar", box).addEventListener("click", async () => {
      const nome = $("#sv-nome", box).value.trim();
      if(!nome){
        DS.marcarInvalido($("#sv-nome", box), "Informe o nome.");
        $("#sv-nome", box).focus();
        return;
      }
      DS.limparInvalido($("#sv-nome", box));
      const b = $("#sv-salvar", box);
      b.disabled = true; b.textContent = "Adicionando…";
      try{
        await rpc("admin_convidado_avulso", {
          p_sessao_id: id,
          p_nome: nome,
          p_empresa: $("#sv-empresa", box).value.trim() || null,
          p_email: $("#sv-email", box).value.trim() || null,
          p_telefone: $("#sv-telefone", box).value.trim() || null,
          p_cargo: $("#sv-cargo", box).value.trim() || null,
          p_rotulo: $("#sv-rotulo", box).value.trim() || null
        });
        abrirSessao(id, s); ABAS.sessoes();
      }catch(e){
        aviso("#sv-aviso", explicar(e));
        b.disabled = false; b.textContent = "Adicionar convidado";
      }
    });
  }catch(e){ aviso(box, explicar(e)); }
}
