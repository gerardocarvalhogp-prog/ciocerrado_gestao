<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--papel);color:var(--texto);
  font-family:'Public Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;}

.topo{background:var(--verde);color:#fff;padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.marca{font-family:'Archivo',sans-serif;font-weight:700;font-size:15.5px;}
.marca span{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;}
.topo-dir{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.quem{font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.85;
  overflow-wrap:anywhere;min-width:0;}
.sair{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:var(--raio);padding:4px 10px;font-size:12px;}

.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 80px;}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--linha);
  margin-bottom:22px;overflow-x:auto;}
.aba{background:none;border:none;border-bottom:2px solid transparent;
  padding:9px 13px;font-size:13.5px;color:var(--suave);white-space:nowrap;}
.aba[aria-selected="true"]{color:var(--verde);border-bottom-color:var(--verde);font-weight:600;}

h1{font-family:'Archivo',sans-serif;font-size:21px;margin:0 0 3px;letter-spacing:-.015em;}
h2{font-family:'Archivo',sans-serif;font-size:16px;margin:0 0 8px;}
.sub{color:var(--suave);font-size:13px;margin:0 0 18px;}

.cartao-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.barra{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;}
.barra > div{min-width:150px;}

label{display:block;font-size:11.5px;color:var(--suave);margin-bottom:3px;}
input[type=text],input[type=email],input[type=date],input[type=file],select{
  width:100%;padding:7px 9px;border:1px solid var(--linha);border-radius:var(--raio);
  font-family:inherit;font-size:13.5px;background:var(--superficie);color:var(--texto);}
.check{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--texto);}
.check input{width:auto;margin:0;}

.btn{background:var(--verde);color:#fff;border:none;border-radius:var(--raio);
  padding:8px 14px;font-size:13.5px;font-weight:500;}
.btn:hover{background:#0E241F;}
.btn:disabled{background:#A9B5B0;cursor:not-allowed;}
.btn.sec{background:transparent;color:var(--verde);border:1px solid var(--linha);}
.btn.sec:hover{background:#F1F3EE;}
.btn.perigo{background:transparent;color:var(--erro);border:1px solid #E4CFCB;}
.btn.ok{background:var(--verde-med);}
/* dentro do modal (DS.confirmar) o botão de perigo precisa ser sólido,
   não o outline que .btn.perigo já tem nesta página — especificidade
   maior só aqui, sem tocar o CSS compartilhado (outra tarefa mexe nele
   em paralelo, em admin.html). */
.ds-modal .btn.perigo{background:var(--erro);color:#fff;border:none;}
.ds-modal .btn.perigo:hover{background:#7F281E;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--suave);
  border-bottom:1px solid var(--linha);padding:7px 6px;}
td{padding:7px 6px;border-bottom:1px solid #F0F1EC;vertical-align:top;}
.rolagem{max-height:480px;overflow:auto;}

/* linha inteira clicável nas tabelas de seleção (prospecção, busca no
   cadastro) — a caixinha de 13px era o único alvo de clique antes disso */
tr.linha-clique{cursor:pointer;}
tr.linha-clique:hover{background:#F4F6F1;}
tr.linha-clique.marcada{background:rgba(56,120,40,.09);}
tr.linha-clique.marcada:hover{background:rgba(56,120,40,.14);}

.selo{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;
  border-radius:20px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.selo.ok{background:#E4F0EA;color:var(--verde-med);}
.selo.pend{background:#EFEFEA;color:var(--suave);}
.selo.alerta{background:#F7EFD9;color:var(--ouro);}
.selo.erro{background:#FBF0EE;color:var(--erro);}

.aviso{border-radius:var(--raio);padding:10px 12px;font-size:13px;margin-bottom:12px;
  border:1px solid var(--linha);background:var(--superficie);}
.aviso.erro{background:#FBF0EE;border-color:#E4CFCB;color:var(--erro);}
.aviso.ok{background:#E8F2EC;border-color:#C9E0D4;color:var(--verde-med);}
.vazio{border:1px dashed var(--linha);border-radius:var(--raio);padding:22px;
  text-align:center;color:var(--suave);font-size:13.5px;}
.carregando{color:var(--suave);font-size:13px;padding:18px 0;}
.oculto{display:none !important;}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--suave);}
.login{max-width:380px;margin:12vh auto;padding:0 20px;}
.login h1{font-size:20px;}
.voltar{background:none;border:none;color:var(--verde);text-decoration:underline;
  font-size:13px;padding:0;margin-bottom:14px;}

/* Navegacao entre as telas da equipe. Cada tela e um .html isolado —
   sem isto, trocar de tela exigia saber a URL de cor. */
.ir-para{display:flex;gap:2px;align-items:center;}
.ir-para a{color:rgba(255,255,255,.75);text-decoration:none;font-size:12.5px;
  padding:4px 9px;border-radius:var(--raio);white-space:nowrap;}
.ir-para a:hover{background:rgba(255,255,255,.12);color:#fff;}
.ir-para a[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff;font-weight:600;}
</style>
</head>
<body>

<div id="tela-login" class="login">
  <div class="cartao">
    <h1>Jantares CIO Cerrado</h1>
    <p class="sub">Acesso restrito à equipe. Entre com seu e-mail.</p>
    <div id="login-aviso"></div>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="email">
    <div style="margin-top:11px;">
      <label for="senha" style="margin-top:10px;">Senha</label>
      <input type="password" id="senha" placeholder="sua senha" autocomplete="current-password">
      <button class="btn" id="btn-entrar" style="width:100%;margin-top:12px;">Entrar</button>
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:10px;">
        <button class="btn sec mini" id="btn-esqueci">Esqueci minha senha</button>
        <button class="btn sec mini" id="btn-criar-senha">Criar senha</button>

      <p class="meta" style="margin-top:12px;">
        Primeiro acesso? Use <strong>Criar senha</strong> com o e-mail que a
        organização cadastrou. Se preferir entrar sem senha,
        <a href="#" id="link-otp">receba um link por e-mail</a>.
      </p>
    </div>
  </div>
</div>

<div id="app" class="oculto">
  <header class="topo">
    <div class="marca">CIO Cerrado<span>Jantares</span></div>
    <nav class="ir-para" aria-label="Trocar de tela"><a href="admin.html">Painel</a><a href="jantares.html" aria-current="page">Jantares</a><a href="checkin.html">Check-in</a></nav>
    <div class="topo-dir">
      <span class="quem" id="quem"></span>
      <button class="sair" id="btn-senha" title="Trocar minha senha">Senha</button>
      <button class="sair" id="btn-sair">Sair</button>
    </div>
  </header>
  <div class="wrap">
    <div class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="agenda" aria-selected="true">Agenda</button>
      <button class="aba" role="tab" data-aba="sondagem" aria-selected="false">Sondagem</button>
      <button class="aba" role="tab" data-aba="estatisticas" aria-selected="false">Estatísticas</button>
    </div>
    <div id="aviso-global"></div>
    <div id="conteudo">
      <div class="skeleton skeleton-cartao" style="margin-bottom:8px;"></div>
      <div class="skeleton skeleton-cartao" style="margin-bottom:8px;"></div>
      <div class="skeleton skeleton-cartao"></div>
    </div>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACAO
// =====================================================================
const SUPABASE_URL  = "https://jlvcjqfrsxxexflvwbvn.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdmNqcWZyc3h4ZXhmbHZ3YnZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY0NTAsImV4cCI6MjEwMTM1MjQ1MH0.SkY0N_k2oaYAqZUpZCmm0GBY3j8vsZzB5oX4Am75MnE";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { db: { schema: "gestao" } });

const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function aviso(alvo, texto, tipo="erro"){
  const el = typeof alvo === "string" ? $(alvo) : alvo;
  if(!el) return;
  el.innerHTML = texto ? `<div class="aviso ${tipo}">${esc(texto)}</div>` : "";
}
function explicar(e){
  const m = e?.message || String(e);
  if(m.includes("Acesso restrito a administradores"))
    return "Esta ação exige perfil de administrador.";
  if(m.includes("Acesso restrito")) return "Seu e-mail não está cadastrado na equipe.";
  if(m.includes("JWT") || m.includes("session")) return "Sua sessão expirou. Entre novamente.";
  return m;
}
async function rpc(nome, params){
  const { data, error } = await sb.rpc(nome, params);
  if(error) throw error;
  return data;
}
async function ia(prompt, { buscarWeb=false, json=false, maxTokens=2000 } = {}){
  const { data, error } = await sb.functions.invoke("ia", {
    body: { prompt, buscar_web: buscarWeb, json, max_tokens: maxTokens } });
  if(error) throw new Error(error.message || "Falha ao chamar a IA.");
  if(data?.erro) throw new Error(data.erro);
  return json ? data.dados : data.texto;
}
const dataBR = d => d ? String(d).split("T")[0].split("-").reverse().join("/") : "—";

// O telefone e digitado a mao na planilha e chega em cinco formatos
// diferentes: "62985240212", "62 3333-4444", "(62) 99251-8766",
// "+55 62 99546-9620", "062984953347". Quem recebe o mailing precisa
// discar, entao sai sempre como (DD) 9NNNN-NNNN.
//
// Se nao der para reconhecer o formato, devolve o original em vez de
// inventar: numero errado no mailing e pior que numero feio.
function fone(v){
  if(!v) return "";
  let d = String(v).replace(/\D/g, "");
  if(d.length > 11 && d.startsWith("55")) d = d.slice(2);   // +55
  if(d.length === 12 && d.startsWith("0")) d = d.slice(1);  // 0DD
  if(d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return String(v).trim();
}

function exportar(linhas, colunas, nomeArquivo, nomeAba="Dados"){
  if(!linhas || linhas.length === 0){ aviso("#aviso-global","Não há dados para exportar."); return; }
  const dados = linhas.map(l => { const o={}; colunas.forEach(([c,t])=>o[t]=l[c]??""); return o; });
  const ws = XLSX.utils.json_to_sheet(dados);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nomeAba);
  XLSX.writeFile(wb, nomeArquivo);
}

// =====================================================================
// LOGIN / BOOT
// =====================================================================
// =====================================================================
// LOGIN POR SENHA
//
// O magic link continua existindo, como saída de emergência: quem foi
// cadastrado pela organização e nunca entrou não tem senha ainda, e
// quem perde o acesso à caixa de e-mail no meio de um evento não pode
// ficar de fora. Senha é o caminho principal; link é o reserva.
//
// `resetPasswordForEmail` só funciona para quem JÁ existe no Auth —
// quem nunca entrou precisa de "Criar senha", que faz o signUp. Por
// isso os dois botões existem: são situações diferentes com a mesma
// aparência, e juntá-los num só deixaria metade das pessoas presa.
// =====================================================================
function _emailLogin(){
  const v = $("#email").value.trim();
  if(!v){ aviso("#login-aviso","Informe seu e-mail."); return null; }
  return v;
}

$("#btn-entrar").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(!senha){ aviso("#login-aviso","Informe sua senha."); return; }

  const btn = $("#btn-entrar");
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error) throw error;
    // o onAuthStateChange cuida de trocar para a tela do app
  }catch(e){
    aviso("#login-aviso", /invalid login/i.test(e.message || "")
      ? "E-mail ou senha não conferem. Se é seu primeiro acesso, use Criar senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

$("#btn-criar-senha").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(senha.length < 8){
    aviso("#login-aviso","Escolha uma senha de pelo menos 8 caracteres e clique em Criar senha.");
    return;
  }
  const btn = $("#btn-criar-senha");
  btn.disabled = true; btn.textContent = "Criando…";
  try{
    const { error } = await sb.auth.signUp({
      email, password: senha,
      options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso",
      "Senha criada. Se pedirmos confirmação, ela chega por e-mail — depois disso é só entrar.", "ok");
  }catch(e){
    aviso("#login-aviso", /already registered/i.test(e.message || "")
      ? "Esse e-mail já tem cadastro. Use Entrar, ou Esqueci minha senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Criar senha";
  }
});

$("#btn-esqueci").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const btn = $("#btn-esqueci");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.href
    });
    if(error) throw error;
    // A resposta é a mesma existindo ou não a conta, de propósito: dizer
    // "esse e-mail não existe" entrega quem está cadastrado a quem
    // estiver testando endereços.
    aviso("#login-aviso",
      "Se esse e-mail tiver cadastro, enviamos um link para definir a nova senha.", "ok");
  }catch(e){
    aviso("#login-aviso", explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Esqueci minha senha";
  }
});

$("#link-otp").addEventListener("click", async (ev) => {
  ev.preventDefault();
  const email = _emailLogin(); if(!email) return;
  try{
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso","Link enviado. Abra seu e-mail para entrar.", "ok");
  }catch(e){ aviso("#login-aviso", explicar(e)); }
});

$("#senha").addEventListener("keydown", e => {
  if(e.key === "Enter") $("#btn-entrar").click();
});

// Volta do link de recuperação: o Supabase já deixou a sessão aberta,
// e o que falta é a pessoa escolher a senha nova. Sem isso ela entra,
// não troca nada, e no próximo acesso está travada de novo.
sb.auth.onAuthStateChange(async (evento) => {
  if(evento !== "PASSWORD_RECOVERY") return;
  const nova = prompt("Digite a nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada. Use ela no próximo acesso.", {tom: error ? "erro" : "ok"});
});

async function trocarMinhaSenha(){
  const nova = prompt("Nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada.", {tom: error ? "erro" : "ok"});
}
$("#email").addEventListener("keydown", e => { if(e.key==="Enter") $("#btn-entrar").click(); });
$("#btn-senha").addEventListener("click", trocarMinhaSenha);

$("#btn-sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

let iniciado = false;
sb.auth.onAuthStateChange(ev => {
  if(ev === "SIGNED_OUT"){ location.reload(); return; }
  if(!iniciado) iniciar();
});
(async () => { const { data } = await sb.auth.getSession(); if(data?.session) iniciar(); })();

async function iniciar(){
  if(iniciado) return; iniciado = true;
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;
  $("#tela-login").classList.add("oculto");
  $("#app").classList.remove("oculto");
  $("#quem").textContent = user.email;

  $$(".aba").forEach(b => b.addEventListener("click", () => {
    $$(".aba").forEach(x => x.setAttribute("aria-selected", x === b));
    ABAS[b.dataset.aba]();
  }));
  ABAS.agenda();
}

const ABAS = {};

// =====================================================================
// ABA: AGENDA
// =====================================================================
ABAS.agenda = async function(){
  const c = $("#conteudo");
  c.innerHTML = DS.skeletonCartoes(3);
  try{
    const l = await rpc("jantar_listar", {});

    c.innerHTML = `
      <h1>Agenda de jantares</h1>
      <p class="sub">${l.length} jantar(es) cadastrado(s).</p>

      <div class="cartao">
        <h2>Novo jantar</h2>
        <div class="barra">
          <div><label>Patrocinador</label><input type="text" id="j-patro"></div>
          <div><label>Site</label><input type="text" id="j-site"></div>
          <div style="max-width:150px;"><label>Data</label><input type="date" id="j-data"></div>
          <div style="max-width:100px;"><label>Horário</label><input type="text" id="j-hora" placeholder="20:00"></div>
        </div>
        <div class="barra">
          <div><label>Local</label><input type="text" id="j-local"></div>
          <div style="max-width:110px;"><label>Capacidade</label><input type="text" id="j-cap" placeholder="8"></div>
          <div><label>Perfil de convidado desejado</label>
            <input type="text" id="j-perfil" placeholder="Ex.: indústrias com faturamento acima de 1 Bi"></div>
        </div>
        <div class="barra">
          <div style="min-width:100%;"><label>Observações</label><input type="text" id="j-obs"></div>
        </div>
        <div id="j-aviso"></div>
        <button class="btn" id="j-salvar">Criar jantar</button>
      </div>

      <div class="cartao">
        <div class="rolagem"><table>
          <tr><th>Data</th><th>Patrocinador</th><th>Local</th><th>Convidados</th><th>Status</th><th></th></tr>
          ${l.map(j => `<tr>
            <td class="meta">${dataBR(j.data)}${j.horario ? " "+String(j.horario).slice(0,5) : ""}</td>
            <td><strong>${esc(j.patrocinador)}</strong></td>
            <td class="meta">${esc(j.local||"—")}</td>
            <td><span class="selo ${Number(j.confirmados)>=j.capacidade?"ok":"pend"}">${j.confirmados}/${j.capacidade}</span>
                ${j.compareceram ? `<br><span class="meta">${j.compareceram} compareceu</span>` : ""}</td>
            <td><span class="selo ${j.status==="realizado"?"ok":j.status==="cancelado"?"erro":"alerta"}">${esc(j.status)}</span></td>
            <td style="white-space:nowrap;">
              <button class="btn sec mini abrir" data-id="${esc(j.id)}">Abrir</button>
              ${(j.status !== "realizado" && j.status !== "cancelado")
                ? `<button class="btn sec mini cancelar" data-id="${esc(j.id)}"
                     data-nome="${esc(j.patrocinador)}">Cancelar</button>` : ""}
            </td>
          </tr>`).join("") || `<tr><td colspan="6" style="color:var(--suave)">Nenhum jantar ainda.</td></tr>`}
        </table></div>
      </div>`;

    }));
  }catch(e){ aviso(c, explicar(e)); }

// Convidados vindos do export do Sympla daquele jantar especifico ---
// mesmo formato de planilha do importador do evento principal (aba
// Cadastro do admin.html), mesma logica de casamento por e-mail.
let JANTAR_SYMPLA = [];

// O cabecalho do Sympla vem com acento, maiuscula e as vezes corrompido
// na exportacao, entao casa por prefixo sem acento.
const DIACRITICOS = new RegExp(String.fromCharCode(91) + String.fromCharCode(768) + String.fromCharCode(45) + String.fromCharCode(879) + String.fromCharCode(93), "g");
const achaSympla = (linha, ...alternativas) => {
  const chaves = Object.keys(linha);
  for(const alvo of alternativas){
    const a = alvo.toLowerCase();
    const k = chaves.find(c => c.toLowerCase()
      .normalize("NFD").replace(DIACRITICOS,"")
      .replace(/[^a-z0-9]/g,"")
      .startsWith(a.normalize("NFD").replace(DIACRITICOS,"").replace(/[^a-z0-9]/g,"")));
    if(k && String(linha[k]).trim() !== "") return String(linha[k]).trim();
  }
  return "";
};

async function lerPlanilhaSympla(ev){
  const f = ev.target.files[0];
  if(!f) return;
  try{
    const wb  = XLSX.read(await f.arrayBuffer(), { type:"array" });
    const cru = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:"" });

    JANTAR_SYMPLA = cru.map(l => ({
      nome: [achaSympla(l,"Nome"), achaSympla(l,"Sobrenome")].filter(Boolean).join(" ").trim(),
      email: achaSympla(l,"Email"),
      email_corporativo: achaSympla(l,"E-MAIL CORPORATIVO","EMAIL CORPORATIVO"),
      empresa: achaSympla(l,"Empresa"),
      cargo: achaSympla(l,"Cargo"),
      telefone: achaSympla(l,"Telefone Celular","Telefone"),
      cpf: achaSympla(l,"CPF"),
      cnpj: achaSympla(l,"CNPJ"),
      sympla_id: achaSympla(l,"N ingresso","Numero ingresso","Ordem de inscricao"),
      estado_pagamento: achaSympla(l,"Estado de pagamento")
    })).filter(l => l.nome || l.email);

    const aprov = JANTAR_SYMPLA.filter(l => l.estado_pagamento.toLowerCase()==="aprovado").length;
    const canc  = JANTAR_SYMPLA.filter(l => l.estado_pagamento.toLowerCase()==="cancelado").length;
    const outros = JANTAR_SYMPLA.length - aprov - canc;

    $("#js-previa").innerHTML = `
      <p class="meta" style="margin-top:10px;">
        ${JANTAR_SYMPLA.length} linha(s) · <strong>${aprov} aprovado(s)</strong>
        ${canc ? ` · ${canc} cancelado(s)` : ""}${outros ? ` · ${outros} em outro estado` : ""}
      </p>
      <div class="rolagem" style="max-height:200px;margin-top:8px;">
        <table><tr><th>Nome</th><th>E-mail usado</th><th>Empresa</th><th>Pagamento</th></tr>
        ${JANTAR_SYMPLA.slice(0,15).map(l => `<tr>
          <td>${esc(l.nome||"—")}</td>
          <td class="meta">${esc(l.email_corporativo || l.email || "—")}</td>
          <td class="meta">${esc(l.empresa||"—")}</td>
          <td><span class="selo ${l.estado_pagamento.toLowerCase()==="aprovado"?"ok":"pend"}">${esc(l.estado_pagamento||"—")}</span></td>
        </tr>`).join("")}</table>
      </div>`;
    $("#js-importar").disabled = JANTAR_SYMPLA.length === 0;
    aviso("#js-aviso","");
  }catch(e){
    aviso("#js-aviso","Não foi possível ler o arquivo. Confira se é o export do Sympla.");
  }
}

async function rodarProspeccaoJantar(){
  const btn = $("#pr-rodar");
  btn.disabled = true;
  const status = t => $("#pr-status").innerHTML = `<p class="carregando">${esc(t)}</p>`;

  try{
    status("Buscando empresas na base…");
    // J.id null = sondagem avulsa (aba Sondagem): jantar_base aceita
    // null e passa a analisar a base inteira, sem excluir "quem ja
    // esta neste jantar" — que e o certo quando jantar nao existe
    let base = await rpc("jantar_base", {
      p_jantar_id: J.id || null,
      p_excluir_fornecedores: $("#pr-forn").checked,
      p_excluir_convidados: $("#pr-hist").checked,
      p_limite: 500
    });

    if(base.length === 0){
      $("#pr-status").innerHTML = "";
      aviso("#pr-aviso","Nenhuma empresa nova com esses filtros.");
      btn.disabled = false; return;
    }

    const abr = $("#pr-abr").value.trim();
    if(abr){
      status(`Interpretando a abrangência "${abr}"…`);
      const pares = [...new Set(base.map(e => `${(e.cidade||"").trim()}|${(e.estado||"").trim()}`))]
        .filter(p => p !== "|");
      if(pares.length){
        try{
          const idx = await ia(
            `Abrangência geográfica desejada (texto do organizador do evento): "${abr}"\\n\\n` +
            `Lista de localidades (indice: cidade|UF):\\n` +
            pares.map((p,i) => `${i}: ${p}`).join("\\n") +
            `\\n\\nQuais índices pertencem a essa abrangência? Interprete com bom senso: ` +
            `"e região"/"entorno" inclui a região metropolitana e municípios vizinhos; ` +
            `siglas como BSB = Brasília; "todo o Brasil" = todos. ` +
            `Responda APENAS um array JSON de índices, sem markdown. Ex.: [0,3,7]`,
            { json: true, maxTokens: 1500 });
          const ok = new Set((Array.isArray(idx)?idx:[]).map(Number)
            .map(i => pares[i]).filter(Boolean).map(p => p.toUpperCase()));
          if(ok.size) base = base.filter(e =>
            ok.has(`${(e.cidade||"").trim()}|${(e.estado||"").trim()}`.toUpperCase()));
        }catch(e){
          const a = abr.toUpperCase();
          base = base.filter(e => {
            const cid=(e.cidade||"").trim().toUpperCase(), est=(e.estado||"").trim().toUpperCase();
            return (cid && a.includes(cid)) || (est && a.includes(est));
          });
        }
      }
    }

    if(base.length === 0){
      $("#pr-status").innerHTML = "";
      aviso("#pr-aviso",`Nenhuma empresa dentro de "${abr}".`);
      btn.disabled = false; return;
    }

    status(`Pesquisando o perfil de ${J.patrocinador_nome}…`);
    let perfil = J.patrocinador_nome + (J.patrocinador_site ? " — "+J.patrocinador_site : "");
    try{
      perfil = await ia(
        `Pesquise a empresa "${J.patrocinador_nome}"${J.patrocinador_site ? ` (site: ${J.patrocinador_site})` : ""} ` +
        `e responda em no máximo 120 palavras: o que ela vende, principais serviços/produtos, ` +
        `e que perfil de cliente empresarial ela busca. Responda só o texto, sem preâmbulo.`,
        { buscarWeb:true, maxTokens:600 });
    }catch(e){ status(`Não consegui pesquisar na web. Seguindo com o cadastro.`); }

    const soPriv = $("#pr-priv").checked, incHib = $("#pr-hib").checked;
    const regraIncluir = soPriv
      ? (incHib ? '- incluir=true para privadas e híbridas; incluir=false para públicas.'
                : '- incluir=true somente para privadas; false para híbridas e públicas.')
      : '- incluir=true para todas.';

    const LOTE=12, nLotes=Math.ceil(base.length/LOTE), saida=[];
    for(let i=0;i<nLotes;i++){
      status(`Analisando aderência — lote ${i+1} de ${nLotes} (${base.length} empresas)…`);
      const chunk = base.slice(i*LOTE,(i+1)*LOTE);
      const lista = chunk.map((e,j)=>`${j}|${e.empresa}|seg:${e.segmento||"?"}|fat:${e.faturamento||"?"}|func:${e.funcionarios||"?"}`).join("\\n");
      const prompt = `Você é analista de prospecção B2B.

PATROCINADOR (quem vai oferecer o jantar): ${J.patrocinador_nome}
Perfil: ${perfil}
${J.perfil_convidado ? "Perfil de convidado desejado: "+J.perfil_convidado : ""}
${$("#pr-fatmin").value.trim() ? "Faturamento mínimo desejado: "+$("#pr-fatmin").value.trim() : ""}
${$("#pr-obs").value.trim() ? "Observações do organizador: "+$("#pr-obs").value.trim() : ""}

REGRAS DE CLASSIFICAÇÃO:
- natureza "privada": empresa privada comum.
- natureza "hibrida": Sistema S (SENAI/SESI/SESC/SEBRAE/SEST SENAT), serviços sociais autônomos, fundações/associações privadas ligadas a estatais, fundos de pensão, capital misto.
- natureza "publica": órgãos de governo, autarquias, tribunais, ministérios, forças armadas, estatais puras, organismos internacionais.
${regraIncluir}
- score 0-100 = aderência comercial entre a empresa e o que o patrocinador vende.

EMPRESAS (indice|nome|dados):
${lista}

Responda APENAS um array JSON, sem markdown, um objeto por empresa:
[{"i":0,"natureza":"privada","incluir":true,"score":85,"just":"máx 15 palavras"}]`;

      let arr=[];
      try{ arr = await ia(prompt,{json:true,maxTokens:2000}) || []; }catch(e){ arr=[]; }
      chunk.forEach((e,j) => {
        const m = (Array.isArray(arr)?arr:[]).find(x=>x.i===j) || {};
        saida.push({...e, natureza:m.natureza||"privada", incluir:m.incluir!==false,
          score:Math.max(0,Math.min(100,Number(m.score)||50)), just:m.just||"",
          manter:m.incluir!==false, sem_analise:!m.natureza});
      });
    }
    saida.sort((a,b)=>b.score-a.score);

    // vagas restantes = capacidade menos quem ja esta confirmado/compareceu.
    // Na sondagem avulsa nao ha jantar nem capacidade: nada limita, o
    // objetivo e ver o potencial inteiro antes de decidir se cria.
    const jaOcupados = J.id
      ? (await rpc("jantar_convidados_listar",{p_jantar_id:J.id}))
          .filter(c => c.status==="confirmado" || c.status==="compareceu").length
      : 0;
    const restantes = J.id ? Math.max(J.capacidade - jaOcupados, 0) : Number.MAX_SAFE_INTEGER;
    const execs = $("#pr-execs").value;
    let vagas=0;
    for(const r of saida){
      if(!r.incluir){ r.manter=false; continue; }
      const assentos = execs==="2" ? (r.exec2_nome?2:1) : 1;
      if(vagas+assentos <= restantes){ r.manter=true; vagas+=assentos; }
      else r.manter=false;
    }

    PROSP = saida;
    $("#pr-status").innerHTML="";
    if(J.id && restantes === 0) aviso("#pr-aviso","O jantar já está com todas as vagas ocupadas — nada foi marcado para manter.","erro");
    desenharProspeccaoJantar();
  }catch(e){
    $("#pr-status").innerHTML="";
    aviso("#pr-aviso", explicar(e));
  }finally{ btn.disabled=false; }
}

function desenharProspeccaoJantar(){
  const box = $("#pr-resultado");
  const execs = $("#pr-execs").value;
  const assentosDe = r => execs==="2" ? (r.exec2_nome?2:1) : 1;
  const dentro = PROSP.filter(r=>r.manter && r.incluir);
  const nConv = dentro.reduce((n,r)=>n+assentosDe(r),0);

  box.innerHTML = `
    <div style="margin-top:10px;">
      <p class="meta" id="pr-contagem" style="margin-bottom:8px;">${dentro.length} empresa(s) · ${nConv} convidado(s) selecionado(s)</p>
      <div class="rolagem"><table>
        <tr><th></th><th>Empresa</th><th>Executivos</th><th>Natureza</th><th>Aderência</th><th>Por quê</th></tr>
        ${PROSP.map((r,i) => `<tr class="linha-clique${r.manter?" marcada":""}" data-i="${i}" ${r.incluir?"":'style="opacity:.5"'}>
          <td><input type="checkbox" class="pr-pick" data-i="${i}" ${r.manter?"checked":""}></td>
          <td><strong>${esc(r.empresa)}</strong>
              ${r.ja_convidado_em?`<br><span class="selo alerta">já em ${esc(r.ja_convidado_em)}</span>`:""}</td>
          <td>${esc(r.exec1_nome||"—")}<br><span class="meta">${esc(r.exec1_cargo||"")}</span></td>
          <td><span class="selo ${r.natureza==="publica"?"erro":r.natureza==="hibrida"?"alerta":"pend"}">${esc(r.natureza)}</span></td>
          <td><span class="selo ${r.score>=70?"ok":r.score>=50?"alerta":"pend"}">${r.score}%</span></td>
          <td class="meta">${esc(r.just||"—")}</td>
        </tr>`).join("")}
      </table></div>
      ${J.id
        ? `<button class="btn" id="pr-salvar" style="margin-top:10px;">Salvar selecionados como convidados</button>`
        : `<button class="btn sec" id="pr-exportar" style="margin-top:10px;">Exportar relatório</button>
           <span class="meta" style="margin-left:8px;">
             Sondagem não grava convidado — crie o jantar na Agenda e traga a seleção de lá.
           </span>`}
    </div>`;

  $$(".pr-pick").forEach(c => c.addEventListener("change", e => {
    PROSP[e.target.dataset.i].manter = e.target.checked;
    e.target.closest("tr").classList.toggle("marcada", e.target.checked);
    const d2 = PROSP.filter(r=>r.manter && r.incluir);
    $("#pr-contagem").textContent =
      `${d2.length} empresa(s) · ${d2.reduce((n,r)=>n+assentosDe(r),0)} convidado(s) selecionado(s)`;
  }));
  // linha inteira clicável: clicar na caixinha em si não deve alternar duas vezes
  $$("#pr-resultado tr.linha-clique").forEach(tr => tr.addEventListener("click", e => {
    if(e.target.type === "checkbox") return;
    const chk = tr.querySelector(".pr-pick");
    chk.checked = !chk.checked;
    chk.dispatchEvent(new Event("change"));
  }));

  if(!J.id){
    // sondagem: o produto e o relatorio, nao o convidado gravado
    $("#pr-exportar").addEventListener("click", () => exportar(
      PROSP.filter(r => r.manter && r.incluir), [
        ["empresa","Empresa"],["segmento","Segmento"],["natureza","Natureza"],
        ["score","Aderência"],["just","Por quê"],
        ["exec1_nome","Executivo"],["exec1_cargo","Cargo"],
        ["exec1_email","E-mail"],["exec1_telefone","Telefone"],
        ["cidade","Cidade"],["estado","UF"],["faturamento","Faturamento"],
        ["ja_convidado_em","Já convidado em"]
      ], `sondagem-${(J.patrocinador_nome||"patrocinador").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.xlsx`,
      "Sondagem"));
    return;
  }

  $("#pr-salvar").addEventListener("click", async () => {
    const b = $("#pr-salvar");
    b.disabled = true; b.textContent = "Salvando…";
    try{
      const r = await rpc("jantar_salvar_selecao", {
        p_jantar_id: J.id,
        p_itens: PROSP.map(x => ({
          gestor_id: x.exec1_id, empresa: x.empresa, score: x.score,
          natureza: x.natureza, justificativa: x.just, manter: x.manter && x.incluir
        }))
      });
      aviso("#pr-aviso", `${r.salvos} convidado(s) adicionados.`, "ok");
      carregarConvidados();
    }catch(e){ aviso("#pr-aviso", explicar(e)); }
    finally{ b.disabled = false; b.textContent = "Salvar selecionados como convidados"; }
  });

// Preenche os seletores com o que existe na base, em vez de lista
// fixa — cidade e estado vem de dado digitado, entao inventar opcoes
// daria filtro que nao casa com nada. (Segmento e a excecao: ali a
// lista e fechada e vem da tabela `segmentos`, com os 14 itens da
// planilha; o banco devolve inclusive os que ainda nao tem ninguem,
// senao nunca daria para filtrar por eles.)
//
// Cada opcao mostra a contagem — "GOVERNO (275)" ajuda a escolher e
// denuncia lixo de cadastro com contagem 1.
async function carregarFiltrosBase(){
  try{
    const f = await rpc("admin_filtros_gestores", {});
    const encher = (sel, valores) => {
      const el = $(sel);
      if(!el) return;
      el.innerHTML = (valores||[])
        .map(o => `<option value="${esc(o.v)}">${esc(o.v)} (${o.n})</option>`).join("");
    };
    encher("#bs-perfil", f.perfis);
    encher("#bs-segmento", f.segmentos);
    encher("#bs-cidade", f.cidades);
    encher("#bs-estado", f.estados);
  }catch(e){ /* filtro e conveniencia: sem ele a busca livre ainda funciona */ }
}

// Valores marcados num <select multiple>. Devolve [] quando nada esta
// marcado, e o banco trata [] como "sem filtro".
function marcados(sel){
  const el = $(sel);
  return el ? Array.from(el.selectedOptions).map(o => o.value) : [];
}

async function buscarNaBase(){
  const termo = $("#bs-busca").value.trim();
  const perfis = marcados("#bs-perfil");
  const segmentos = marcados("#bs-segmento");
  const cidades = marcados("#bs-cidade");
  const estados = marcados("#bs-estado");
  const temFiltro = perfis.length || segmentos.length || cidades.length || estados.length;

  // sem nenhum critério a busca traria a base inteira; com filtro,
  // termo curto é legítimo ("todos os CIOs de saúde em GO")
  if(termo.length < 3 && !temFiltro){
    $("#bs-resultado").innerHTML = "";
    aviso("#bs-aviso", termo.length ? "Digite ao menos 3 letras ou escolha um filtro." : "");
    return;
  }
  aviso("#bs-aviso","");
  $("#bs-resultado").innerHTML = `<p class="carregando">Buscando…</p>`;
  try{
    const l = await rpc("admin_listar_gestores", {
      p_busca: termo || null, p_perfis: perfis,
      p_segmentos: segmentos, p_cidades: cidades, p_estados: estados,
      p_limite: 200, p_offset: 0
    });
    const total = l.length ? Number(l[0].total_geral) : 0;

    $("#bs-resultado").innerHTML = l.length === 0
      ? `<div class="vazio">Ninguém encontrado com esses critérios.</div>`
      : `<div class="barra" style="margin-top:10px;margin-bottom:6px;">
           <div style="min-width:auto;"><label class="check">
             <input type="checkbox" id="bs-todos"> Marcar todos os ${l.length} visíveis</label></div>
           <div style="min-width:auto;">
             <button class="btn" id="bs-add-lote" disabled>Adicionar selecionados</button></div>
           <div style="min-width:auto;">
             <button class="btn sec" id="bs-exportar">Exportar lista</button></div>
         </div>
         <div class="rolagem" style="max-height:320px;"><table>
          <tr><th></th><th>Nome</th><th>Empresa</th><th>Cargo</th><th>Segmento</th><th>UF</th></tr>
          ${l.map(g => `<tr class="linha-clique" data-id="${esc(g.id)}">
            <td><input type="checkbox" class="bs-pick"></td>
            <td>${esc(g.nome)}</td>
            <td class="meta">${esc(g.empresa||"—")}</td>
            <td class="meta">${esc(g.cargo||"—")}</td>
            <td class="meta">${esc(g.segmento||"—")}</td>
            <td class="meta">${esc(g.estado||"—")}</td>
          </tr>`).join("")}
        </table></div>
        <p class="meta" style="margin-top:6px;">
          ${total > l.length
            ? `Mostrando ${l.length} de ${total} — refine os filtros para ver o resto.`
            : `${total} encontrado(s).`}</p>`;

    if(l.length === 0) return;

    const marcados = () => $$("#bs-resultado .bs-pick:checked")
      .map(c => c.closest("tr").dataset.id);

    const sincronizar = () => {
      const n = marcados().length;
      const b = $("#bs-add-lote");
      b.disabled = n === 0;
      b.textContent = n === 0 ? "Adicionar selecionados" : `Adicionar ${n} selecionado(s)`;
    };

    $$("#bs-resultado .bs-pick").forEach(c => c.addEventListener("change", e => {
      e.target.closest("tr").classList.toggle("marcada", e.target.checked);
      sincronizar();
    }));
    $("#bs-todos").addEventListener("change", e => {
      $$("#bs-resultado .bs-pick").forEach(c => {
        c.checked = e.target.checked;
        c.closest("tr").classList.toggle("marcada", e.target.checked);
      });
      sincronizar();
    });
    // linha inteira clicável, mesmo padrão da tabela de prospecção
    $$("#bs-resultado tr.linha-clique").forEach(tr => tr.addEventListener("click", e => {
      if(e.target.type === "checkbox") return;
      const chk = tr.querySelector(".bs-pick");
      chk.checked = !chk.checked;
      chk.dispatchEvent(new Event("change"));
    }));

    $("#bs-exportar").addEventListener("click", () => exportar(
      l.map(g => ({ ...g, telefone: fone(g.telefone) })), [
      ["nome","Nome"],["empresa","Empresa"],["cargo","Cargo"],["email","E-mail"],
      ["telefone","Telefone"],["segmento","Segmento"],["cidade","Cidade"],["estado","UF"]
    ], "convidados-possiveis.xlsx", "Convidados"));

    $("#bs-add-lote").addEventListener("click", async () => {
      const ids = marcados();
      if(!ids.length) return;
      const b = $("#bs-add-lote");
      b.disabled = true; b.textContent = "Adicionando…";
      try{
        const r = await rpc("jantar_adicionar_convidados_existentes", {
          p_jantar_id: J.id, p_gestor_ids: ids, p_rotulo: "CONVIDADO"
        });
        carregarConvidados();
        // re-buscar primeiro: buscarNaBase limpa o aviso ao começar, então
        // a confirmação tem que vir depois, senão some antes de ser lida
        await buscarNaBase();
        aviso("#bs-aviso",
          `${r.adicionados} adicionado(s)` +
          (r.ja_estavam ? ` · ${r.ja_estavam} já estava(m) na lista` : "") + ".", "ok");
      }catch(e){
        aviso("#bs-aviso", explicar(e));
        sincronizar();
      }
    });
  }catch(e){ aviso("#bs-resultado", explicar(e)); }
}

const ROTULO_ST = { sugerido:"Sugerido", convidado:"Convidado",
  confirmado:"Confirmado", recusado:"Recusou", compareceu:"Compareceu" };

async function carregarConvidados(){
  const box = $("#cv-lista");
  box.innerHTML = DS.skeletonLinhas(4, 30);
  try{
    const l = await rpc("jantar_convidados_listar", { p_jantar_id: J.id });
    CONVIDADOS_ATUAL = l;
    box.innerHTML = l.length === 0
      ? `<div class="vazio">Nenhum convidado ainda.</div>`
      : `<div class="rolagem"><table>
          <tr><th>Nome</th><th>Empresa</th><th>Identificação</th><th>Status</th><th></th></tr>
          ${l.map(c => `<tr data-id="${esc(c.id)}">
            <td>${esc(c.nome)}<br><span class="meta">${esc(c.email||"")}</span></td>
            <td>${esc(c.empresa||"—")}</td>
            <td>${c.rotulo ? `<span class="selo alerta">${esc(c.rotulo)}</span>` :
                 c.score!=null ? `<span class="selo ${c.score>=70?"ok":"pend"}">${c.score}%</span>` : "—"}</td>
            <td><span class="selo ${c.status==="compareceu"||c.status==="confirmado"?"ok":c.status==="recusado"?"erro":"pend"}">
                  ${esc(ROTULO_ST[c.status]||c.status)}</span></td>
            <td style="white-space:nowrap;">
              ${c.status !== "confirmado" ? `<button class="btn sec mini st" data-st="confirmado">Confirmar</button>` : ""}
              ${c.status !== "compareceu" ? `<button class="btn ok mini st" data-st="compareceu">Compareceu</button>` : ""}
              ${c.status !== "recusado" ? `<button class="btn sec mini st" data-st="recusado">Recusou</button>` : ""}
              <button class="btn perigo mini remover">Remover</button>
            </td></tr>`).join("")}
        </table></div>`;

    $$(".st", box).forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      b.disabled = true;
      try{
        await rpc("jantar_marcar_convidado", { p_id: tr.dataset.id, p_status: b.dataset.st });
        carregarConvidados();
      }catch(e){ aviso("#aviso-global", explicar(e)); b.disabled = false; }
    }));
    $$(".remover", box).forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      const nome = tr.querySelector("td")?.textContent.trim() || "este convidado";
      if(!(await DS.confirmar(`${nome} sai da lista deste jantar.`,
          {titulo:"Remover convidado?", tom:"perigo", textoConfirmar:"Remover"}))) return;
      try{
        tr.style.opacity = ".4";
        await rpc("jantar_remover_convidado", { p_id: tr.dataset.id });
        carregarConvidados();
      }
      catch(e){ tr.style.opacity = ""; aviso("#aviso-global", explicar(e)); }
    }));
  }catch(e){ aviso(box, explicar(e)); }
}

// O mailing sai de quem FEZ CHECK-IN, nao de quem foi convidado. É a
// lista que serve para follow-up depois do jantar: quem confirmou e não
// apareceu não deve entrar como se tivesse estado lá.
//
// `jantar_checkin_registrar` marca o convidado como "compareceu", então
// o filtro é por esse status. Os dados de contato vêm da listagem de
// convidados, que é onde estão e-mail, telefone e cargo — o check-in
// registra a presença, não o cadastro.
// Etiquetas do jantar: crachá de mesa, não de evento.
//
// A aba Etiquetas do painel é por evento — sai de v_esperados, que se
// apoia em reserva e quarto. Jantar não tem hospedagem nem evento_id,
// então nada daquilo se aplica aqui. O que a mesa precisa é o nome
// como a pessoa quer ser chamada, a empresa e o cargo.
//
// Sai quem foi convidado de fato (recusado fica de fora — não vai
// aparecer), ordenado por nome, que é como as etiquetas são separadas
// na hora de entregar.
async function exportarEtiquetasJantar(){
  try{
    const l = await rpc("jantar_convidados_listar", { p_jantar_id: J.id });
    const vao = l.filter(c => c.status !== "recusado");
    if(vao.length === 0){
      aviso("#aviso-global", "Nenhum convidado ativo neste jantar — as etiquetas sairiam vazias.");
      return;
    }
    exportar(
      vao.slice().sort((a,b) => (a.nome||"").localeCompare(b.nome||"", "pt-BR")),
      [["nome","NOME"],["empresa","EMPRESA"],["cargo","CARGO"],["rotulo","IDENTIFICAÇÃO"]],
      `Etiquetas_${(J.patrocinador_nome||"jantar").replace(/\W+/g,"_")}.xlsx`,
      "Etiquetas");
  }catch(e){ aviso("#aviso-global", explicar(e)); }
}

// Exporta a lista do jantar. Nasceu como "lista de presentes" (só quem
// deu check-in), o que faz sentido DEPOIS do jantar — mas antes dele
// ninguém compareceu, e o botão simplesmente se recusava a exportar.
// Na prática virava um beco: quem queria a lista para convidar não
// tinha como tirar.
//
// Agora exporta os dois casos, e a coluna Status diz quem é quem.
async function exportarMailing(){
  try{
    const l = await rpc("jantar_convidados_listar", { p_jantar_id: J.id });
    if(l.length === 0){
      aviso("#aviso-global", "Este jantar ainda não tem convidados.");
      return;
    }

    const presentes = l.filter(c => c.status === "compareceu");
    let lista = l, sufixo = "convidados";

    if(presentes.length > 0){
      // com gente já presente, perguntar qual das duas listas se quer —
      // os botões dizem a própria escolha, em vez de OK/Cancelar genéricos
      lista = (await DS.confirmar(
        `${presentes.length} de ${l.length} fizeram check-in. Qual lista você quer exportar?`,
        {titulo:"Exportar mailing", textoConfirmar:"Só quem compareceu", textoCancelar:"Todos os convidados"}
      )) ? presentes : l;
      sufixo = lista === presentes ? "presentes" : "convidados";
    }

    exportar(lista.map(c => ({ ...c, telefone: fone(c.telefone) })),
      [["nome","Nome"],["cargo","Cargo"],["empresa","Empresa"],["segmento","Segmento"],
       ["cidade","Cidade"],["estado","UF"],["email","E-mail"],
       ["telefone","Telefone"],["rotulo","Identificação"],["status","Status"]],
      `Mailing_${sufixo}_${(J.patrocinador_nome||"jantar").replace(/\W+/g,"_")}.xlsx`,
      "Mailing");
  }catch(e){ aviso("#aviso-global", explicar(e)); }
}

// =====================================================================
// ABA: ESTATISTICAS
// =====================================================================
// =====================================================================
// ABA: SONDAGEM
//
// Prospectar um patrocinador em POTENCIAL, antes de existir jantar.
// Reaproveita o mesmo caminho da prospecção do jantar (jantar_base +
// análise por IA), só que com J sintético e sem id — jantar_base
// aceita null e passa a olhar a base inteira.
//
// Não grava convidado: o produto aqui é o relatório que vai para a
// conversa comercial. Se o jantar acontecer, ele é criado na Agenda e
// a seleção é refeita lá, já com capacidade de verdade.
// =====================================================================
ABAS.sondagem = async function(){
  $("#conteudo").innerHTML = `
    <h1>Sondagem de patrocinador</h1>
    <p class="sub">
      Roda a mesma análise de aderência da prospecção, sem precisar criar o jantar.
      Serve para levar número para a conversa: quantas empresas da base combinam
      com o que esse patrocinador vende.
    </p>

    <div class="cartao">
      <div class="barra">
        <div><label>Patrocinador em potencial</label>
          <input type="text" id="so-patro" placeholder="Nome da empresa"></div>
        <div><label>Site (ajuda a IA a entender o que ela vende)</label>
          <input type="text" id="so-site" placeholder="https://"></div>
        <div><label>Perfil de convidado desejado</label>
          <input type="text" id="so-perfil" placeholder="Ex.: CIOs de indústria"></div>
      </div>

      <div class="barra">
        <div style="min-width:280px;"><label>Abrangência geográfica</label>
          <input type="text" id="pr-abr" value="Grande Brasília (DF + entorno)"></div>
        <div style="max-width:170px;"><label>Faturamento mínimo</label>
          <input type="text" id="pr-fatmin" placeholder="Ex.: 500 milhões"></div>
        <div style="max-width:200px;"><label>Executivos por empresa</label>
          <select id="pr-execs">
            <option value="1">Só o 1º executivo</option>
            <option value="2">1º e 2º executivo</option>
          </select></div>
      </div>
      <div class="barra">
        <div><label class="check"><input type="checkbox" id="pr-priv" checked> Só empresas privadas</label></div>
        <div><label class="check"><input type="checkbox" id="pr-hib" checked> Incluir híbridas</label></div>
        <div><label class="check"><input type="checkbox" id="pr-forn" checked> Excluir fornecedores</label></div>
        <div><label class="check"><input type="checkbox" id="pr-hist"> Excluir quem já foi convidado antes</label></div>
      </div>
      <div class="barra">
        <div style="min-width:100%;"><label>Observações (opcional)</label>
          <input type="text" id="pr-obs"></div>
      </div>

      <button class="btn" id="pr-rodar">Analisar</button>
      <span class="meta" style="margin-left:8px;">Pesquisa o patrocinador na web e pontua cada empresa da base.</span>
      <div id="pr-aviso"></div>
      <div id="pr-status"></div>
      <div id="pr-resultado"></div>
    </div>`;

  const sincHib = () => { $("#pr-hib").disabled = !$("#pr-priv").checked; };
  $("#pr-priv").addEventListener("change", sincHib);
  sincHib();

  $("#so-patro").addEventListener("input", () => DS.limparInvalido($("#so-patro")));
  $("#pr-rodar").addEventListener("click", () => {
    const nome = $("#so-patro").value.trim();
    if(!nome){
      DS.marcarInvalido($("#so-patro"), "Informe o patrocinador que você quer sondar.");
      $("#so-patro").focus();
      return;
    }
    // J sintético, sem id: é o que faz jantar_base analisar a base
    // inteira e o resto do fluxo pular o que depende de jantar
    J = {
      id: null,
      patrocinador_nome: nome,
      patrocinador_site: $("#so-site").value.trim() || null,
      perfil_convidado:  $("#so-perfil").value.trim() || null,
      capacidade: 0
    };
    rodarProspeccaoJantar();
  });
};

ABAS.estatisticas = async function(){
  const c = $("#conteudo");
  c.innerHTML = DS.skeletonCartoes(2);
  try{
    const [freq, semConvite] = await Promise.all([
      rpc("jantar_estatisticas_gestores", { p_limite: 200 }),
      rpc("jantar_empresas_sem_convite", { p_limite: 200 })
    ]);

    c.innerHTML = `
      <h1>Estatísticas</h1>
      <p class="sub">Frequência de convite, para não repetir sempre os mesmos nomes.</p>

      <div class="cartao">
        <div class="cartao-cab"><h2 style="margin:0;">Quem mais foi convidado</h2>
          <button class="btn sec mini" id="ex-freq">Exportar</button></div>
        <div class="rolagem"><table>
          <tr><th>Nome</th><th>Empresa</th><th>Vezes</th><th>Última vez</th></tr>
          ${freq.map(f => `<tr><td>${esc(f.nome)}</td><td>${esc(f.empresa||"—")}</td>
            <td><span class="selo ${f.vezes>=3?"alerta":"pend"}">${f.vezes}</span></td>
            <td class="meta">${dataBR(f.ultima_vez)}</td></tr>`).join("") ||
            `<tr><td colspan="4" style="color:var(--suave)">Sem histórico ainda.</td></tr>`}
        </table></div>
      </div>

      <div class="cartao">
        <div class="cartao-cab"><h2 style="margin:0;">Empresas que nunca foram convidadas</h2>
          <button class="btn sec mini" id="ex-nunca">Exportar</button></div>
        <p class="sub">Candidatas para as próximas rodadas de prospecção.</p>
        <div class="rolagem"><table>
          <tr><th>Empresa</th><th>Segmento</th><th>Contatos na base</th></tr>
          ${semConvite.map(e => `<tr><td>${esc(e.empresa)}</td>
            <td class="meta">${esc(e.segmento||"—")}</td><td>${e.contatos}</td></tr>`).join("") ||
            `<tr><td colspan="3" style="color:var(--suave)">Nenhuma — todas já foram convidadas.</td></tr>`}
        </table></div>
      </div>`;

    $("#ex-freq").addEventListener("click", () => exportar(freq,
      [["nome","Nome"],["empresa","Empresa"],["vezes","Vezes convidado"],["ultima_vez","Última vez"]],
      "frequencia-convites.xlsx", "Frequência"));
    $("#ex-nunca").addEventListener("click", () => exportar(semConvite,
      [["empresa","Empresa"],["segmento","Segmento"],["contatos","Contatos na base"]],
      "empresas-sem-convite.xlsx", "Sem convite"));
  }catch(e){ aviso(c, explicar(e)); }
};
</script>
</body>
</html>
