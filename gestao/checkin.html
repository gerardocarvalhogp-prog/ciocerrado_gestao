<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in · CIO Cerrado</title>
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="assets/icons/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-system.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="assets/design-system.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--papel);color:var(--texto);
  font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;}

.topo{background:var(--verde);color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;}
.marca{font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;}
.marca span{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;}
.sair{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:var(--raio);padding:4px 10px;font-size:12px;}
.topo-dir{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sel-evento{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:var(--raio);padding:5px 9px;font-size:12.5px;
  font-family:inherit;max-width:220px;}
.sel-evento option{color:var(--texto);}

.wrap{max-width:640px;margin:0 auto;padding:16px 16px 80px;}

/* placar: a informação que a equipe olha o tempo todo */
.placar{display:flex;gap:8px;margin-bottom:14px;}
.placar div{flex:1;background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--raio);padding:11px 10px;text-align:center;}
.placar .n{font-family:'Archivo',sans-serif;font-size:22px;line-height:1.1;}
.placar .r{font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--suave);margin-top:3px;}
.placar .feitos .n{color:var(--verde-med);}
.placar .pend .n{color:var(--ouro);}

/* busca grande: uso no balcão, muitas vezes no celular */
.busca{position:sticky;top:56px;background:var(--papel);padding:10px 0;z-index:9;}
/* abaixo de 640px o cabeçalho quebra em 2-3 linhas (nav + usuário) — a altura
   real deixa de bater com os 56px fixos aqui em cima, e a busca sobrepõe o
   cabeçalho ao rolar. Mais simples que medir altura em JS: o cabeçalho para
   de ser sticky e a busca assume o topo sozinha. */
@media (max-width:640px){
  .topo{position:static;}
  .busca{top:0;}
}
#termo{width:100%;padding:13px 14px;border:2px solid var(--linha);
  border-radius:var(--raio);font-family:inherit;font-size:17px;
  background:var(--superficie);color:var(--texto);}
#termo:focus{border-color:var(--verde);}
.filtros{display:flex;gap:8px;margin-top:8px;}
.chip{background:var(--superficie);border:1px solid var(--linha);
  border-radius:20px;padding:5px 13px;font-size:12.5px;color:var(--suave);}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff;}

.pessoa{background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--raio);padding:12px 13px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;}
.pessoa.feito{background:#F2F7F4;border-color:#C9E0D4;}
.pessoa .info strong{display:block;font-family:'Archivo',sans-serif;font-size:15px;}
.pessoa .info .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--suave);}
.btn{background:var(--verde);color:#fff;border:none;border-radius:var(--raio);
  padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap;}
.btn:disabled{background:#A9B5B0;cursor:not-allowed;}
.btn.sec{background:transparent;color:var(--suave);border:1px solid var(--linha);
  padding:6px 11px;font-size:12.5px;}
.selo{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:2px 7px;
  border-radius:20px;background:#EFEFEA;color:var(--suave);
  text-transform:uppercase;letter-spacing:.04em;}

.aviso{border-radius:var(--raio);padding:11px 13px;font-size:13.5px;margin-bottom:12px;
  border:1px solid var(--linha);background:var(--superficie);}
.aviso.erro{background:#FBF0EE;border-color:#E4CFCB;color:var(--erro);}
.aviso.ok{background:#E8F2EC;border-color:#C9E0D4;color:var(--verde-med);}
.vazio{border:1px dashed var(--linha);border-radius:var(--raio);padding:26px;
  text-align:center;color:var(--suave);font-size:14px;}
.carregando{color:var(--suave);font-size:13.5px;padding:18px 0;text-align:center;}
.oculto{display:none !important;}
.login{max-width:380px;margin:12vh auto;padding:0 20px;}
.login .cartao{background:var(--superficie);border:1px solid var(--linha);
  border-radius:var(--raio);padding:24px;}
.login h1{font-family:'Archivo',sans-serif;font-size:20px;margin:0 0 4px;}
.login p{color:var(--suave);font-size:13.5px;margin:0 0 16px;}
label{display:block;font-size:12px;color:var(--suave);margin-bottom:3px;}
input[type=email],input[type=text]{width:100%;padding:9px 10px;
  border:1px solid var(--linha);border-radius:var(--raio);
  font-family:inherit;font-size:14px;background:var(--superficie);color:var(--texto);}
select{width:100%;padding:9px 10px;border:1px solid var(--linha);
  border-radius:var(--raio);font-family:inherit;font-size:14px;
  background:var(--superficie);color:var(--texto);}
#form-novo label{margin-bottom:3px;}

/* Navegacao entre as telas da equipe. Cada tela e um .html isolado —
   sem isto, trocar de tela exigia saber a URL de cor. */
.ir-para{display:flex;gap:2px;align-items:center;}
.ir-para a{color:rgba(255,255,255,.75);text-decoration:none;font-size:12.5px;
  padding:4px 9px;border-radius:var(--raio);white-space:nowrap;}
.ir-para a:hover{background:rgba(255,255,255,.12);color:#fff;}
.ir-para a[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff;font-weight:600;}
</style>
</head>
<body>

<div id="tela-login" class="login">
  <div class="cartao">
    <h1>Check-in</h1>
    <p>Acesso da equipe. Entre com seu e-mail.</p>
    <div id="login-aviso"></div>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="email">
    <div style="margin-top:12px;">
      <label for="senha" style="margin-top:10px;">Senha</label>
      <input type="password" id="senha" placeholder="sua senha" autocomplete="current-password">
      <button class="btn" id="btn-entrar" style="width:100%;margin-top:12px;">Entrar</button>
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:10px;">
        <button class="btn sec mini" id="btn-esqueci">Esqueci minha senha</button>
        <button class="btn sec mini" id="btn-criar-senha">Criar senha</button>
      </div>
      <p class="meta" style="margin-top:12px;">
        Primeiro acesso? Use <strong>Criar senha</strong> com o e-mail que a
        organização cadastrou. Se preferir entrar sem senha,
        <a href="#" id="link-otp">receba um link por e-mail</a>.
      </p>
    </div>
  </div>
</div>

<div id="app" class="oculto">
  <header class="topo">
    <div class="marca">CIO Cerrado<span>Check-in</span></div>
    <nav class="ir-para" aria-label="Trocar de tela"><a href="admin.html">Painel</a><a href="jantares.html">Jantares</a><a href="checkin.html" aria-current="page">Check-in</a></nav>
    <script>
      // Link de pagina cheia, nao SPA: sem isto, clicar em Painel/Jantares/
      // Check-in perde o "?evento=" da URL atual e volta pro evento padrao.
      // Roda de novo em trocarEvento() (abaixo) — sem isso o link fica
      // preso no evento que a pagina tinha ao carregar, ignorando trocas
      // feitas so pelo seletor, sem reload.
      function atualizarLinksNav(){
        document.querySelectorAll(".ir-para a").forEach(a =>
          a.href = a.getAttribute("href").split("?")[0] + location.search);
      }
      atualizarLinksNav();
    </script>
    <div class="topo-dir">
      <select id="sel-evento" class="sel-evento" title="Evento ativo"></select>
      <button class="sair" id="btn-senha" title="Trocar minha senha">Senha</button>
      <button class="sair" id="btn-sair">Sair</button>
    </div>
  </header>

  <div class="wrap">
    <div class="placar" id="placar"></div>

    <div class="busca">
      <input type="search" id="termo" placeholder="Buscar por nome, empresa ou e-mail" autocomplete="off">
      <div class="filtros">
        <button class="chip" id="f-todos" aria-pressed="true">Todos</button>
        <button class="chip" id="f-pend"  aria-pressed="false">Só pendentes</button>
        <button class="btn sec mini" id="ler-qr" style="margin-left:auto;">Ler QR</button>
      </div>
    </div>

    <div id="aviso"></div>

    <div id="form-novo" class="oculto">
      <div class="pessoa" style="display:block;">
        <strong style="font-family:'Archivo';font-size:15px;display:block;margin-bottom:10px;">
          Cadastrar quem chegou</strong>
        <div style="margin-bottom:8px;">
          <label>Nome completo</label><input type="text" id="n-nome"></div>
        <div style="margin-bottom:8px;">
          <label>Empresa</label><input type="text" id="n-empresa"></div>
        <div style="margin-bottom:8px;">
          <label>E-mail</label><input type="email" id="n-email"></div>
        <div style="margin-bottom:8px;">
          <label>Telefone</label><input type="text" id="n-telefone"></div>
        <div style="margin-bottom:8px;">
          <label>Cargo</label><input type="text" id="n-cargo"></div>
        <div style="margin-bottom:12px;">
          <label>Categoria do crachá</label>
          <select id="n-cat">
            <option value="PROTAGONISTA">Protagonista (CIO)</option>
            <option value="FAMILIAR">Familiar</option>
            <option value="PATROCINADOR">Patrocinador</option>
            <option value="CIO CERRADO">Equipe CIO Cerrado</option>
          </select></div>
        <div id="n-aviso"></div>
        <button class="btn" id="n-salvar" style="width:100%;">Cadastrar e dar check-in</button>
        <button class="btn sec" id="n-cancelar" style="width:100%;margin-top:8px;">Cancelar</button>
      </div>
    </div>

    <div id="lista">
      <div class="skeleton skeleton-cartao" style="margin-bottom:8px;"></div>
      <div class="skeleton skeleton-cartao" style="margin-bottom:8px;"></div>
      <div class="skeleton skeleton-cartao"></div>
    </div>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACAO
// =====================================================================
const SUPABASE_URL  = "https://jlvcjqfrsxxexflvwbvn.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdmNqcWZyc3h4ZXhmbHZ3YnZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY0NTAsImV4cCI6MjEwMTM1MjQ1MH0.SkY0N_k2oaYAqZUpZCmm0GBY3j8vsZzB5oX4Am75MnE";
let EVENTO = new URLSearchParams(location.search).get("evento") || "cerrado2027";
const LOCAL  = new URLSearchParams(location.search).get("local")  || null;
// modo jantar: ?jantar=<uuid> troca o escopo inteiro. Jantar nao tem
// evento_id (design deliberado — jantares sao standalone), entao
// nao da pra reaproveitar checkin_* nem v_esperados aqui.
const JANTAR = new URLSearchParams(location.search).get("jantar") || null;
// modo atividade: ?atividade=<uuid> — presenca de uma atividade especifica
// (ex.: abertura, reuniao exclusiva de uma cota), em vez do check-in geral
// do evento. Atividade TEM evento_id, entao reaproveita v_esperados por
// baixo (atividade_checkin_listar/registrar), so filtrando por atividade_id.
const ATIVIDADE = new URLSearchParams(location.search).get("atividade") || null;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  db: { schema: "gestao" }
});

const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function aviso(texto, tipo="erro"){
  $("#aviso").innerHTML = texto ? `<div class="aviso ${tipo}">${esc(texto)}</div>` : "";
  if(texto && tipo === "ok") setTimeout(() => $("#aviso").innerHTML = "", 2500);
}

function explicar(e){
  const m = e?.message || String(e);
  if(m.includes("Email not confirmed"))
    return "Confirme seu e-mail antes de entrar — enviamos um link de confirmação. Não achou? Confira o spam ou peça pra reenviar.";
  if(m.includes("Invalid login credentials")) return "E-mail ou senha incorretos.";
  if(m.includes("Acesso restrito")) return "Seu e-mail não está cadastrado na equipe.";
  if(m.includes("JWT") || m.includes("session")) return "Sua sessão expirou. Entre novamente.";
  return m;
}

const hora = d => d ? new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "";

async function rpc(nome, params){
  const { data, error } = await sb.rpc(nome, params);
  if(error) throw error;
  return data;
}

// =====================================================================
// LOGIN
// =====================================================================
// =====================================================================
// LOGIN POR SENHA
//
// O magic link continua existindo, como saída de emergência: quem foi
// cadastrado pela organização e nunca entrou não tem senha ainda, e
// quem perde o acesso à caixa de e-mail no meio de um evento não pode
// ficar de fora. Senha é o caminho principal; link é o reserva.
//
// `resetPasswordForEmail` só funciona para quem JÁ existe no Auth —
// quem nunca entrou precisa de "Criar senha", que faz o signUp. Por
// isso os dois botões existem: são situações diferentes com a mesma
// aparência, e juntá-los num só deixaria metade das pessoas presa.
// =====================================================================
function _emailLogin(){
  const v = $("#email").value.trim();
  if(!v){ aviso("#login-aviso","Informe seu e-mail."); return null; }
  return v;
}

$("#btn-entrar").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(!senha){ aviso("#login-aviso","Informe sua senha."); return; }

  const btn = $("#btn-entrar");
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error) throw error;
    // o onAuthStateChange cuida de trocar para a tela do app
  }catch(e){
    aviso("#login-aviso", /invalid login/i.test(e.message || "")
      ? "E-mail ou senha não conferem. Se é seu primeiro acesso, use Criar senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

$("#btn-criar-senha").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const senha = $("#senha").value;
  if(senha.length < 8){
    aviso("#login-aviso","Escolha uma senha de pelo menos 8 caracteres e clique em Criar senha.");
    return;
  }
  const btn = $("#btn-criar-senha");
  btn.disabled = true; btn.textContent = "Criando…";
  try{
    const { error } = await sb.auth.signUp({
      email, password: senha,
      options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso",
      "Senha criada. Se pedirmos confirmação, ela chega por e-mail — depois disso é só entrar.", "ok");
  }catch(e){
    aviso("#login-aviso", /already registered/i.test(e.message || "")
      ? "Esse e-mail já tem cadastro. Use Entrar, ou Esqueci minha senha."
      : explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Criar senha";
  }
});

$("#btn-esqueci").addEventListener("click", async () => {
  const email = _emailLogin(); if(!email) return;
  const btn = $("#btn-esqueci");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.href
    });
    if(error) throw error;
    // A resposta é a mesma existindo ou não a conta, de propósito: dizer
    // "esse e-mail não existe" entrega quem está cadastrado a quem
    // estiver testando endereços.
    aviso("#login-aviso",
      "Se esse e-mail tiver cadastro, enviamos um link para definir a nova senha.", "ok");
  }catch(e){
    aviso("#login-aviso", explicar(e));
  }finally{
    btn.disabled = false; btn.textContent = "Esqueci minha senha";
  }
});

$("#link-otp").addEventListener("click", async (ev) => {
  ev.preventDefault();
  const email = _emailLogin(); if(!email) return;
  try{
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.href }
    });
    if(error) throw error;
    aviso("#login-aviso","Link enviado. Abra seu e-mail para entrar.", "ok");
  }catch(e){ aviso("#login-aviso", explicar(e)); }
});

$("#senha").addEventListener("keydown", e => {
  if(e.key === "Enter") $("#btn-entrar").click();
});

// Volta do link de recuperação: o Supabase já deixou a sessão aberta,
// e o que falta é a pessoa escolher a senha nova. Sem isso ela entra,
// não troca nada, e no próximo acesso está travada de novo.
sb.auth.onAuthStateChange(async (evento) => {
  if(evento !== "PASSWORD_RECOVERY") return;
  const nova = prompt("Digite a nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada. Use ela no próximo acesso.", {tom: error ? "erro" : "ok"});
});

async function trocarMinhaSenha(){
  const nova = prompt("Nova senha (mínimo 8 caracteres):");
  if(!nova) return;
  if(nova.length < 8){ DS.avisar("Senha muito curta.", {tom:"erro"}); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  DS.avisar(error ? ("Não consegui trocar a senha: " + error.message)
              : "Senha alterada.", {tom: error ? "erro" : "ok"});
}
$("#email").addEventListener("keydown", e => { if(e.key==="Enter") $("#btn-entrar").click(); });
$("#btn-senha").addEventListener("click", trocarMinhaSenha);

$("#btn-sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

// =====================================================================
// BOOT
// =====================================================================
let iniciado = false, soPendentes = false, timer;

sb.auth.onAuthStateChange(ev => {
  if(ev === "SIGNED_OUT"){ location.reload(); return; }
  if(!iniciado) iniciar();
});
(async function(){
  const { data } = await sb.auth.getSession();
  if(data?.session) iniciar();
})();

async function iniciar(){
  if(iniciado) return;
  iniciado = true;
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  $("#tela-login").classList.add("oculto");
  $("#app").classList.remove("oculto");

  $("#termo").addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(carregar, 250);
  });
  $("#f-todos").addEventListener("click", () => trocarFiltro(false));
  $("#f-pend").addEventListener("click",  () => trocarFiltro(true));

  await carregarSeletorEventos();
  await carregar(); await placar();
}

// Sem isto, o balcao operava sempre num evento fixo, sem aviso, mesmo
// quando havia mais de um evento "aberto" ao mesmo tempo (achado real
// do QA de usabilidade — mesmo padrao do seletor em admin.html).
async function carregarSeletorEventos(){
  const sel = $("#sel-evento");
  try{
    const evs = await rpc("admin_listar_eventos");

    if(evs.length === 0){
      sel.innerHTML = `<option>Nenhum evento</option>`;
      sel.disabled = true;
      return;
    }

    if(!evs.some(e => e.slug === EVENTO)) EVENTO = evs[0].slug;

    const rotulo = { rascunho:"rascunho", aberto:"aberto", encerrado:"encerrado" };
    sel.innerHTML = evs.map(e => `
      <option value="${esc(e.slug)}" ${e.slug === EVENTO ? "selected" : ""}>
        ${esc(e.nome)} · ${rotulo[e.status] || e.status}
      </option>`).join("");
    sel.disabled = false;

    sel.addEventListener("change", () => trocarEvento(sel.value));
  }catch(e){
    sel.innerHTML = `<option>${esc(EVENTO)}</option>`;
    sel.disabled = true;
  }
}

async function trocarEvento(slug){
  EVENTO = slug;

  // mantem o link compartilhavel: quem copiar a URL abre no mesmo evento
  const u = new URL(location.href);
  u.searchParams.set("evento", slug);
  history.replaceState(null, "", u);
  atualizarLinksNav();

  await carregar(); await placar();
}

function trocarFiltro(pend){
  soPendentes = pend;
  $("#f-todos").setAttribute("aria-pressed", !pend);
  $("#f-pend").setAttribute("aria-pressed",  pend);
  carregar();
}

// cache local da lista do jantar: jantar_checkin_listar nao tem busca
// nem paginacao no servidor porque a lista de um jantar e pequena
// (poucas dezenas) — filtrar aqui e mais simples que criar outra RPC
let JANTAR_CACHE = [];
let ATIVIDADE_CACHE = [];

async function placar(){
  if(JANTAR){
    const feitos = JANTAR_CACHE.filter(p => p.status === "compareceu").length;
    $("#placar").innerHTML = `
      <div><div class="n">${JANTAR_CACHE.length}</div><div class="r">Convidados</div></div>
      <div class="feitos"><div class="n">${feitos}</div><div class="r">Chegaram</div></div>
      <div class="pend"><div class="n">${JANTAR_CACHE.length-feitos}</div><div class="r">Pendentes</div></div>`;
    return;
  }
  if(ATIVIDADE){
    const feitos = ATIVIDADE_CACHE.filter(p => p.checkin_id).length;
    $("#placar").innerHTML = `
      <div><div class="n">${ATIVIDADE_CACHE.length}</div><div class="r">Esperados</div></div>
      <div class="feitos"><div class="n">${feitos}</div><div class="r">Presentes</div></div>
      <div class="pend"><div class="n">${ATIVIDADE_CACHE.length-feitos}</div><div class="r">Pendentes</div></div>`;
    return;
  }
  try{
    const r = await rpc("checkin_resumo", { p_evento_slug: EVENTO });
    $("#placar").innerHTML = `
      <div><div class="n">${r.esperados}</div><div class="r">Esperados</div></div>
      <div class="feitos"><div class="n">${r.feitos}</div><div class="r">Feitos</div></div>
      <div class="pend"><div class="n">${r.pendentes}</div><div class="r">Pendentes</div></div>`;
  }catch(e){ /* placar e acessorio: nao bloqueia o check-in */ }
}

async function carregar(){
  const termo = $("#termo").value.trim();

  if(JANTAR){
    try{
      JANTAR_CACHE = await rpc("jantar_checkin_listar", { p_jantar_id: JANTAR });
    }catch(e){ aviso(explicar(e)); return; }

    const t = termo.toLowerCase();
    const l = JANTAR_CACHE.filter(p =>
      (!t || p.nome.toLowerCase().includes(t) || (p.empresa||"").toLowerCase().includes(t))
      && (!soPendentes || p.status !== "compareceu"));

    $("#lista").innerHTML = l.length === 0
      ? `<div class="vazio">
          ${termo ? `Ninguém encontrado para "${esc(termo)}".`
                  : soPendentes ? "Todos já chegaram." : "Nenhum convidado confirmado ainda."}
          <p class="meta" style="margin-top:10px;">Quem não está na lista se adiciona pela tela de jantares, não por aqui.</p>
        </div>`
      : l.map(p => `
        <div class="pessoa ${p.status==='compareceu' ? "feito" : ""}" data-c="${esc(p.id)}">
          <div class="info">
            <strong>${esc(p.nome)}</strong>
            <span class="meta">${esc(p.empresa||"—")}</span>
          </div>
          ${p.status === "compareceu"
            ? `<div style="text-align:right;">
                 <div class="meta" style="margin-bottom:4px;">✓ ${hora(p.registrado_em)}</div>
                 <button class="btn sec desfazer">Desfazer</button>
               </div>`
            : `<button class="btn marcar">Check-in</button>`}
        </div>`).join("");

    $$(".marcar").forEach(b => b.addEventListener("click", () => marcar(b)));
    $$(".desfazer").forEach(b => b.addEventListener("click", () => desfazer(b)));
    return;
  }

  if(ATIVIDADE){
    try{
      ATIVIDADE_CACHE = await rpc("atividade_checkin_listar", {
        p_atividade_id: ATIVIDADE,
        p_termo: termo || null,
        p_so_pendentes: soPendentes,
        p_limite: 300
      });
    }catch(e){ aviso(explicar(e)); return; }

    $("#lista").innerHTML = ATIVIDADE_CACHE.length === 0
      ? `<div class="vazio">
          ${termo ? `Ninguém encontrado para "${esc(termo)}".`
                  : soPendentes ? "Todos já estão presentes." : "Ninguém esperado ainda."}
        </div>`
      : ATIVIDADE_CACHE.map(p => `
        <div class="pessoa ${p.checkin_id ? "feito" : ""}" data-k="${esc(p.pessoa_key)}" data-c="${esc(p.checkin_id||"")}">
          <div class="info">
            <strong>${esc(p.nome)}</strong>
            <span class="meta">${esc(p.empresa||"—")}</span>
            <span class="selo">${esc(p.categoria)}</span>
          </div>
          ${p.checkin_id
            ? `<div style="text-align:right;">
                 <div class="meta" style="margin-bottom:4px;">✓ ${hora(p.registrado_em)}</div>
                 <button class="btn sec desfazer">Desfazer</button>
               </div>`
            : `<button class="btn marcar">Check-in</button>`}
        </div>`).join("");

    $$(".marcar").forEach(b => b.addEventListener("click", () => marcar(b)));
    $$(".desfazer").forEach(b => b.addEventListener("click", () => desfazer(b)));
    return;
  }

  try{
    const l = await rpc("checkin_listar", {
      p_evento_slug: EVENTO,
      p_termo: termo || null,
      p_so_pendentes: soPendentes,
      p_limite: 300
    });

    if(l.length === 0){
      // buscar e não achar é exatamente quando a recepção precisa
      // cadastrar na hora — o botão aparece aqui, com o nome já digitado
      $("#lista").innerHTML = `<div class="vazio">
        ${termo ? `Ninguém encontrado para "${esc(termo)}".`
                : soPendentes ? "Todos já fizeram check-in." : "Nenhuma pessoa esperada ainda."}
        ${termo ? `<div style="margin-top:14px;">
          <button class="btn" id="abrir-novo">Cadastrar "${esc(termo)}"</button></div>` : ""}
      </div>`;
      const b = $("#abrir-novo");
      if(b) b.addEventListener("click", () => abrirCadastro(termo));
      return;
    }

    $("#lista").innerHTML = l.map(p => `
      <div class="pessoa ${p.checkin_id ? "feito" : ""}" data-k="${esc(p.pessoa_key)}" data-c="${esc(p.checkin_id||"")}">
        <div class="info">
          <strong>${esc(p.nome)}</strong>
          <span class="meta">${esc(p.empresa||"—")}${p.quarto ? " · apto "+esc(p.quarto) : ""}</span>
          <span class="selo">${esc(p.categoria)}</span>
        </div>
        ${p.checkin_id
          ? `<div style="text-align:right;">
               <div class="meta" style="margin-bottom:4px;">✓ ${hora(p.registrado_em)}</div>
               <button class="btn sec desfazer">Desfazer</button>
             </div>`
          : `<button class="btn marcar">Check-in</button>`}
      </div>`).join("");

    $("#lista").insertAdjacentHTML("beforeend",
      `<div style="margin-top:14px;text-align:center;">
         <button class="btn sec" id="abrir-novo2">Não está na lista? Cadastrar</button>
       </div>`);
    $("#abrir-novo2").addEventListener("click", () => abrirCadastro(termo));

    $$(".marcar").forEach(b => b.addEventListener("click", () => marcar(b)));
    $$(".desfazer").forEach(b => b.addEventListener("click", () => desfazer(b)));
  }catch(e){ aviso(explicar(e)); }
}

$("#ler-qr").addEventListener("click", () => {
  DS.lerQR(async (pessoaKey) => {
    try{
      const r = JANTAR
        ? await rpc("jantar_checkin_por_qr", { p_pessoa_key: pessoaKey })
        : ATIVIDADE
          ? await rpc("atividade_checkin_registrar", { p_atividade_id: ATIVIDADE, p_pessoa_key: pessoaKey })
          : await rpc("checkin_registrar", {
              p_evento_slug: EVENTO, p_pessoa_key: pessoaKey, p_local: LOCAL });
      aviso(r.ja_estava
        ? `${r.nome} já tinha feito check-in às ${hora(r.registrado_em)}.`
        : `${r.nome} · check-in registrado.`, "ok");
      await carregar(); await placar();
    }catch(e){ aviso(explicar(e)); }
  });
});

async function marcar(btn){
  const card = btn.closest(".pessoa");
  btn.disabled = true; btn.textContent = "…";

  if(JANTAR){
    try{
      await rpc("jantar_checkin_registrar", { p_convidado_id: card.dataset.c });
      aviso(`${card.querySelector("strong").textContent} · check-in registrado.`, "ok");
      await carregar(); await placar();
    }catch(e){
      aviso(explicar(e));
      btn.disabled = false; btn.textContent = "Check-in";
    }
    return;
  }

  if(ATIVIDADE){
    try{
      const r = await rpc("atividade_checkin_registrar", { p_atividade_id: ATIVIDADE, p_pessoa_key: card.dataset.k });
      aviso(r.ja_estava
        ? `${r.nome} já estava presente.`
        : `${r.nome} · presença registrada.`, "ok");
      await carregar(); await placar();
    }catch(e){
      aviso(explicar(e));
      btn.disabled = false; btn.textContent = "Check-in";
    }
    return;
  }

  try{
    const r = await rpc("checkin_registrar", {
      p_evento_slug: EVENTO, p_pessoa_key: card.dataset.k, p_local: LOCAL });

    // segunda leitura do mesmo crachá não é erro: avisa e segue
    aviso(r.ja_estava
      ? `${r.nome} já tinha feito check-in às ${hora(r.registrado_em)}.`
      : `${r.nome} · check-in registrado.`, "ok");

    await carregar(); await placar();
  }catch(e){
    aviso(explicar(e));
    btn.disabled = false; btn.textContent = "Check-in";
  }
}

function abrirCadastro(termo){
  $("#form-novo").classList.remove("oculto");
  $("#n-nome").value = termo || "";
  ["#n-empresa","#n-email","#n-telefone","#n-cargo"].forEach(s => $(s).value = "");
  $("#n-aviso").innerHTML = "";
  $("#n-nome").focus();
  $("#form-novo").scrollIntoView({ behavior:"smooth", block:"nearest" });
}

$("#n-cancelar").addEventListener("click", () => {
  $("#form-novo").classList.add("oculto");
});

$("#n-nome").addEventListener("input", () => DS.limparInvalido($("#n-nome")));

$("#n-salvar").addEventListener("click", async () => {
  const nome = $("#n-nome").value.trim();
  if(!nome){
    DS.marcarInvalido($("#n-nome"), "Informe o nome.");
    $("#n-nome").focus();
    return;
  }

  const b = $("#n-salvar");
  b.disabled = true; b.textContent = "Cadastrando…";
  try{
    const r = await rpc("checkin_cadastrar", {
      p_evento_slug: EVENTO,
      p_nome: nome,
      p_empresa:  $("#n-empresa").value.trim()  || null,
      p_email:    $("#n-email").value.trim()    || null,
      p_telefone: $("#n-telefone").value.trim() || null,
      p_cargo:    $("#n-cargo").value.trim()    || null,
      p_categoria: $("#n-cat").value,
      p_local: LOCAL
    });

    // reaproveitou cadastro existente: vale avisar, senão a recepção
    // acha que criou duplicata
    aviso(r.gestor_reaproveitado
      ? `${r.nome} já estava na base — check-in registrado.`
      : `${nome} cadastrado e com check-in registrado.`, "ok");

    $("#form-novo").classList.add("oculto");
    $("#termo").value = "";
    await carregar(); await placar();
  }catch(e){
    $("#n-aviso").innerHTML = `<div class="aviso erro">${esc(explicar(e))}</div>`;
  }finally{
    b.disabled = false; b.textContent = "Cadastrar e dar check-in";
  }
});

async function desfazer(btn){
  const card = btn.closest(".pessoa");
  btn.disabled = true; btn.textContent = "…";
  try{
    await rpc(JANTAR ? "jantar_checkin_desfazer" : "checkin_desfazer",
      JANTAR ? { p_convidado_id: card.dataset.c } : { p_checkin_id: card.dataset.c });
    await carregar(); await placar();
  }catch(e){
    aviso(explicar(e));
    btn.disabled = false; btn.textContent = "Desfazer";
  }
}
</script>
</body>
