# =====================================================================
# Netlify · CIO Cerrado
#
# ATENCAO AO DIRETORIO DE PUBLICACAO.
#
# Esta pasta e a raiz do site. Ela serve DOIS sistemas:
#
#   /              sistema de agendamento de massagem  (EM PRODUCAO)
#   /gestao/       sistema de gestao de eventos
#
# Publicar a partir de gestao/ substituiria o site inteiro e derrubaria
# o agendamento de massagem.
#
# E NAO publique a raiz direto: o publish e "_site", nao ".".
#
# Publicar "." colocava codigo-fonte no ar. Conferido em 24/08/2026,
# todos respondendo 200:
#
#   /schema.sql          /gestao/CLAUDE.md
#   /gestao/integracao.py    /gestao/supabase/seed.sql
#
# Dado pessoal nao vazou (os .csv e as planilhas estao no .gitignore e
# o CLI pulou), mas o mapa inteiro do banco ficou publico — junto com a
# chave anon, que e publica por design. O preparar-site.js monta o
# _site so com o que e web E esta versionado.
#
#   node preparar-site.js
#   netlify deploy --dir=_site            (preview, gera URL temporaria)
#   netlify deploy --dir=_site --prod     (producao)
#
# Rode sempre desta pasta, nunca de dentro de gestao/ — e rode o
# preparar-site antes de cada deploy: o _site nao se atualiza sozinho.
# =====================================================================

[build]
  publish = "_site"
  # O site e estatico: os .html carregam supabase-js e SheetJS por CDN.
  # O preparar-site.js nao compila nada, so escolhe o que pode ir ao
  # ar; por isso fica fora do build do Netlify e roda na mao.
  command = "node preparar-site.js"

# Sem cache no HTML: as telas carregam a chave anon e o slug do evento
# em constantes no proprio arquivo. Com cache longo, uma correcao
# publicada demora a chegar em quem ja abriu a pagina antes.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/gestao/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imagens e icones mudam pouco.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# As telas nao devem ser indexadas: sao paineis operacionais, com dados
# de participantes atras do login.
[[headers]]
  for = "/gestao/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
